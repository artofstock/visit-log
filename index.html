  방문일지 (Visit Log) v25.2
  =========================
  v25.1 → v25.2 개선 사항:
  1. (오류 수정) v25에서 항목을 새로 짤 때 방문예정자명이 빠져 있던 문제
     수정. 카드 항목을 [방문담당자명 → 방문주소 → 방문예정자명 → 휴대폰번호
     → 생년월일 → 특이사항] 순으로 구성해 방문예정자명을 추가함.
     - 빠른 검색 범위, 복사(텍스트)/저장(HTML) 리포트, 검색 결과 카드에도
       방문예정자명이 함께 표시·검색되도록 반영.
     - v25.1까지 이미 저장해둔 기록은 방문예정자명이 빈 값으로 남아있으며,
       카드를 열어 새로 입력하면 됨(기존 항목은 그대로 보존).

  v25 → v25.1 개선 사항:
  1. (디자인) 방문주소 입력칸을 한 줄짜리 입력창(가로 스크롤)에서 2줄까지
     자동 줄바꿈되는 입력칸으로 변경:
     - 주소가 길어지면 뒷부분이 옆의 "네이버맵 길찾기" 버튼에 가려 안 보이던
       문제 → 버튼을 주소 아래로 내리고, 주소 칸 자체를 세로로 2줄까지
       늘어나게 해서 전체 주소가 한눈에 보이도록 함.
     - 물리 키보드의 Enter 키나 붙여넣기로 실제 줄바꿈이 섞여 들어가지
       않도록 막아, 저장되는 주소 값 자체는 예전처럼 한 줄 텍스트로 유지.

  v24 → v25 개선 사항:
  1. (기능) 폐업법인 방문(주소 중심) 구성 → 방문예정자 중심 구성으로 전면 개편:
     - 카드 항목을 [방문담당자명 → 방문주소 → 상호 → 변경상호 → 특이사항]에서
       [방문담당자명 → 방문주소 → 휴대폰번호 → 생년월일 → 특이사항]으로 변경.
     - 생년월일 입력 시 만 나이가 옆에 자동으로 계산되어 표시됨(입력 즉시 갱신,
       저장되는 값이 아니라 매번 오늘 날짜 기준으로 새로 계산).
     - 휴대폰번호는 숫자를 입력하면 010-1234-5678 형식으로 자동 정리됨.
     - 빠른 검색 범위, 복사(텍스트)/저장(HTML) 리포트, 검색 결과 카드도
       모두 새 항목 구성(휴대폰번호/생년월일/나이)으로 함께 갱신.
     - 예전 데이터(상호/변경상호 저장 형식)와는 항목 구성이 달라 자동
       변환되지 않음 — 폐업법인 방문이 끝난 시점 이후의 새 기록부터 사용.
  2. (기능) 내비게이션 앱을 네이버맵 하나로 고정, T맵 지원 제거:
     - 설정 패널의 T맵/네이버맵 선택 토글을 삭제(항상 네이버맵으로 열림).
     - T맵 URL Scheme·스토어 링크·관련 저장값(localStorage 선택값)을
       모두 제거해 코드를 단순화.
  3. (디자인) 새 버전 구분을 위해 전체 색상 테마를 초록/적갈색 계열에서
     남색(인디고)/황갈색(앰버) 계열로 변경. 배경·카드·테두리·그림자
     톤도 함께 손질해 예전 버전과 한눈에 구분되도록 함.

  v23 → v24 개선 사항:
  1. (기능) 카드 삭제 추가:
     - 각 카드 오른쪽 위 휴지통 버튼으로 그 카드 하나만 지울 수 있음.
       뒤 카드들의 번호는 자동으로 하나씩 당겨짐.
     - 내용이 들어 있는 카드는 앱 안에 직접 만든 확인창을 한 번 띄움
       (설치된 PWA에서 window.confirm 이 안 뜨는 문제를 피하려고 v15와
        같은 이유로 자체 모달을 씀). 빈 카드는 확인 없이 바로 지움.
     - 지운 직후 6초 동안 "되돌리기" 버튼이 토스트에 뜸 → 오탭해도 복구 가능.
     - 카드가 1개만 남으면 삭제 버튼은 숨김 (최소 1개는 유지).
     - 저장 데이터의 카드 개수를 그대로 복원하도록 normalizeVisits 수정.
       v23까지는 최소 4개로 강제 보정해서, 4개 아래로 지워도 다시 열면
       빈 카드가 되살아났음.
  2. (기능) 엑셀 주소 가져오기의 덮어쓰기 확인창도 위와 같은 자체 모달로 교체
     (기존 window.confirm 은 설치형 PWA에서 안 뜰 수 있었음).
  3. (디자인) 화면 정리 — 항상 떠 있던 컨트롤을 줄여 첫 화면을 비움:
     - 헤더: 장식용 눈썹줄("FIELD VISIT LOG …")과 큰 제목을 없애고
       앱 이름 + 작성 진행칩 한 줄로 합침. 오전/오후/메모 탭은 세그먼트형으로.
     - 검색줄(범위+입력+버튼)을 상시 노출에서 돋보기 버튼 안으로 접음
       → '오늘 기록 / 지난 기록 / 돋보기' 한 줄로 통합(2줄 → 1줄).
     - 자동저장·5분 임시저장·내비앱 3줄을 "● 자동 저장됨 … [설정]" 한 줄로
       합치고, 나머지는 [설정]을 눌렀을 때만 펼쳐지는 패널로 옮김.
     - 하단 5버튼([불러오기][복사][주소 가져오기][주소 내보내기][저장])을
       [파일][복사][저장] 3개로 줄임. 파일 관련 3가지는 [파일] 메뉴 안에
       설명과 함께 들어감 (12px 글자가 2줄로 줄바꿈되던 문제 해소).
     - 카드 머리의 "방문 N / M" 문구 삭제(번호 배지와 중복).
     - 항목마다 상시 표시되던 글자수(0/80 …)를 입력 중이거나 한도의 80%를
       넘었을 때만 보이게 함 (카드당 5개 × 카드 수만큼 사라짐).
     - "N번 → N+1번 구간 경로" 버튼을 앞뒤 카드에 주소가 둘 다 있을 때만 표시.
     - 순서 정렬 안내문은 순서 칸을 한 번도 안 쓴 상태에서만 표시.
     - 모서리 반경(0/3/6/8px 혼재) · 테두리 굵기(1.3/1.5/2px 혼재) ·
       그림자(딱딱한 3px 3px 0 과 부드러운 그림자 혼재)를 토큰 3단계로 통일.
     - 배경 줄무늬 텍스처 농도를 낮춤(opacity .5 → .34, 간격 28px → 32px).
  4. (버그) 빠른 검색 결과 머리글의 "방문 N / 4"가 카드 수와 무관하게 항상
     4로 찍히던 것 수정 → 그 기록의 실제 카드 수로 표시.

  v22 → v23 개선 사항:
  1. (보안) 불러오기(파일 불러오기)를 통한 저장형 XSS 취약점 수정:
     - 카드 화면의 "방문시각" 표시가 innerHTML 템플릿에 이스케이프 없이
       삽입되고 있었음. 방문시각은 평소엔 앱이 자동으로 찍는 값(예: 14:03:22)
       이라 문제가 없지만, 조작된 .txt/.json/.html 파일을 "불러오기"로
       열면 그 안의 시각 값에 스크립트 코드가 심어져 있어도 그대로
       실행될 수 있는 구조였음.
     - 방문시각을 화면에 표시할 때 HTML 이스케이프 처리하도록 수정하고,
       불러오기로 들어오는 시각 값의 길이도 제한(최대 40자)해서 원천
       차단. 다른 항목(주소/상호/특이사항 등)은 이미 입력폼(.value)으로
       렌더링되어 원래부터 안전했음 — 확인 완료.
     - 빠른 검색 결과 표시는 이미 escapeHtml()로 안전하게 처리되고
       있었음 — 별도 수정 불필요, 확인만 진행.
  2. (점검) 하드코딩된 API 키/서버 연동 여부 전수 점검 — 주소 검색에
     쓰는 Nominatim(OpenStreetMap)은 키가 필요 없는 공개 서비스라
     노출될 비밀 정보 없음. v22에서 삭제한 Firebase 외에 외부 서버로
     데이터를 보내는 코드는 없음을 확인.
  3. (참고) 저장된 방문 기록은 기기 로컬 저장소(브라우저 저장소)에
     암호화 없이 저장됩니다. 기기 자체의 화면 잠금이 최종 방어선이니,
     업무용 기기에는 화면 잠금을 꼭 설정해 두시는 걸 권장합니다.

  v21 → v22 개선 사항:
  1. (보안) '공유코드' 기능 전체 삭제:
     - 하단 액션바의 '공유코드' 버튼 제거.
     - 관련 Firebase(Firestore) 연동 코드, 6자리 코드 생성/조회, PIN
       암호화(AES-GCM) 로직을 전부 삭제. 앱이 더 이상 외부 서버와
       통신하지 않음(내비게이션 지도 앱 실행, 주소 검색 제외).
     - 이유: 이 앱은 개인 전용으로 사용 중이며, 6자리 코드는 인증 없이
       추측/무차별 대입으로 접근을 시도할 수 있는 구조라 악용 소지가
       있어 기능 자체를 없앰.
     - 저장(.html)/복사/불러오기(.txt·.json·.html) 등 기기 안에서만
       처리되는 기존 기능은 전부 그대로 유지됨.

  v20 → v21 개선 사항:
  1. "메모" 탭 추가 (오전/오후 옆):
     - 오전/오후와 별개로, 날짜 하나당 최대 2000자짜리 메모장 하나가
       추가됨. 하루 전체에 대한 요약이나 참고사항을 자유롭게 적을 수
       있음 (오전/오후 카드 내용과는 별도로 저장됨).
     - 입력하면 자동 저장(0.6초 디바운스, 카드 입력과 동일한 방식).
     - '공유코드'로 보낼 때 현재 카드 기록과 함께 메모도 같이 암호화되어
       전달됨 — 받는 사람이 코드+잠금번호를 입력하면 메모까지 그대로
       복원됨. 메모만 있고 카드가 비어 있어도 공유 가능.
     - '저장'(HTML 파일)과 '복사'(텍스트)에도 메모 내용이 함께 포함됨.
  2. 전체적인 디자인 다듬기: 카드/버튼/입력창에 부드러운 모서리와
     은은한 그림자를 더해 화면에 입체감을 주고, 버튼 눌림 효과와
     화면 전환에 부드러운 트랜지션을 추가해 조작감을 개선.

  v19 → v20 개선 사항:
  1. 오전 / 오후 기록 분리:
     - 날짜 아래에 "오전 / 오후" 탭이 추가됨. 같은 날짜라도 오전 방문과
       오후 방문을 완전히 별도의 카드 묶음으로 나눠서 기록·저장.
     - 저장 키가 날짜+오전/오후 단위로 나뉘어(예: 2026-08-21 오전 /
       2026-08-21 오후) 서로 덮어쓰지 않음.
     - 앱을 열면 현재 시각 기준으로 정오 이전이면 오전, 이후면 오후 탭이
       자동으로 먼저 선택됨. 탭을 눌러 언제든 전환 가능.
     - '지난 기록' 목록과 '빠른 검색' 결과에도 오전/오후가 함께 표시되어
       구분됨.
     - v19 이전 데이터(오전/오후 구분이 없던 기존 기록)는 자동으로
       "오전" 기록으로 인식되어 그대로 이어서 볼 수 있음 (데이터 유실 없음).

  v18 → v19 개선 사항:
  1. 방문시각 자동 기록 방식 변경: "처음 입력한 시각"만 기록하던 것을,
     그 카드의 아무 항목이든 새로 수정할 때마다 최신 수정 시각으로
     계속 갱신되도록 변경. (예: 10시에 상호를 적었다가, 실제 방문지에서
     변경상호를 고쳐 입력하면 그 수정한 시각으로 다시 기록됨— 즉 "최초
     작성 시각"이 아니라 "최종 수정 시각"을 반영)
     내용을 다 지워서 빈 칸이 되면 시각은 갱신하지 않음.
     수동으로 다시 찍고 싶을 때 쓰는 "재기록" 버튼은 그대로 유지.

  v17 → v18 개선 사항:
  1. 카드 개수를 4개 고정 → 최대 20개까지 늘릴 수 있도록 변경:
     - 기본은 이전처럼 4개만 보임
     - 화면 하단 "+ 카드 추가" 버튼을 누르면 카드가 1개씩 늘어남
       (최대 20개, 다 채우면 버튼이 "카드는 최대 20개까지..." 로 바뀌며 비활성화)
     - 저장/불러오기/공유코드/링크 등 기존 기능은 카드 개수에 상관없이
       그대로 동작 (4개든 20개든 실제 만든 개수만큼 저장·전송됨)

  v16 → v17 개선 사항:
  1. (디버깅) 공유코드 서버 오류 메시지에 상세 원인 코드 표시:
     - "서버 연결에 실패했습니다 (permission-denied)" 처럼 Firebase가
       반환한 오류 코드를 같이 보여줘서 원인 파악이 쉬워짐.

  v15 → v16 개선 사항:
  1. 공유 방식을 "링크" → "6자리 공유코드"로 전환 (Firebase Firestore 사용):
     - '공유코드' 버튼 → "코드 만들어 보내기" / "코드 입력해서 받기" 중 선택
     - 보내기: 잠금번호로 데이터 암호화(AES-GCM, 기존과 동일한 방식) 후
       Firestore에 저장, 6자리 코드 발급 (24시간 후 자동 만료)
     - 받기: 6자리 코드 입력 → 서버에서 암호문 조회 → 잠금번호 입력해서
       복호화 → 확인 후 화면에 반영
     - 코드만 알아도 잠금번호 없인 내용을 볼 수 없어 이중 보호 유지
     - 이 기능은 인터넷 연결이 필요함 (Firestore 서버 통신)

  v14 → v15 개선 사항:
  1. (버그 수정) 잠금번호 입력창이 안 뜨던 문제 해결:
     - 홈 화면에 설치된 PWA(standalone 모드)에서는 브라우저 내장
       window.prompt()/confirm() 팝업이 아예 뜨지 않는 경우가 있음
       → 앱 안에 직접 만든 입력창(모달)으로 교체. 설치된 앱이든 일반
       브라우저든 항상 동일하게 동작함.

  v13 → v14 개선 사항:
  1. (보안) '링크공유'에 잠금번호(PIN) 암호화 적용:
     - 공유 시 4자리 이상 잠금번호를 직접 정하고, 그 번호로 AES-GCM
       암호화(브라우저 내장 Web Crypto API, 외부 라이브러리 없음)해서
       링크에 담음. 잠금번호는 카톡이 아닌 별도 경로(전화 등)로 전달.
     - 받는 사람이 링크를 열어도 잠금번호를 모르면 내용을 볼 수 없음
       → 실수로 엉뚱한 사람에게 전송해도 방문 기록이 노출되지 않음.
     - 잠금번호가 맞아도 "OO 기록 N건을 불러올까요?" 확인창을 한 번 더
       띄워서, 실수로 현재 화면 내용을 덮어쓰는 것도 방지.

  v12 → v13 개선 사항:
  1. '링크공유' 기능 추가: 서버/DB 없이, 오늘 기록을 URL(#data=...)에
     담아 카톡 등으로 전송 가능. 받는 사람이 그 링크를 열면 자동으로
     해당 기록이 채워짐. 카메라(QR 스캔) 불필요, 텍스트 링크만 오가면 됨.
     - 외부 라이브러리 없이 브라우저 내장 기능(UTF-8 safe Base64)만 사용
       → 오프라인(PWA)에서도 100% 동일하게 동작.
     - '링크공유' 버튼: 현재 보고 있는 날짜의 기록을 링크로 만들어
       공유 시트(카톡 등)를 띄우거나, 지원 안 되면 클립보드에 복사.
     - 앱 접속 시 주소 뒤에 #data=... 가 있으면 자동으로 해석해서
       화면에 채우고, 처리 후 주소는 깨끗하게 정리(재접속 시 중복 방지).
     - 기존 저장(.html)/복사/불러오기(.txt·.json·.html)는 그대로 유지.

  v11 → v12 개선 사항:
  1. '저장' 결과물을 텍스트(.txt)에서 웹 페이지(.html)로 변경:
     - 저장 버튼을 누르면 그 날짜의 기록이 예쁘게 표 형식으로 정리된
       HTML 파일로 저장/공유됨 → 브라우저로 열면 바로 보고 인쇄 가능.
     - 파일 안에 기록 데이터(JSON)도 함께 내장되어 있어서, 앱의
       '불러오기'로 이 HTML 파일을 선택하면 기록이 그대로 복원됨.
       (기존 .txt/.json 파일 불러오기도 계속 지원)

  v10 → v11 개선 사항:
  1. 검색 범위 선택 추가: 검색창 왼쪽의 범위 선택(전체/담당자명/주소/
     상호/변경상호/특이사항)으로 검색 대상 항목을 제한 가능.
     - '전체'는 기존처럼 카드 전체를 그룹으로 검색.
     - '담당자명'으로 검색하면 방문담당자명 항목에만 해당 단어가 있는
       카드만 나열되어, 특이사항에 이름이 적힌 다른 담당자의 카드가
       섞여 나오는 혼란을 막을 수 있음.
     - 범위를 좁혀 검색하면 결과 상단에 [범위: 항목명]이 표시됨.
  2. 특이사항 글자수 제한 50자 → 100자로 확대.

  v9 → v10 개선 사항:
  1. 입력 항목 순서 변경: 방문담당자명을 맨 위(방문주소 위)로,
     특이사항은 맨 아래로. (저장 키 이름은 그대로라 기존 데이터와
     100% 호환됩니다)
  2. 검색 결과에 '일치 항목' 태그 표시: 카드 그룹 단위 검색이라
     주소/상호/특이사항 등 어떤 항목이 일치해도 카드가 나오는데,
     어느 항목이 일치했는지 안 보여서 "이름이 바뀐 것처럼" 보일 수
     있던 문제 → 각 결과 카드에 일치한 항목을 명확히 표시.
     결과 카드 머리에도 담당자 이름을 바로 보이게 추가.
  3. 브라우저 자동완성(autofill) 오염 방지: 모바일 브라우저가 한 카드에
     입력한 담당자 이름을 다른 카드의 담당자란에도 자동으로 채워
     저장해버리는 사례 방지 (autocomplete/data-lpignore 속성 강화).

  v8 → v9 개선 사항:
  1. 빠른 검색 기능 추가: 상단 검색창 + 검색 버튼(또는 Enter)으로
     모든 날짜의 기록에서 단어가 포함된 카드를 찾아 아래에 전체 나열.
     - 카드 1장을 하나의 그룹으로 검색 (주소/상호/변경상호/특이사항/
       담당자/시각 중 하나라도 단어가 포함되면 해당 카드가 결과에 표시)
     - 결과에 검색 단어를 노랗게 하이라이트
     - 결과 카드를 누르면 해당 날짜 기록으로 바로 이동
     - '닫기' 버튼으로 검색 결과를 닫고 원래 화면으로 복귀

  v7 → v8 개선 사항:
  1. (치명적 버그) 저장소가 window.storage(특수 환경 전용)에만 의존해서
     일반 브라우저에서 열면 저장이 전혀 되지 않던 문제 수정
     → window.storage 가 없으면 localStorage 를 쓰는 어댑터 추가.
     이제 크롬/사파리/삼성 인터넷 등 어떤 브라우저에서도 데이터가 유지됨.
  2. 방문주소 글자수 제한 50자 → 80자로 확대.
  3. 상단에 작성 진행 칩 "작성 n/4" 추가.
  4. 5분 자동 백업 방식 변경: 브라우저에서 5분마다 파일 다운로드를
     강제로 띄우던(브라우저가 차단하거나 다운로드 폴더가 지저분해지던)
     방식 → 기기 내부 저장소에 조용히 백업하는 방식으로 교체.
  5. '저장' 파일명에 날짜+시각(시분) 포함 → 누를 때마다 새 파일,
     실수로 눌러도 이전 파일을 덮어쓰지 않음.
  6. 불러오기: .txt 리포트뿐 아니라 .json 저장 파일도 지원.
  7. 손상된 저장 데이터(배열 길이 부족, 타입 오류 등)를 만나도
     앱이 죽지 않고 안전하게 보정해서 표시.
  8. 화면 이탈(다른 앱 전환/탭 닫기) 시 즉시 저장 — 입력 직후
     나가도 마지막 글자까지 유실되지 않음.
  9. 지난 기록 목록에서 백업/설정 키와 깨진 날짜 키 제외.
  10. 공유/다운로드 폴백의 objectURL 해제 타이밍 수정
      (즉시 해제하면 일부 브라우저에서 다운로드가 취소될 수 있음).
  11. 모바일 키보드 편의: 입력란 enterkeyhint="next" 적용,
      폰트에 맑은고딕 폴백 추가.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     디자인 토큰 (v25)
     v24까지 쓰던 초록/적갈색(teal/brick) 계열을 v25에서 남색(인디고)/
     황갈색(앰버) 계열로 교체. 변수 이름은 코드 영향 최소화를 위해
     --teal*, --brick* 그대로 유지하고 값만 바꿨다.
     =================================================================== */
  :root{
    /* 표면 */
    --paper:#EEF1F7;
    --paper-2:#E1E6F1;
    --card:#FBFCFE;
    --field:#FFFFFF;

    /* 글자 */
    --ink:#1E2438;
    --ink-soft:#5A6478;
    --ink-faint:#98A0B8;

    /* 강조 (구 teal 자리 → 인디고, 구 brick 자리 → 앰버) */
    --teal:#3E4F8A;
    --teal-dark:#232C4F;
    --teal-pale:#E1E5F5;
    --brick:#B5692A;
    --brick-pale:#F6E7D6;

    /* 선 */
    --line:#D7DCE9;
    --line-strong:#B6C0D6;

    /* 모서리 — 3단계로 고정 */
    --r-sm:7px;
    --r-md:10px;
    --r-lg:14px;
    --r-pill:999px;

    /* 그림자 — 3단계로 고정 */
    --sh-1:0 1px 2px rgba(30,36,56,.06);
    --sh-2:0 2px 8px -3px rgba(30,36,56,.18), 0 1px 2px rgba(30,36,56,.06);
    --sh-3:0 14px 34px -12px rgba(30,36,56,.36), 0 3px 8px rgba(30,36,56,.12);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 460px at 50% -140px, rgba(255,255,255,.5), transparent 62%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
    font-size:14px;
    -webkit-text-size-adjust:100%;
    min-height:100vh;
    padding-bottom:84px;
  }
  button, input, textarea, select{
    font-family:inherit;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease,
                box-shadow .15s ease, opacity .15s ease, transform .09s ease;
  }
  .hide{ display:none !important; }

  /* 장부 느낌의 배경 줄무늬 — v23의 절반 이하 농도로 낮춰 배경으로만 남긴다 */
  .bg-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.34;
    background-image: repeating-linear-gradient(180deg, transparent, transparent 31px, var(--line) 32px);
  }

  /* ------------------------------- 헤더 ------------------------------- */
  header{
    position:relative; z-index:1;
    padding:14px 16px 14px;
    border-bottom:1px solid var(--line-strong);
    background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,0) 80%);
  }
  .app-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:12px;
  }
  .brand{
    font-family:'Noto Serif KR','Malgun Gothic',serif;
    font-weight:700; font-size:20px; margin:0;
    letter-spacing:-.01em; display:flex; align-items:baseline; gap:6px;
  }
  .ver-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:500; letter-spacing:.04em;
    color:var(--ink-faint);
  }
  .progress-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; font-weight:600; color:var(--teal-dark);
    border:1px solid rgba(35,44,79,.28); background:var(--teal-pale);
    padding:4px 9px; white-space:nowrap; border-radius:var(--r-pill);
  }

  .date-nav{ display:flex; align-items:center; gap:8px; }
  .date-nav button{
    width:38px; height:40px; flex-shrink:0;
    border-radius:var(--r-sm); border:1px solid var(--line-strong);
    background:var(--card); color:var(--ink-soft);
    font-size:18px; font-family:'IBM Plex Mono',monospace; line-height:1;
    cursor:pointer; box-shadow:var(--sh-1);
  }
  .date-nav button:active{ background:var(--paper-2); color:var(--ink); transform:scale(.97); }
  .date-display{
    flex:1; min-width:0; height:40px;
    border:1px solid var(--line-strong); background:var(--card);
    padding:0 12px; border-radius:var(--r-sm);
    display:flex; align-items:center; gap:8px;
    box-shadow:var(--sh-1);
  }
  .date-display input[type=date]{
    border:none; background:transparent; padding:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px; font-weight:600; color:var(--ink);
    flex:1; min-width:0;
  }
  .date-display input[type=date]:focus{ outline:none; }
  .weekday{ color:var(--teal-dark); font-size:13px; font-weight:600; flex-shrink:0; }

  .period-toggle{
    display:flex; gap:4px; margin-top:10px;
    background:var(--paper-2); border-radius:var(--r-sm); padding:4px;
  }
  .period-btn{
    flex:1; border:none; border-radius:calc(var(--r-sm) - 3px);
    background:transparent; color:var(--ink-soft);
    font-weight:700; font-size:13.5px; padding:9px 4px; cursor:pointer;
  }
  .period-btn.active{ background:var(--teal-dark); color:#fff; box-shadow:var(--sh-1); }
  .period-btn.memo-btn.active{ background:var(--brick); }
  .period-btn .period-count{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11.5px;
    opacity:.8; margin-left:3px;
  }

  /* -------------------------------- 본문 ------------------------------- */
  main{ position:relative; z-index:1; padding:14px 16px 16px; }

  /* 화면 전환 + 검색 열기 — v23의 '탭 줄 + 검색 줄' 2줄을 1줄로 합침 */
  .viewbar{ display:flex; gap:6px; margin-bottom:12px; }
  .viewbar button{
    flex:1; padding:9px 6px; font-size:13px; font-weight:600;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--card); color:var(--ink-soft); cursor:pointer;
  }
  .viewbar button.active{
    background:var(--ink); border-color:var(--ink); color:var(--paper);
    box-shadow:var(--sh-1);
  }
  .icon-btn{
    flex:0 0 44px !important; padding:0 !important;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn svg{ width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .search-bar{ display:none; gap:6px; margin-bottom:12px; }
  .search-bar.show{ display:flex; }
  .search-bar input{
    flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--field); padding:9px 11px; font-size:14px; color:var(--ink);
  }
  .search-bar input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(62,79,138,.12); }
  .search-bar select{
    flex-shrink:0; border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--field); padding:9px 4px; font-size:12.5px; color:var(--ink-soft);
  }
  .search-bar button{
    padding:9px 15px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
    border:1px solid var(--teal-dark); border-radius:var(--r-sm);
    background:var(--teal-dark); color:#fff; flex-shrink:0;
  }
  .search-bar button:active{ background:var(--teal); }

  .search-view{ display:none; }
  .search-view.show{ display:block; }
  .search-meta{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);
    margin:0 0 12px; padding:0 2px;
  }
  .result-card{ cursor:pointer; }
  .result-card:active{ border-color:var(--teal); }
  .result-card .card-head{ flex-wrap:wrap; row-gap:6px; align-items:flex-start; }
  .result-date{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;
    color:var(--teal-dark);
  }
  .result-head-main{ flex:1; min-width:0; }
  .result-visitor{
    font-size:14.5px; font-weight:700; color:var(--ink);
    margin-top:2px; word-break:break-all;
  }
  .result-match{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:var(--teal-dark); border:1px solid rgba(35,44,79,.3); border-radius:var(--r-pill);
    background:var(--teal-pale); padding:2px 8px; white-space:nowrap;
  }
  .result-body{ padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
  .result-row{ display:flex; gap:10px; font-size:13.5px; align-items:baseline; }
  .result-row .rk{ flex-shrink:0; width:78px; color:var(--ink-soft); font-size:12.5px; }
  .result-row .rv{ flex:1; min-width:0; word-break:break-all; }
  mark{ background:#F5E7A8; color:inherit; padding:0 1px; border-radius:2px; }

  /* 저장 상태 + 설정 — v23의 3줄(자동저장/임시저장/내비앱)을 1줄 + 접이식으로 */
  .status-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:0 0 12px; padding:0 2px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);
  }
  .status-left{ display:flex; align-items:center; gap:7px; min-width:0; }
  .status-left .dot{
    width:6px; height:6px; border-radius:50%; background:var(--teal); flex-shrink:0;
  }
  .gear-btn{
    display:flex; align-items:center; gap:5px; flex-shrink:0;
    font-size:11.5px; font-weight:600; color:var(--ink-soft);
    border:1px solid var(--line-strong); border-radius:var(--r-pill);
    background:var(--card); padding:5px 11px; cursor:pointer;
  }
  .gear-btn svg{ width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  .gear-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  .settings-panel{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--r-md); box-shadow:var(--sh-1);
    padding:4px 14px; margin-bottom:12px;
  }
  .setting-item{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; margin:0;
  }
  .setting-item + .setting-item{ border-top:1px solid var(--line); }
  .setting-text{ flex:1; min-width:0; font-size:13px; color:var(--ink); line-height:1.35; }
  .setting-text small{ display:block; font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .setting-val{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); flex-shrink:0; }
  .switch-label{ cursor:pointer; }
  .switch-label input[type=checkbox]{
    width:17px; height:17px; accent-color:var(--teal-dark); cursor:pointer; flex-shrink:0; margin:0;
  }
  /* 섹션 머리 */
  .section-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:0 0 10px; padding:0 2px;
  }
  .section-title{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  .section-count{
    font-family:'IBM Plex Mono',monospace; color:var(--teal-dark); font-weight:600;
  }
  .sort-btn{
    flex-shrink:0; font-size:12.5px; font-weight:700; padding:8px 12px; white-space:nowrap;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--card); color:var(--teal-dark); cursor:pointer; box-shadow:var(--sh-1);
  }
  .sort-btn:active{ background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; }
  /* 안내문은 '순서'를 한 번도 안 쓴 상태에서만 보이고, 쓰기 시작하면 사라진다 */
  .sort-hint{
    margin:-4px 0 12px; padding:0 2px;
    font-size:11.5px; line-height:1.55; color:var(--ink-faint);
  }
  .sort-hint b{ color:var(--ink-soft); }

  /* -------------------------------- 카드 ------------------------------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    margin-bottom:12px;
    position:relative; overflow:hidden;
    box-shadow:var(--sh-2);
  }
  .card-head{
    display:flex; align-items:center; gap:6px;
    padding:9px 10px 9px 12px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--paper-2), rgba(228,233,226,.45));
  }
  .stub-num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:12.5px;
    width:24px; height:24px; border-radius:var(--r-pill);
    background:var(--teal-dark); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .order-area{ display:flex; align-items:center; gap:5px; flex-shrink:0; }
  .order-area label{ font-size:11px; color:var(--ink-soft); }
  .order-input{
    width:34px; height:26px; padding:0 2px; text-align:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--field); color:var(--ink);
  }
  .order-input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(62,79,138,.12); }
  .order-input.filled{ border-color:var(--teal-dark); color:var(--teal-dark); background:var(--teal-pale); }

  .time-area{ margin-left:auto; display:flex; align-items:center; gap:5px; min-width:0; }
  .time-value{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;
    color:var(--teal-dark); text-align:right; line-height:20px; white-space:nowrap;
    /* 불러오기로 들어온 시각 값은 40자까지 허용되므로, 길면 잘라서
       삭제 버튼이 화면 밖으로 밀려나지 않게 한다 */
    min-width:0; overflow:hidden; text-overflow:ellipsis;
  }
  /* '미기록'은 한글이라 IBM Plex Mono에 글자가 없어 대체 폰트가 크게 렌더링됨
     → 카드 머리 높이가 들쭉날쭉해지지 않도록 한글 전용 폰트를 직접 지정 */
  /* 클래스 이름을 no-time 으로 분리한다. v23까지는 이 수식자가 'empty' 라서
     빈 상태 안내문용 전역 .empty{padding:40px 20px} 가 그대로 먹었고,
     그 결과 시각이 없는 카드의 머리 높이가 100px 넘게 부풀어 있었음. */
  .time-value.no-time{
    color:var(--ink-faint); font-weight:500; font-size:11.5px;
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
  }
  .time-btn{
    font-size:11px; font-weight:700; padding:5px 8px; white-space:nowrap; flex-shrink:0;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--field); color:var(--teal-dark); cursor:pointer;
  }
  .time-btn:active{ background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; }
  /* 카드 삭제 (v24) */
  .card-del{
    flex-shrink:0; width:28px; height:28px; margin-left:1px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid transparent; border-radius:var(--r-sm);
    background:transparent; color:var(--ink-faint); cursor:pointer;
  }
  .card-del svg{ width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .card-del:active{ background:var(--brick-pale); border-color:var(--brick); color:var(--brick); }

  .card-body{ padding:13px 14px 15px; display:flex; flex-direction:column; gap:11px; }
  .field label{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    font-size:12px; font-weight:500; color:var(--ink-soft); margin-bottom:5px;
  }
  /* 글자수 표시는 평소엔 숨기고, 입력 중이거나 한도에 가까울 때만 보여준다
     (레이아웃이 흔들리지 않도록 display 가 아니라 opacity 로 처리) */
  .field label .cnt{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint);
    opacity:0; transition:opacity .15s ease;
  }
  .field.focused label .cnt, .field label .cnt.near{ opacity:1; }
  .field label .cnt.warn{ opacity:1; color:var(--brick); font-weight:600; }
  .field input, .field textarea{
    width:100%; border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--field); padding:10px 11px; font-size:14.5px;
    color:var(--ink); resize:none;
  }
  .field textarea{ min-height:56px; line-height:1.5; }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(62,79,138,.12);
  }
  .field.flag input, .field.flag textarea{ border-color:#E0D0B4; background:#FDFAF3; }
  .field.flag input:focus, .field.flag textarea:focus{ border-color:#C9A96A; box-shadow:0 0 0 3px rgba(201,169,106,.16); }
  /* 방문주소: 주소가 길어도 한 줄로 스크롤되어 뒷부분이 안 보이던 문제를
     v25.1에서 수정 — 입력칸을 2줄로 자동 줄바꿈되는 textarea로 바꾸고,
     길찾기 버튼은 주소 아래로 내려서 겹치거나 가리지 않게 함. */
  .addr-row{ display:flex; flex-direction:column; gap:6px; }
  .addr-row textarea{
    width:100%; min-height:52px; max-height:78px; line-height:1.4;
    resize:none; overflow-y:auto; white-space:pre-wrap; word-break:break-all;
  }
  .addr-row .nav-btn{ align-self:flex-end; height:34px; }
  .nav-btn{
    flex-shrink:0; display:flex; align-items:center; gap:4px; white-space:nowrap;
    font-size:12.5px; font-weight:700; padding:0 12px; cursor:pointer;
    border:1px solid var(--teal-dark); border-radius:var(--r-sm);
    background:var(--teal-pale); color:var(--teal-dark);
  }
  .nav-btn:active{ background:var(--teal-dark); color:#fff; }
  .nav-btn.loading{ opacity:.55; pointer-events:none; }

  /* 생년월일 + 자동 계산된 나이 표시 */
  .birth-row{ display:flex; gap:6px; }
  .birth-row input{ flex:1; min-width:0; }
  .age-badge{
    flex-shrink:0; display:flex; align-items:center; white-space:nowrap;
    font-size:12.5px; font-weight:700; padding:0 12px;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--paper-2); color:var(--ink-soft);
  }
  .age-badge.filled{ border-color:var(--teal-dark); background:var(--teal-pale); color:var(--teal-dark); }

  /* 구간 경로 — 앞뒤 카드에 주소가 모두 있을 때만 나타난다 (v24) */
  .segment-connector{
    display:flex; align-items:center; justify-content:center;
    margin:-4px 0 12px; position:relative; z-index:1;
  }
  .segment-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    padding:6px 14px; border-radius:var(--r-pill); cursor:pointer;
    border:1px solid rgba(35,44,79,.28); background:var(--teal-pale); color:var(--teal-dark);
    display:flex; align-items:center; gap:6px;
  }
  .segment-btn:active{ background:var(--teal-dark); color:#fff; }
  .segment-btn.loading{ opacity:.55; pointer-events:none; }
  .segment-btn .arrow{ font-size:13px; }

  .add-card-btn{
    display:block; width:100%;
    padding:13px; margin-bottom:8px; border-radius:var(--r-md);
    background:transparent; color:var(--teal-dark);
    border:1px dashed var(--line-strong);
    font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .add-card-btn:active{ background:var(--paper-2); border-color:var(--teal-dark); }
  .add-card-btn[disabled]{ opacity:.55; border-style:solid; color:var(--ink-faint); cursor:default; }

  /* -------------------------------- 메모 ------------------------------- */
  .memo-panel{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--r-lg); box-shadow:var(--sh-2);
    padding:14px; margin-bottom:12px;
  }
  .memo-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .memo-label{
    font-family:'Noto Serif KR','Malgun Gothic',serif; font-weight:700; font-size:15px;
    color:var(--brick);
  }
  .memo-count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); }
  .memo-count.warn{ color:var(--brick); font-weight:600; }
  .memo-textarea{
    width:100%; min-height:300px; resize:vertical;
    border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--field);
    padding:12px; font-size:14.5px; line-height:1.65; color:var(--ink);
  }
  .memo-textarea:focus{ outline:none; border-color:var(--brick); box-shadow:0 0 0 3px rgba(181,105,42,.12); }

  /* ------------------------------ 지난 기록 ----------------------------- */
  .history{ display:none; }
  .history.show{ display:block; }
  .hist-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:13px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--r-md);
    margin-bottom:8px; cursor:pointer; box-shadow:var(--sh-1);
  }
  .hist-item:active{ border-color:var(--teal); background:var(--paper-2); }
  .hist-date{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; }
  .hist-meta{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .hist-count{
    font-family:'IBM Plex Mono',monospace; font-size:11px; flex-shrink:0;
    border:1px solid rgba(35,44,79,.28); background:var(--teal-pale);
    color:var(--teal-dark); border-radius:var(--r-pill); padding:3px 9px;
  }
  .empty{ text-align:center; padding:44px 20px; color:var(--ink-faint); font-size:13.5px; }
  .day-view{ display:block; }

  /* -------------------------------- 모달 ------------------------------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(20,24,38,.5);
    display:flex; align-items:center; justify-content:center;
    padding:22px;
    animation:modal-fade .14s ease;
  }
  @keyframes modal-fade{ from{opacity:0;} to{opacity:1;} }
  .modal-box{
    background:var(--card); border:1px solid var(--line-strong);
    border-radius:var(--r-lg); box-shadow:var(--sh-3);
    width:100%; max-width:340px; padding:18px;
    max-height:88vh; overflow-y:auto;
  }
  .modal-title{ font-size:15.5px; font-weight:700; color:var(--ink); margin-bottom:9px; line-height:1.4; }
  .modal-msg{ font-size:13px; line-height:1.65; color:var(--ink-soft); white-space:pre-line; margin-bottom:16px; }
  .modal-quote{
    font-size:13.5px; font-weight:600; color:var(--ink);
    background:var(--paper-2); border-radius:var(--r-sm);
    padding:9px 11px; margin-bottom:10px; word-break:break-all; white-space:normal;
  }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions button{
    flex:1; padding:11px; font-size:14px; font-weight:700; cursor:pointer;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
  }
  .modal-cancel{ background:var(--card); color:var(--ink-soft); }
  .modal-cancel:active{ background:var(--paper-2); }
  .modal-ok{ background:var(--teal-dark); color:#fff; border-color:var(--teal-dark); }
  .modal-danger{ background:var(--brick); border-color:var(--brick); color:#fff; }

  .sheet-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .sheet-item{
    display:flex; flex-direction:column; gap:3px; text-align:left; width:100%;
    padding:12px 13px; cursor:pointer;
    border:1px solid var(--line); border-radius:var(--r-sm);
    background:var(--field);
  }
  .sheet-item:active{ background:var(--teal-pale); border-color:var(--teal-dark); }
  .sheet-item-title{ font-size:14px; font-weight:700; color:var(--ink); }
  .sheet-item-desc{ font-size:11.5px; color:var(--ink-faint); line-height:1.45; }

  /* ------------------------------ 하단 바 ------------------------------ */
  .actionbar{
    position:fixed; bottom:0; left:0; right:0; z-index:5;
    display:flex; gap:8px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(238,241,235,.94);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid var(--line-strong);
  }
  .actionbar button{
    flex:1; padding:12px 4px; font-size:13.5px; font-weight:700; cursor:pointer;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    white-space:nowrap; line-height:1.2;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .actionbar button:active{ transform:translateY(1px); }
  .actionbar button svg{ width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .btn-share{ background:var(--teal-dark); color:#fff; border-color:var(--teal-dark); box-shadow:var(--sh-2); }
  .btn-copy{ background:var(--card); color:var(--ink); box-shadow:var(--sh-1); }
  .btn-copy:active{ background:var(--paper-2); }

  /* -------------------------------- 토스트 ------------------------------ */
  .toast{
    position:fixed; left:50%; bottom:84px; transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:var(--paper);
    padding:11px 14px; border-radius:var(--r-md); box-shadow:var(--sh-3);
    font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:60; max-width:92vw;
    display:flex; align-items:center; gap:12px;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast-msg{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toast-action{
    flex-shrink:0; font-size:12.5px; font-weight:700; cursor:pointer;
    padding:5px 10px; border-radius:var(--r-sm);
    border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff;
  }
  .toast-action:active{ background:rgba(255,255,255,.16); }

  /* 태블릿·PC에서 열었을 때 한 줄이 화면 끝까지 늘어나지 않도록 폭 제한 */
  @media (min-width: 620px){
    header > *, main{ max-width:560px; margin-left:auto; margin-right:auto; }
    .actionbar{
      padding-left:calc((100% - 560px) / 2);
      padding-right:calc((100% - 560px) / 2);
    }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div class="bg-texture"></div>

<header>
  <div class="app-bar">
    <h1 class="brand">방문일지<span class="ver-tag">v25.2</span></h1>
    <span class="progress-chip" id="progressChip">작성 0/4</span>
  </div>
  <div class="date-nav">
    <button id="prevDay" type="button" aria-label="이전 날짜">‹</button>
    <div class="date-display">
      <input type="date" id="dateInput">
      <span class="weekday" id="weekdayLabel">(월)</span>
    </div>
    <button id="nextDay" type="button" aria-label="다음 날짜">›</button>
  </div>
  <div class="period-toggle" id="periodToggle">
    <button type="button" class="period-btn" data-view="AM">오전<span class="period-count" id="periodCountAM"></span></button>
    <button type="button" class="period-btn" data-view="PM">오후<span class="period-count" id="periodCountPM"></span></button>
    <button type="button" class="period-btn memo-btn" data-view="MEMO">메모<span class="period-count" id="memoCount"></span></button>
  </div>
</header>

<main>
  <div class="viewbar">
    <button id="tabDay" class="active" type="button">오늘 기록</button>
    <button id="tabHistory" type="button">지난 기록</button>
    <button id="searchToggle" class="icon-btn" type="button" aria-label="빠른 검색">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
    </button>
  </div>

  <div class="search-bar" id="searchBar">
    <select id="searchScope" aria-label="검색 범위">
      <option value="all">전체</option>
      <option value="visitor">담당자명</option>
      <option value="addr">주소</option>
      <option value="target">방문예정자명</option>
      <option value="phone">휴대폰번호</option>
      <option value="birth">생년월일</option>
      <option value="note">특이사항</option>
    </select>
    <input type="text" id="searchInput" placeholder="주소·방문예정자명·휴대폰번호 검색"
           enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="searchBtn" type="button">검색</button>
  </div>

  <div id="searchView" class="search-view">
    <div class="search-meta" id="searchMeta"></div>
    <div id="searchResults"></div>
  </div>

  <div id="dayView" class="day-view">
    <div class="status-row">
      <span class="status-left"><span class="dot"></span><span id="lastSaved">—</span></span>
      <button type="button" class="gear-btn" id="settingsToggle" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2.2"></circle><circle cx="10" cy="17" r="2.2"></circle></svg>설정
      </button>
    </div>

    <div class="settings-panel hide" id="settingsPanel">
      <label class="setting-item switch-label">
        <input type="checkbox" id="autoBackupToggle" checked>
        <span class="setting-text">5분마다 자동 임시저장<small>기기 안에만 조용히 저장돼요</small></span>
        <span class="setting-val" id="lastBackup">—</span>
      </label>
    </div>

    <div id="visitsPanel">
      <div class="section-head">
        <div class="section-title">방문 카드 <span class="section-count" id="cardCount">4</span></div>

<script>
'use strict';

// ===================================================================
// 저장소 어댑터 (v8 핵심 수정)
// window.storage(특수 환경 전용 API)가 있으면 그것을 쓰고,
// 없으면(일반 브라우저) localStorage 를 쓴다.
// 이전 버전은 일반 브라우저에서 저장이 전혀 되지 않았다.
// ===================================================================
const storage = (() => {
  if (window.storage && typeof window.storage.get === 'function') {
    return window.storage;
  }
  return {
    async get(key){
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key){
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix){
      const keys = [];
      prefix = prefix || '';
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) keys.push(k);
      }
      return { keys };
    }
  };
})();

const LIMITS = { addr:80, target:20, phone:13, birth:10, note:100, visitor:20 };
// v24: 방문주소는 항상 '충청북도 제천시'로 시작하므로, 카드가 새로 만들어질 때
// 이 접두사를 자동으로 입력칸에 채워두고 사용자는 나머지만 입력하면 되게 한다.
const ADDR_PREFIX = '충청북도 제천시 ';
function addrFilled(addr){
  return !!(addr && addr.trim() && addr.trim() !== ADDR_PREFIX.trim());
}
// v25: 방문상호/변경상호 → 방문예정자 휴대폰번호/생년월일(자동 나이계산)로 개편
// v25.2: 빠져 있던 방문예정자명(target) 항목 추가 — 주소 다음, 휴대폰번호 앞에 배치
const FIELD_META = [
  {key:'visitor', label:'방문담당자명',   type:'input',    max:LIMITS.visitor},
  {key:'addr',    label:'방문주소',       type:'input',    max:LIMITS.addr},
  {key:'target',  label:'방문예정자명',   type:'input',    max:LIMITS.target},
  {key:'phone',   label:'휴대폰번호',     type:'input',    max:LIMITS.phone, inputType:'tel'},
  {key:'birth',   label:'생년월일',       type:'input',    max:LIMITS.birth, inputType:'date'},
  {key:'note',    label:'특이사항',       type:'textarea', max:LIMITS.note},
];
const FIELD_LABEL = {
  addr:'방문주소', target:'방문예정자명', phone:'휴대폰번호', birth:'생년월일',
  note:'특이사항', visitor:'방문담당자명', time:'방문시각',
};
// 생년월일(YYYY-MM-DD) → 만 나이. 형식이 안 맞거나 미래 날짜면 빈 문자열.
function calcAge(birthStr){
  if(!birthStr) return '';
  const m = String(birthStr).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  const y = parseInt(m[1],10), mo = parseInt(m[2],10), d = parseInt(m[3],10);
  const birth = new Date(y, mo-1, d);
  if(birth.getFullYear() !== y || birth.getMonth() !== mo-1 || birth.getDate() !== d) return '';
  const today = new Date();
  if(birth > today) return '';
  let age = today.getFullYear() - y;
  const beforeBirthday = (today.getMonth() < mo-1) || (today.getMonth() === mo-1 && today.getDate() < d);
  if(beforeBirthday) age--;
  return age >= 0 ? age : '';
}
function ageLabel(birthStr){
  const age = calcAge(birthStr);
  return age === '' ? '나이 -' : '만 '+age+'세';
}
// 숫자만 남겨 010-1234-5678 형식으로 정리 (완성되기 전 자리수는 그대로 둠)
function formatPhone(v){
  const digits = String(v||'').replace(/[^0-9]/g,'').slice(0,11);
  if(digits.length < 4) return digits;
  if(digits.length < 8) return digits.slice(0,3)+'-'+digits.slice(3);
  if(digits.length <= 10) return digits.slice(0,3)+'-'+digits.slice(3,6)+'-'+digits.slice(6);
  return digits.slice(0,3)+'-'+digits.slice(3,7)+'-'+digits.slice(7);
}
const SETTINGS_KEY = 'visit-log:settings';
const DEFAULT_VISIT_COUNT = 4;
const MAX_VISIT_COUNT = 20;
const BACKUP_KEY   = 'visit-log:backup';
const DATE_KEY_RE  = /^\d{4}-\d{2}-\d{2}$/;
// v20: 오전/오후 구분. 저장 키 형식은 'visit-log:YYYY-MM-DD:AM' 또는 ':PM'.
// v19 이전(오전/오후 구분 없던 시절) 데이터는 접미사 없는 'visit-log:YYYY-MM-DD'
// 형식이며, 이는 "오전" 기록으로 취급해 그대로 이어서 사용한다(레거시 호환).
const PERIODS = ['AM','PM'];
const PERIOD_LABEL = { AM:'오전', PM:'오후' };
const DATE_KEY_FULL_RE = /^visit-log:(\d{4}-\d{2}-\d{2})(?::(AM|PM))?$/;
const SAVE_DEBOUNCE_MS = 600;          // 입력 후 0.6초 뒤 자동 저장
const BACKUP_INTERVAL_MS = 5 * 60 * 1000; // 5분마다 자동 임시저장
const BACKUP_SAFETY_GAP_MS = 10000;    // 여러 트리거가 겹칠 때 최소 간격

function defaultPeriod(){
  return new Date().getHours() < 12 ? 'AM' : 'PM';
}

const MEMO_MAX = 2000;
function memoKeyFor(dateStr){ return 'visit-log:memo:'+dateStr; }

let currentDate = todayStr();
let currentPeriod = defaultPeriod();
let currentView = currentPeriod; // 'AM' | 'PM' | 'MEMO' — 화면에 보이는 탭
let currentMemo = '';
let memoSaveTimer = null;
let currentVisits = emptyVisits();
let saveTimer = null;
let backupIntervalId = null;
let lastBackupAt = 0;
let autoBackupEnabled = true;

function $(id){ return document.getElementById(id); }

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
}
function nowHHMMSS(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function emptyVisits(n){
  const count = n || DEFAULT_VISIT_COUNT;
  return Array.from({length: count}, () => ({addr:ADDR_PREFIX,target:'',phone:'',birth:'',note:'',time:'',visitor:'',order:''}));
}
const _weekdayCache = {};
function weekdayKR(dateStr){
  if(_weekdayCache[dateStr]) return _weekdayCache[dateStr];
  const days=['일','월','화','수','목','금','토'];
  const d = new Date(dateStr+'T00:00:00');
  const r = days[d.getDay()]+'요일';
  _weekdayCache[dateStr] = r;
  return r;
}
function weekdayShortKR(dateStr){ return '(' + weekdayKR(dateStr).charAt(0) + ')'; }
function keyFor(dateStr, period){ return 'visit-log:'+dateStr+':'+(period||currentPeriod); }
function legacyKeyFor(dateStr){ return 'visit-log:'+dateStr; } // v19 이전 형식(오전/오후 구분 없음)

function hasAnyData(visits){
  return visits.some(v => addrFilled(v.addr) || v.target || v.phone || v.birth || v.note || v.time || v.visitor);
}

// 손상된 저장 데이터를 안전하게 보정 (앱이 죽지 않도록)
function normalizeVisits(parsed){
  let raw = null;
  if (Array.isArray(parsed)) raw = parsed;
  else if (parsed && Array.isArray(parsed.visits)) raw = parsed.visits;
  if (!raw || raw.length === 0) return emptyVisits();
  // v24: 저장된 카드 개수를 그대로 살린다. v23까지는 최소 4개로 강제 보정해서
  // 카드를 4개 아래로 지워도 다시 열면 빈 카드가 되살아났음.
  const len = Math.min(MAX_VISIT_COUNT, Math.max(1, raw.length));
  const fixed = emptyVisits(len);
  for (let i = 0; i < Math.min(len, raw.length); i++){
    const src = raw[i];
    if (!src || typeof src !== 'object') continue;
    FIELD_META.forEach(m => {
      if (typeof src[m.key] === 'string') fixed[i][m.key] = src[m.key].slice(0, m.max);
    });
    if (typeof src.time === 'string') fixed[i].time = src.time.slice(0, 40);
    if (typeof src.order === 'string' || typeof src.order === 'number') {
      fixed[i].order = String(src.order).slice(0, 3);
    }
  }
  return fixed;
}

async function loadSettings(){
  try{
    const res = await storage.get(SETTINGS_KEY);
    const s = res && res.value ? JSON.parse(res.value) : {};
    autoBackupEnabled = s.autoBackup !== false;
  }catch(e){
    autoBackupEnabled = true;
  }
  $('autoBackupToggle').checked = autoBackupEnabled;
}
async function saveSettings(){
  try{
    await storage.set(SETTINGS_KEY, JSON.stringify({ autoBackup: autoBackupEnabled }));
  }catch(e){}
}

let toastTimer = null;
// action 이 있으면 토스트에 버튼을 하나 붙이고 노출 시간을 늘린다 (카드 삭제 되돌리기용)
function showToast(msg, action){
  const t = $('toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.className = 'toast-msg';
  span.textContent = msg;
  t.appendChild(span);
  if(action){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action';
    btn.textContent = action.label;
    btn.addEventListener('click', ()=>{ hideToast(); action.run(); });
    t.appendChild(btn);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 6000 : 1800);
}
function hideToast(){
  clearTimeout(toastTimer);
  $('toast').classList.remove('show');
}

// ---------------- 앱 내부 모달 (v15와 같은 이유: 설치형 PWA에서 window.confirm 이
// 아예 안 뜨는 경우가 있어, 확인창을 앱 안에 직접 만들어 쓴다) ----------------
let modalState = null;
function onModalKey(e){ if(e.key === 'Escape'){ e.preventDefault(); closeModal(); } }
function closeModal(){
  if(!modalState) return;
  const s = modalState;
  modalState = null;
  s.el.remove();
  document.removeEventListener('keydown', onModalKey);
  document.body.style.overflow = s.prevOverflow || '';
  if(s.onClose) s.onClose();
}
function openModal(innerHtml, opts){
  closeModal();
  opts = opts || {};
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true"></div>';
  overlay.firstChild.innerHTML = innerHtml;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  modalState = { el: overlay, onClose: opts.onClose, prevOverflow: document.body.style.overflow };
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', onModalKey);
  if(opts.setup) opts.setup(overlay);
  return overlay;
}

// window.confirm 대체. 취소/바깥 클릭/Esc 는 모두 false 로 확정된다.
function appConfirm(opts){
  return new Promise((resolve)=>{
    let settled = false;
    const finish = (v)=>{ if(settled) return; settled = true; resolve(v); };
    const html =
      '<div class="modal-title">' + escapeHtml(opts.title || '확인') + '</div>'
      + '<div class="modal-msg">' + (opts.html || escapeHtml(opts.msg || '')) + '</div>'
      + '<div class="modal-actions">'
      +   '<button type="button" class="modal-cancel" data-cancel>' + escapeHtml(opts.cancelText || '취소') + '</button>'
      +   '<button type="button" class="modal-ok' + (opts.danger ? ' modal-danger' : '') + '" data-ok>' + escapeHtml(opts.okText || '확인') + '</button>'
      + '</div>';
    openModal(html, {
      onClose: ()=>finish(false),
      setup: (root)=>{
        root.querySelector('[data-cancel]').addEventListener('click', ()=>{ finish(false); closeModal(); });
        root.querySelector('[data-ok]').addEventListener('click', ()=>{ finish(true); closeModal(); });
      }
    });
  });
}

// 항목 목록형 모달 (하단 [파일] 메뉴)
function openSheet(title, items){
  const html =
    '<div class="modal-title">' + escapeHtml(title) + '</div>'
    + '<div class="sheet-list">'
    + items.map((it, i)=>
        '<button type="button" class="sheet-item" data-i="' + i + '">'
        + '<span class="sheet-item-title">' + escapeHtml(it.title) + '</span>'
        + '<span class="sheet-item-desc">' + escapeHtml(it.desc) + '</span>'
        + '</button>').join('')
    + '</div>'
    + '<div class="modal-actions"><button type="button" class="modal-cancel" data-cancel>닫기</button></div>';
  openModal(html, {
    setup: (root)=>{
      root.querySelectorAll('.sheet-item').forEach((btn)=>{
        btn.addEventListener('click', ()=>{
          const it = items[parseInt(btn.dataset.i, 10)];
          // 파일 선택창은 사용자 클릭 흐름 안에서 바로 열어야 하므로 지연시키지 않는다
          closeModal();
          if(it && it.run) it.run();
        });
      });
      root.querySelector('[data-cancel]').addEventListener('click', closeModal);
    }
  });
}

async function loadDate(dateStr, period){
  currentDate = dateStr;
  if(period){ currentPeriod = period; currentView = period; }
  $('dateInput').value = dateStr;
  $('weekdayLabel').textContent = weekdayShortKR(dateStr);
  updatePeriodUI();
  try{
    let res = await storage.get(keyFor(dateStr, currentPeriod));
    // 새 형식(오전/오후 구분) 기록이 없고, "오전" 탭이면 v19 이전 레거시
    // 기록(구분 없던 시절)이 있는지 확인해서 그대로 보여준다.
    if((!res || !res.value) && currentPeriod === 'AM'){
      try{ res = await storage.get(legacyKeyFor(dateStr)); }catch(e){}
    }
    const parsed = res && res.value ? JSON.parse(res.value) : null;
    currentVisits = normalizeVisits(parsed);
  }catch(e){
    currentVisits = emptyVisits();
  }
  renderCards();
  const filled = countFilled(currentVisits);
  $('lastSaved').textContent = filled > 0 ? '기록 '+filled+'곳 있음' : '—';
  await loadMemo(dateStr);
  refreshPeriodCounts();
}

function updatePeriodUI(){
  document.querySelectorAll('.period-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === currentView);
  });
  const visitsPanel = $('visitsPanel');
  const memoPanel = $('memoPanel');
  if(visitsPanel && memoPanel){
    if(currentView === 'MEMO'){
      visitsPanel.classList.add('hide');
      memoPanel.classList.remove('hide');
    } else {
      visitsPanel.classList.remove('hide');
      memoPanel.classList.add('hide');
    }
  }
}

// 오전/오후 탭 버튼에 각 기록 건수를 작게 표시 (참고용, 매번 저장소 조회)
async function refreshPeriodCounts(){
  for(const p of PERIODS){
    const el = $('periodCount'+p);
    if(!el) continue;
    try{
      let res = await storage.get(keyFor(currentDate, p));
      if((!res || !res.value) && p === 'AM'){
        try{ res = await storage.get(legacyKeyFor(currentDate)); }catch(e){}
      }
      const parsed = res && res.value ? JSON.parse(res.value) : null;
      const filled = countFilled(normalizeVisits(parsed));
      el.textContent = filled > 0 ? ' '+filled : '';
    }catch(e){ el.textContent = ''; }
  }
  const memoEl = $('memoCount');
  if(memoEl) memoEl.textContent = currentMemo.trim() ? ' ✓' : '';
}

// ---------------- 메모 (v21, 오전/오후와 별개로 하루 단위 저장) ----------------
async function loadMemo(dateStr){
  try{
    const res = await storage.get(memoKeyFor(dateStr));
    currentMemo = res && res.value ? res.value : '';
  }catch(e){
    currentMemo = '';
  }
  const ta = $('memoText');
  if(ta) ta.value = currentMemo;
  updateMemoCount();
}

function updateMemoCount(){
  const el = $('memoCharCount');
  if(el){
    el.textContent = currentMemo.length + ' / ' + MEMO_MAX;
    el.classList.toggle('warn', currentMemo.length >= MEMO_MAX - 100);
  }
  const memoEl = $('memoCount');
  if(memoEl) memoEl.textContent = currentMemo.trim() ? ' ✓' : '';
}

function scheduleMemoSave(){
  clearTimeout(memoSaveTimer);
  memoSaveTimer = setTimeout(()=>{
    memoSaveTimer = null;
    saveMemoCurrent();
  }, SAVE_DEBOUNCE_MS);
}

async function saveMemoCurrent(){
  try{
    await storage.set(memoKeyFor(currentDate), currentMemo);
    $('lastSaved').textContent = '저장됨 ' + nowHHMMSS().slice(0,5);
  }catch(e){ /* 조용히 무시, 다음 저장 때 재시도 */ }
}

async function flushMemoSave(){
  if(memoSaveTimer){
    clearTimeout(memoSaveTimer);
    memoSaveTimer = null;
  }
  await saveMemoCurrent();
}

$('memoText') && $('memoText').addEventListener('input', (e)=>{
  currentMemo = e.target.value.slice(0, MEMO_MAX);
  updateMemoCount();
  scheduleMemoSave();
});

function countFilled(visits){
  return visits.filter(v => addrFilled(v.addr) || v.target || v.phone || v.birth || v.note || v.time || v.visitor).length;
}

function updateProgress(){
  $('progressChip').textContent = '작성 ' + countFilled(currentVisits) + '/' + currentVisits.length;
}

function updateAddCardBtn(){
  const btn = $('addCardBtn');
  if(currentVisits.length >= MAX_VISIT_COUNT){
    btn.textContent = '카드는 최대 ' + MAX_VISIT_COUNT + '개까지 만들 수 있습니다';
    btn.disabled = true;
  }else{
    btn.textContent = '+ 카드 추가 (' + currentVisits.length + '/' + MAX_VISIT_COUNT + ')';
    btn.disabled = false;
  }
}

function addVisitCard(){
  if(currentVisits.length >= MAX_VISIT_COUNT){
    showToast('카드는 최대 ' + MAX_VISIT_COUNT + '개까지 만들 수 있습니다');
    return;
  }
  currentVisits.push({addr:ADDR_PREFIX,name:'',changed:'',note:'',time:'',visitor:'',order:''});
  renderCards();
  saveCurrent();
  showToast('카드가 추가되었습니다 (' + currentVisits.length + '/' + MAX_VISIT_COUNT + ')');
  requestAnimationFrame(()=>{
    const wrap = $('cardsWrap');
    if(wrap.lastElementChild){
      wrap.lastElementChild.scrollIntoView({ behavior:'smooth', block:'start' });
    }
  });
}
$('addCardBtn').addEventListener('click', addVisitCard);

// ---------------- 방문 순서대로 정렬 ----------------
// 순서 칸을 채운 카드는 작은 숫자부터 앞으로, 비워둔 카드는 뒤로(원래 순서 유지) 보냄
function sortByOrder(){
  const hasAnyOrder = currentVisits.some(v => (v.order || '').trim() !== '');
  if(!hasAnyOrder){
    showToast('먼저 카드마다 순서 번호를 입력해주세요');
    return;
  }
  const withIndex = currentVisits.map((v, i) => ({ v, i }));
  withIndex.sort((a, b) => {
    const oa = a.v.order === '' ? null : parseInt(a.v.order, 10);
    const ob = b.v.order === '' ? null : parseInt(b.v.order, 10);
    if (oa === null && ob === null) return a.i - b.i;
    if (oa === null) return 1;
    if (ob === null) return -1;
    if (oa !== ob) return oa - ob;
    return a.i - b.i;
  });
  currentVisits = withIndex.map(x => x.v);
  renderCards();
  scheduleSave();
  showToast('순서대로 정렬했어요');
}
$('sortByOrderBtn').addEventListener('click', sortByOrder);

// ---------------- 카드 삭제 (v24) ----------------
// 내용이 있는 카드만 확인창을 띄우고, 지운 뒤 6초간 '되돌리기'를 제공한다.
async function deleteVisitCard(idx){
  const visit = currentVisits[idx];
  if(!visit) return;
  if(currentVisits.length <= 1){
    showToast('카드는 최소 1개는 있어야 합니다');
    return;
  }
  const hasContent = addrFilled(visit.addr) || visit.target || visit.phone || visit.birth
    || visit.note || visit.time || visit.visitor;
  if(hasContent){
    const label = (visit.target || visit.visitor || visit.addr || '').trim();
    const ok = await appConfirm({
      title: '방문 ' + (idx+1) + ' 카드를 삭제할까요?',
      html: (label ? '<div class="modal-quote">' + escapeHtml(label.slice(0, 60)) + '</div>' : '')
            + '삭제하면 이 카드에 적은 내용이 사라집니다.\n뒤 카드들의 번호는 하나씩 당겨집니다.',
      okText: '삭제', cancelText: '취소', danger: true,
    });
    if(!ok) return;
  }
  const removed = Object.assign({}, visit);
  let padded = false;
  currentVisits.splice(idx, 1);
  if(currentVisits.length === 0){ currentVisits = emptyVisits(1); padded = true; }
  renderCards();
  await saveCurrent();
  showToast('방문 ' + (idx+1) + ' 카드를 삭제했습니다', {
    label: '되돌리기',
    run: async ()=>{
      if(currentVisits.length >= MAX_VISIT_COUNT){
        showToast('카드가 최대 ' + MAX_VISIT_COUNT + '개라 되돌릴 수 없습니다');
        return;
      }
      // 마지막 한 장을 지워서 자동으로 채워 넣었던 빈 카드는 걷어낸다
      // (그 사이 사용자가 뭔가 적었다면 그대로 둔다)
      if(padded && currentVisits.length === 1 && !hasAnyData(currentVisits)) currentVisits = [];
      currentVisits.splice(Math.min(idx, currentVisits.length), 0, removed);
      renderCards();
      await saveCurrent();
      showToast('삭제를 되돌렸습니다');
    }
  });
}

// 구간 경로 버튼은 앞뒤 카드에 주소가 모두 있을 때만 보여준다 (v24)
let segConnectors = [];
function refreshConnectors(){
  segConnectors.forEach((c)=>{
    const a = currentVisits[c.i], b = currentVisits[c.i + 1];
    const ready = !!(a && b && addrFilled(a.addr) && addrFilled(b.addr));
    c.el.classList.toggle('hide', !ready);
  });
}

// 정렬 안내문은 '순서'를 한 번도 쓰지 않은 상태에서만 보여준다 (v24)
function refreshSortHint(){
  const hint = $('sortHint');
  if(!hint) return;
  hint.classList.toggle('hide', currentVisits.some(v => (v.order || '').trim() !== ''));
}

function renderCards(){
  const wrap = $('cardsWrap');
  wrap.innerHTML = '';
  segConnectors = [];
  const canDelete = currentVisits.length > 1;
  currentVisits.forEach((visit, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-head">'
      +   '<div class="stub-num">' + (idx+1) + '</div>'
      +   '<div class="order-area">'
      +     '<label for="order-' + idx + '">순서</label>'
      +     '<input type="text" inputmode="numeric" pattern="[0-9]*" class="order-input"'
      +       ' id="order-' + idx + '" data-order-input maxlength="3" placeholder="-">'
      +   '</div>'
      +   '<div class="time-area">'
      +     '<span class="time-value ' + (visit.time ? '' : 'no-time') + '" data-time-display>'
      +       escapeHtml(visit.time || '미기록')
      +     '</span>'
      +     '<button type="button" class="time-btn" data-time-btn>재기록</button>'
      +     (canDelete
          ? '<button type="button" class="card-del" data-del-btn title="이 카드 삭제"'
            + ' aria-label="방문 ' + (idx+1) + ' 카드 삭제">' + ICON_TRASH + '</button>'
          : '')
      +   '</div>'
      + '</div>'
      + '<div class="card-body"></div>';

    const orderInput = card.querySelector('[data-order-input]');
    orderInput.value = visit.order || '';
    orderInput.classList.toggle('filled', !!visit.order);
    orderInput.addEventListener('input', (e)=>{
      const v = e.target.value.replace(/[^0-9]/g,'').slice(0,3);
      e.target.value = v;
      currentVisits[idx].order = v;
      orderInput.classList.toggle('filled', !!v);
      refreshSortHint();
      scheduleSave();
    });

    const timeBtn = card.querySelector('[data-time-btn]');
    const timeDisplay = card.querySelector('[data-time-display]');
    const stampTime = ()=>{
      const stamped = nowHHMMSS();
      currentVisits[idx].time = stamped;
      timeDisplay.textContent = stamped;
      timeDisplay.classList.remove('no-time');
      return stamped;
    };
    timeBtn.addEventListener('click', ()=>{
      const stamped = stampTime();
      updateProgress();
      scheduleSave();
      showToast('방문 '+(idx+1)+' 시각 기록: '+stamped);
    });

    const delBtn = card.querySelector('[data-del-btn]');
    if(delBtn) delBtn.addEventListener('click', ()=>deleteVisitCard(idx));

    const body = card.querySelector('.card-body');
    FIELD_META.forEach(meta => {
      const field = document.createElement('div');
      field.className = 'field' + (meta.key==='note' ? ' flag' : '');
      const val = visit[meta.key] || '';
      const fieldId = 'f-'+idx+'-'+meta.key;
      // autocomplete="new-password" + lpignore: 모바일 브라우저가 한 카드의
      // 담당자명을 다른 카드에도 자동으로 채워 저장하는 것(autofill 오염) 방지
      const common = 'data-field="'+meta.key+'" id="'+fieldId+'" name="'+fieldId
        +'" maxlength="'+meta.max+'" autocomplete="new-password"'
        +' data-lpignore="true" data-1p-ignore="true" data-form-type="other"'
        +' autocorrect="off" spellcheck="false"'
        +' placeholder="'+meta.label+' 입력"';
      const labelHtml = '<label for="'+fieldId+'">'+meta.label
        +' <span class="cnt" data-cnt>'+val.length+'/'+meta.max+'</span></label>';
      if(meta.type === 'textarea'){
        field.innerHTML = labelHtml + '<textarea '+common+'></textarea>';
      } else if(meta.key === 'addr'){
        field.innerHTML = labelHtml
          + '<div class="addr-row">'
          +   '<textarea '+common+' rows="2" enterkeyhint="next"></textarea>'
          +   '<button type="button" class="nav-btn" data-nav-btn title="네이버맵으로 길찾기">네이버맵 길찾기</button>'
          + '</div>';
      } else if(meta.key === 'birth'){
        field.innerHTML = labelHtml
          + '<div class="birth-row">'
          +   '<input '+common+' type="date" enterkeyhint="next">'
          +   '<span class="age-badge' + (calcAge(val) !== '' ? ' filled' : '') + '" data-age-badge>' + escapeHtml(ageLabel(val)) + '</span>'
          + '</div>';
      } else {
        const inputType = meta.inputType === 'tel' ? 'tel' : 'text';
        field.innerHTML = labelHtml + '<input '+common+' type="'+inputType+'" enterkeyhint="next">';
      }
      if(meta.key === 'addr'){
        const navBtn = field.querySelector('[data-nav-btn]');
        navBtn.addEventListener('click', ()=>{
          openInNavApp(currentVisits[idx].addr, navBtn);
        });
        // 주소는 여러 줄로 자동 줄바꿈만 되면 충분 — 물리 키보드의 Enter로
        // 실제 줄바꿈(개행)이 들어가 저장/길찾기에 지장이 없도록 막는다.
        const addrTa = field.querySelector('[data-field]');
        addrTa.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter'){ e.preventDefault(); }
        });
      }
      // 글자수는 평소엔 감춰두고 입력 중이거나 한도의 80%를 넘으면 보여준다
      const cntEl = field.querySelector('[data-cnt]');
      const near = Math.floor(meta.max * 0.8);
      const syncCnt = (v)=>{
        cntEl.textContent = v.length+'/'+meta.max;
        cntEl.classList.toggle('near', v.length >= near);
        cntEl.classList.toggle('warn', v.length >= meta.max);
      };
      syncCnt(val);
      const inputEl = field.querySelector('[data-field]');
      inputEl.value = val;
      inputEl.addEventListener('focus', ()=>field.classList.add('focused'));
      inputEl.addEventListener('blur', ()=>field.classList.remove('focused'));
      inputEl.addEventListener('input', (e)=>{
        let v = e.target.value;
        // 휴대폰번호는 입력하는 동안 010-1234-5678 형식으로 자동 정리
        if(meta.key === 'phone'){
          v = formatPhone(v);
          e.target.value = v;
        }
        // 주소에 붙여넣기 등으로 줄바꿈이 섞여 들어오면 공백으로 정리
        // (화면에는 2줄로 자동 줄바꿈되지만, 저장되는 값 자체는 한 줄 텍스트로 유지)
        if(meta.key === 'addr' && /[\r\n]/.test(v)){
          const pos = e.target.selectionStart;
          v = v.replace(/[\r\n]+/g, ' ');
          e.target.value = v;
          if(typeof pos === 'number') e.target.setSelectionRange(pos, pos);
        }
        currentVisits[idx][meta.key] = v;
        syncCnt(v);
        // 생년월일을 입력/수정할 때마다 옆의 나이 배지를 즉시 갱신
        if(meta.key === 'birth'){
          const badge = field.querySelector('[data-age-badge]');
          if(badge){
            const filled = calcAge(v) !== '';
            badge.textContent = ageLabel(v);
            badge.classList.toggle('filled', filled);
          }
        }
        // 이 방문칸에 뭔가 입력할 때마다 최신 수정 시각으로 갱신
        // (예: 10시에 휴대폰번호를 적었다가, 나중에 방문지에서 생년월일을
        //  고쳐 입력하면 그 수정한 시각으로 다시 기록됨)
        if(v.trim()){
          stampTime();
        }
        if(meta.key === 'addr') refreshConnectors();
        updateProgress();
        scheduleSave();
      });
      body.appendChild(field);
    });
    wrap.appendChild(card);

    // 이 카드 → 다음 카드 구간 경로 버튼 (마지막 카드 다음에는 넣지 않음)
    if (idx < currentVisits.length - 1) {
      const connector = document.createElement('div');
      connector.className = 'segment-connector';
      connector.innerHTML = '<button type="button" class="segment-btn" data-seg-btn>'
        + '<span class="arrow">↓</span> ' + (idx+1) + '번 → ' + (idx+2) + '번 구간 경로'
        + '</button>';
      const segBtn = connector.querySelector('[data-seg-btn]');
      segBtn.addEventListener('click', () => openSegmentRoute(idx, idx+1, segBtn));
      wrap.appendChild(connector);
      segConnectors.push({ el: connector, i: idx });
    }
  });
  const cardCountEl = $('cardCount');
  if(cardCountEl) cardCountEl.textContent = currentVisits.length;
  updateProgress();
  updateAddCardBtn();
  refreshConnectors();
  refreshSortHint();
}

// ---------------- 내비 앱 연동 (네이버맵 전용, v25에서 T맵 지원 제거) ----------------
// 방문주소 → 좌표 변환(지오코딩) 후 네이버맵을 목적지 경로안내 화면으로 바로 실행.
// 좌표를 못 찾으면 네이버맵의 검색 화면으로라도 열어서 최소한 앱 실행 + 주소 검색까지는 되게 함.
const NAVER_STORE_IOS = 'https://apps.apple.com/kr/app/id311867728';
const NAVER_STORE_AOS = 'https://play.google.com/store/apps/details?id=com.nhn.android.nmap';
const NAVER_APPNAME = 'com.atlaslab.visitlog'; // 네이버맵 URL Scheme 필수 식별자(임의 문자열 가능)

async function geocodeAddressKR(addr){
  const q = encodeURIComponent(addr + ', 대한민국');
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=' + q;
  const res = await fetch(url);
  if(!res.ok) return null;
  const list = await res.json();
  if(!Array.isArray(list) || !list.length) return null;
  const { lat, lon } = list[0];
  if(!lat || !lon) return null;
  return { lat, lon };
}

// URL로 이동시키되, 앱이 실제로 열려 화면이 전환됐는지(visibilitychange)를 감지해서
// 안 열렸을 때만(=미설치 등) 스토어로 안내.
function launchAppUrl(appUrl, storeUrl){
  let switched = false;
  const onHide = () => { switched = true; };
  document.addEventListener('visibilitychange', onHide, { once:true });
  window.location.href = appUrl;
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide);
    if(!switched && storeUrl){
      window.location.href = storeUrl;
    }
  }, 1500);
}

async function openInNavApp(address, btnEl){
  const raw = (address || '').trim();
  if(!raw){
    showToast('방문주소를 먼저 입력해주세요');
    return;
  }
  // '(' 앞부분만 내비 앱으로 전달 (예: "의림대로 41(영천동)" → "의림대로 41")
  const addr = raw.split('(')[0].trim() || raw;
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const storeUrl = isIOS ? NAVER_STORE_IOS : NAVER_STORE_AOS;
  const enc = encodeURIComponent(addr);
  if(btnEl) btnEl.classList.add('loading');
  try{
    const geo = await geocodeAddressKR(addr);
    if(geo){
      const navUrl = 'nmap://navigation?dlat='+geo.lat+'&dlng='+geo.lon+'&dname='+enc+'&appname='+NAVER_APPNAME;
      launchAppUrl(navUrl, storeUrl);
    } else {
      showToast('정확한 좌표를 못 찾아 네이버맵 검색으로 엽니다');
      const searchUrl = 'nmap://search?query='+enc+'&appname='+NAVER_APPNAME;
      launchAppUrl(searchUrl, storeUrl);
    }
  }catch(err){
    showToast('주소 조회 실패 — 네이버맵 검색으로 엽니다');
    const searchUrl = 'nmap://search?query='+enc+'&appname='+NAVER_APPNAME;
    launchAppUrl(searchUrl, storeUrl);
  }finally{
    if(btnEl) btnEl.classList.remove('loading');
  }
}

// ---------------- 구간 경로 (N번 방문지 → N+1번 방문지) ----------------
// 네이버맵: 출발지·도착지 좌표를 모두 지정한 정식 경로(nmap://route/car)를 엽니다.
async function openSegmentRoute(fromIdx, toIdx, btnEl){
  const fromRaw = (currentVisits[fromIdx].addr || '').trim();
  const toRaw = (currentVisits[toIdx].addr || '').trim();
  if(!fromRaw || !toRaw){
    showToast((fromIdx+1)+'번과 '+(toIdx+1)+'번 방문지 주소를 모두 입력해주세요');
    return;
  }
  const fromAddr = fromRaw.split('(')[0].trim() || fromRaw;
  const toAddr = toRaw.split('(')[0].trim() || toRaw;
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const storeUrl = isIOS ? NAVER_STORE_IOS : NAVER_STORE_AOS;

  if(btnEl) btnEl.classList.add('loading');
  try{
    const [fromGeo, toGeo] = await Promise.all([geocodeAddressKR(fromAddr), geocodeAddressKR(toAddr)]);

    if(!toGeo){
      showToast((toIdx+1)+'번 방문지 좌표를 못 찾아 네이버맵 검색으로 엽니다');
      const enc = encodeURIComponent(toAddr);
      const searchUrl = 'nmap://search?query='+enc+'&appname='+NAVER_APPNAME;
      launchAppUrl(searchUrl, storeUrl);
      return;
    }

    const dEnc = encodeURIComponent(toAddr);
    let navUrl;
    if(fromGeo){
      const sEnc = encodeURIComponent(fromAddr);
      navUrl = 'nmap://route/car?slat='+fromGeo.lat+'&slng='+fromGeo.lon+'&sname='+sEnc
        + '&dlat='+toGeo.lat+'&dlng='+toGeo.lon+'&dname='+dEnc+'&appname='+NAVER_APPNAME;
    }else{
      navUrl = 'nmap://route/car?dlat='+toGeo.lat+'&dlng='+toGeo.lon+'&dname='+dEnc+'&appname='+NAVER_APPNAME;
      showToast((fromIdx+1)+'번 출발지 좌표를 못 찾아 도착지만 안내합니다');
    }
    launchAppUrl(navUrl, storeUrl);
  }catch(err){
    showToast('주소 조회 중 오류가 발생했어요');
  }finally{
    if(btnEl) btnEl.classList.remove('loading');
  }
}

// ---------------- 자동 저장 (0.6초 디바운스) ----------------
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    saveCurrent();
  }, SAVE_DEBOUNCE_MS);
}

async function saveCurrent(){
  try{
    await storage.set(keyFor(currentDate, currentPeriod), JSON.stringify(currentVisits));
    $('lastSaved').textContent = '저장됨 ' + nowHHMMSS().slice(0,5);
    refreshPeriodCounts();
  }catch(e){
    $('lastSaved').textContent = '저장 실패';
  }
}

async function flushSave(){
  if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
  }
  await saveCurrent();
  await flushMemoSave();
}

// ---------------- 5분 자동 임시저장 (기기 내부, 조용히) ----------------
function startBackupInterval(){
  stopBackupInterval();
  if(!autoBackupEnabled) return;
  backupIntervalId = setInterval(()=>runAutoBackup(), BACKUP_INTERVAL_MS);
}
function stopBackupInterval(){
  if(backupIntervalId){ clearInterval(backupIntervalId); backupIntervalId = null; }
}

async function runAutoBackup(){
  if(!autoBackupEnabled) return;
  if(!hasAnyData(currentVisits)) return;
  const now = Date.now();
  if(now - lastBackupAt < BACKUP_SAFETY_GAP_MS) return;
  lastBackupAt = now;
  try{
    const payload = {
      savedAt: new Date().toISOString(),
      date: currentDate,
      period: currentPeriod,
      visits: currentVisits,
    };
    await storage.set(BACKUP_KEY, JSON.stringify(payload));
    const lb = $('lastBackup');
    if(lb) lb.textContent = '임시저장 ' + nowHHMMSS().slice(0,5);
  }catch(e){ /* 자동저장(storage)은 계속 유지되므로 조용히 무시 */ }
}

$('autoBackupToggle').addEventListener('change', (e)=>{
  autoBackupEnabled = e.target.checked;
  saveSettings();
  if(autoBackupEnabled){ startBackupInterval(); showToast('5분 자동 임시저장 켜짐'); }
  else { stopBackupInterval(); showToast('5분 자동 임시저장 꺼짐'); }
});

// 화면을 벗어나거나(다른 앱 전환·화면 잠금) 탭이 닫히기 직전:
// 디바운스 대기 중인 저장을 즉시 반영하고 백업도 남긴다 (데이터 유실 방지)
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ flushSave(); runAutoBackup(); }
});

// ---------------- 리포트 텍스트 ----------------
function buildReportText(dateStr, visits, period, memo){
  const lines = [];
  const periodTag = period ? ' ['+PERIOD_LABEL[period]+']' : '';
  lines.push('방문일지 '+dateStr+' ('+weekdayKR(dateStr)+')'+periodTag);
  lines.push('='.repeat(28));
  let count = 0;
  visits.forEach((v, i)=>{
    if(!(addrFilled(v.addr)||v.target||v.phone||v.birth||v.note||v.time||v.visitor)) return;
    count++;
    lines.push('');
    lines.push('[방문 '+(i+1)+']');
    lines.push('방문시각: '+(v.time || '-'));
    lines.push('주소: '+(v.addr||'-'));
    lines.push('방문예정자명: '+(v.target||'-'));
    lines.push('휴대폰번호: '+(v.phone||'-'));
    lines.push('생년월일: '+(v.birth||'-'));
    lines.push('나이: '+(v.birth ? ageLabel(v.birth) : '-'));
    lines.push('특이사항: '+(v.note||'-'));
    lines.push('방문담당자명: '+(v.visitor||'-'));
  });
  if(count===0){ lines.push(''); lines.push('(입력된 방문 기록 없음)'); }
  if(memo && memo.trim()){
    lines.push('');
    lines.push('-'.repeat(28));
    lines.push('[메모]');
    lines.push(memo.trim());
  }
  return lines.join('\n');
}

    + 'main{max-width:520px;margin:0 auto;padding:20px 16px 40px;}\n'
