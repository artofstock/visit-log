<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>방문일지</title>
<meta name="theme-color" content="#0f6a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="방문일지">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--
  방문일지 (Visit Log) v13
  =========================
  v12 → v13 개선 사항:
  1. 방문처를 고정 4곳에서 N개(최대 12개)로 확장:
     - 기본 4곳 표시, [+ 방문 추가] 버튼으로 1개씩 추가 가능.
     - 기존 저장 데이터와 100% 호환 (배열 길이 그대로 유지).
  2. 하단 액션바에 [링크공유] 버튼 추가:
     - 데이터를 간단히 암호화(XOR+Base64)하여 URL 해시에 담음.
     - 카카오톡 등으로 링크를 받은 사람이 열면 동일한 화면 표시.
     - 기존 불러오기/복사/저장 버튼도 그대로 유지.
  3. 카드 단위 페이지 스크롤:
     - CSS scroll-snap으로 한 번 스와이프 시 한 카드씩 정확히 정렬.
     - 카드가 뷰포트를 채우도록 높이 조정 → 매번 맨 위부터 스크롤하지 않음.
     - 페이지 인디케이터(점)로 현재 위치 표시.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E9EDE7;
    --paper-2: #DFE5DE;
    --ink: #232F3B;
    --ink-soft: #56635F;
    --teal: #2F6F62;
    --teal-dark: #204E44;
    --teal-pale: #DCE8E2;
    --brick: #A63D40;
    --line: #C7CFC5;
    --card: #F5F7F3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
    min-height:100vh;
    padding-bottom:96px;
  }
  .bg-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, var(--line) 28px);
  }
  header{
    position:relative; z-index:1;
    padding:22px 18px 14px;
    border-bottom:2px solid var(--ink);
  }
  .eyebrow-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:4px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; color:var(--teal-dark);
    text-transform:uppercase;
  }
  .ver-tag{
    display:inline-block; margin-left:4px; padding:1px 6px;
    border:1px solid var(--teal-dark); border-radius:8px;
    font-size:10px; letter-spacing:.05em;
  }
  .progress-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; font-weight:600; color:var(--teal-dark);
    border:1.3px solid var(--teal-dark); background:var(--teal-pale);
    padding:2px 8px; white-space:nowrap;
  }
  h1{
    font-family:'Noto Serif KR','Malgun Gothic',serif;
    font-weight:700; font-size:26px; margin:0 0 12px;
    letter-spacing:-.01em;
  }
  .date-nav{
    display:flex; align-items:center; gap:10px;
  }
  .date-nav button{
    width:36px;height:36px; border-radius:0; border:1.5px solid var(--ink);
    background:var(--card); color:var(--ink); font-size:16px; font-family:'IBM Plex Mono',monospace;
    cursor:pointer; flex-shrink:0;
  }
  .date-nav button:active{ background:var(--ink); color:var(--card); }
  .date-display{
    flex:1; min-width:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:15px; font-weight:600;
    border:1.5px solid var(--ink); background:var(--card);
    padding:8px 10px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .date-display input[type=date]{
    border:none; background:transparent; font-family:'IBM Plex Mono',monospace;
    font-size:14px; font-weight:600; color:var(--ink); width:100%; min-width:0;
  }
  .weekday{ color:var(--teal-dark); flex-shrink:0; }

  main{ position:relative; z-index:1; padding:16px; }

  .search-bar{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .search-bar input{
    flex:1; min-width:0; border:1.5px solid var(--ink); background:#fff;
    padding:10px 12px; font-size:14px;
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif; color:var(--ink);
  }
  .search-bar input:focus{ outline:none; border-color:var(--teal); }
  .search-bar button{
    padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer;
    border:1.5px solid var(--teal-dark); background:var(--teal-dark); color:#fff;
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif; white-space:nowrap;
    flex-shrink:0;
  }
  .search-bar select{
    flex-shrink:0; border:1.5px solid var(--ink); background:#fff;
    padding:10px 4px; font-size:13px;
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif; color:var(--ink);
  }
  .search-bar button:active{ background:var(--ink); border-color:var(--ink); }
  .search-bar .search-clear{
    background:var(--card); color:var(--ink); border-color:var(--ink);
  }
  .search-view{ display:none; }
  .search-view.show{ display:block; }
  .search-meta{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);
    margin:-4px 0 14px; padding:0 4px;
  }
  .result-card{ cursor:pointer; }
  .result-card:active{ border-color:var(--teal); }
  .result-card .card-head{ flex-wrap:wrap; row-gap:6px; }
  .result-date{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px;
    color:var(--teal-dark);
  }
  .result-head-main{ flex:1; min-width:0; }
  .result-visitor{
    font-size:14.5px; font-weight:700; color:var(--ink);
    margin-top:2px; word-break:break-all;
  }
  .result-match{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:var(--teal-dark); border:1px solid var(--teal-dark);
    background:var(--teal-pale); padding:2px 7px; white-space:nowrap;
  }
  .result-body{ padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .result-row{ display:flex; gap:8px; font-size:13.5px; align-items:baseline; }
  .result-row .rk{
    flex-shrink:0; width:82px; color:var(--ink-soft);
    font-size:12.5px; font-weight:500;
  }
  .result-row .rv{ flex:1; min-width:0; word-break:break-all; }
  mark{ background:#F2E3A0; color:inherit; padding:0 1px; }

  .toolbar{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .toolbar button{
    flex:1; padding:9px 6px; font-size:12.5px; font-weight:500;
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif; cursor:pointer;
  }
  .toolbar button.active{ background:var(--ink); color:var(--paper); }

  .card{
    background:var(--card);
    border:1.5px solid var(--ink);
    margin-bottom:16px;
    position:relative;
    box-shadow: 3px 3px 0 var(--line);
    scroll-snap-align: start;
    min-height: calc(100dvh - 310px);
    display:flex;
    flex-direction:column;
  }
  .card-head{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    border-bottom:1.5px dashed var(--line);
    background:var(--paper-2);
    flex-shrink:0;
  }
  .stub-num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:14px;
    width:26px;height:26px;
    border:1.5px solid var(--teal-dark);
    color:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .stub-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase;
  }
  .time-area{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .time-value{
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600;
    color:var(--teal-dark); min-width:56px; text-align:right;
  }
  .time-value.empty{ color:var(--line); font-weight:500; }
  .time-btn{
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:11.5px; font-weight:700;
    border:1.5px solid var(--teal-dark); background:#fff; color:var(--teal-dark);
    padding:6px 10px; cursor:pointer; white-space:nowrap;
  }
  .time-btn:active{ background:var(--teal-dark); color:#fff; }
  .delete-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    border:1.5px solid var(--brick); background:#fff; color:var(--brick);
    padding:4px 8px; cursor:pointer; white-space:nowrap; margin-left:6px;
  }
  .delete-btn:active{ background:var(--brick); color:#fff; }
  .card-body{ padding:14px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .card-body{ padding:14px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .field label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-bottom:5px;
  }
  .field label .cnt{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
  }
  .field label .cnt.warn{ color:var(--brick); }
  .field input, .field textarea{
    width:100%; border:1.3px solid var(--line); background:#fff;
    padding:9px 10px; font-size:14.5px; font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
    color:var(--ink); resize:none;
  }
  .field textarea{ min-height:52px; line-height:1.4; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--teal); }
  .field.flag input, .field.flag textarea{ border-color:#DCC9A8; background:#FBF6EC; }

  /* 카드 스크롤 영역 */
  .cards-scroll{
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    max-height: calc(100dvh - 280px);
  }

  /* 추가 버튼 */
  .add-card-btn{
    width:100%;
    padding:16px;
    font-size:14px; font-weight:700;
    border:1.5px dashed var(--teal-dark);
    background:var(--card);
    color:var(--teal-dark);
    cursor:pointer;
    margin-bottom:16px;
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
  }
  .add-card-btn:active{ background:var(--teal-pale); }
  .add-card-btn:disabled{
    border-color:var(--line);
    color:var(--ink-soft);
    cursor:not-allowed;
  }

  /* 페이지 인디케이터 */
  .page-dots{
    display:flex; justify-content:center; align-items:center;
    gap:6px; margin:4px 0 12px;
  }
  .page-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--line);
    transition:all .2s ease;
  }
  .page-dot.active{
    background:var(--teal-dark);
    transform:scale(1.3);
  }

  .save-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 4px; margin:-4px 0 14px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);
  }
  .save-row .dot{ width:6px;height:6px;border-radius:50%; background:var(--teal); display:inline-block; margin-right:6px; }
  .backup-row{ margin:0 0 14px; padding:8px 4px 0; border-top:1px dashed var(--line); }
  .switch-label{ display:flex; align-items:center; gap:7px; cursor:pointer; color:var(--ink-soft); }
  .switch-label input[type=checkbox]{ width:14px;height:14px; accent-color:var(--teal-dark); cursor:pointer; }

  .actionbar{
    position:fixed; bottom:0; left:0; right:0; z-index:5;
    display:flex; gap:6px;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    background:var(--paper); border-top:2px solid var(--ink);
  }
  .actionbar button{
    flex:1; padding:12px 4px; font-size:13px; font-weight:700;
    border:1.5px solid var(--ink); cursor:pointer;
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
    white-space:nowrap;
  }
  .btn-share{ background:var(--teal-dark); color:#fff; border-color:var(--teal-dark); }
  .btn-copy{ background:var(--card); color:var(--ink); }

  .history{ display:none; }
  .history.show{ display:block; }
  .hist-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; background:var(--card); border:1.3px solid var(--line);
    margin-bottom:8px; cursor:pointer;
  }
  .hist-item:active{ border-color:var(--ink); }
  .hist-date{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; }
  .hist-meta{ font-size:12px; color:var(--ink-soft); }
  .hist-count{
    font-family:'IBM Plex Mono',monospace; font-size:11px;
    border:1px solid var(--teal-dark); color:var(--teal-dark);
    padding:2px 7px;
  }
  .empty{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;
  }
  .day-view{ display:block; }
  .day-view.hide{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:10px 18px;
    font-size:13px; font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
    opacity:0; transition:all .25s ease; z-index:20; white-space:nowrap;
    max-width:92vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* 데스크톱에서도 카드 높이 제한 */
  @media (min-width: 768px){
    .card{ min-height: 520px; }
    .cards-scroll{ max-height: 620px; }
  }
</style>
</head>
<body>
<div class="bg-texture"></div>

<header>
  <div class="eyebrow-row">
    <div class="eyebrow">FIELD VISIT LOG · 방문일지 <span class="ver-tag">v13</span></div>
    <span class="progress-chip" id="progressChip">작성 0/4</span>
  </div>
  <h1>오늘의 방문 기록</h1>
  <div class="date-nav">
    <button id="prevDay" type="button">‹</button>
    <div class="date-display">
      <span class="weekday" id="weekdayLabel">월</span>
      <input type="date" id="dateInput">
    </div>
    <button id="nextDay" type="button">›</button>
  </div>
</header>

<main>
  <div class="search-bar">
    <select id="searchScope" aria-label="검색 범위">
      <option value="all">전체</option>
      <option value="visitor">담당자명</option>
      <option value="addr">주소</option>
      <option value="name">상호</option>
      <option value="changed">변경상호</option>
      <option value="note">특이사항</option>
    </select>
    <input type="text" id="searchInput" placeholder="빠른 검색 (주소·상호·담당자 등)"
           enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="searchBtn" type="button">검색</button>
    <button id="searchClear" class="search-clear" type="button" style="display:none">닫기</button>
  </div>

  <div class="toolbar">
    <button id="tabDay" class="active" type="button">오늘 기록</button>
    <button id="tabHistory" type="button">지난 기록</button>
  </div>

  <div id="searchView" class="search-view">
    <div class="search-meta" id="searchMeta"></div>
    <div id="searchResults"></div>
  </div>

  <div id="dayView" class="day-view">
    <div class="save-row"><span><span class="dot"></span>자동 저장됨</span><span id="lastSaved">—</span></div>
    <div class="save-row backup-row">
      <label class="switch-label">
        <input type="checkbox" id="autoBackupToggle" checked>
        <span>5분마다 자동 임시저장 (기기 내부)</span>
      </label>
      <span id="lastBackup">—</span>
    </div>
    <div id="cardsWrap" class="cards-scroll"></div>
    <div id="addVisitArea"></div>
    <div id="pageDots" class="page-dots"></div>
  </div>

  <div id="historyView" class="history">
    <div id="historyList"></div>
  </div>
</main>

<div class="actionbar" id="actionbar">
  <button class="btn-copy" id="importBtn" type="button">불러오기</button>
  <button class="btn-copy" id="copyBtn" type="button">복사</button>
  <button class="btn-copy" id="linkShareBtn" type="button">링크공유</button>
  <button class="btn-share" id="shareBtn" type="button">저장</button>
</div>
<input type="file" id="importFile" accept=".txt,.json,.html,.htm,text/plain,application/json,text/html" style="display:none">

<div class="toast" id="toast"></div>

<script>
'use strict';

// ===================================================================
// 저장소 어댑터
// ===================================================================
const storage = (() => {
  if (window.storage && typeof window.storage.get === 'function') {
    return window.storage;
  }
  return {
    async get(key){
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key){
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix){
      const keys = [];
      prefix = prefix || '';
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) keys.push(k);
      }
      return { keys };
    }
  };
})();

const LIMITS = { addr:80, name:20, changed:20, note:100, visitor:20 };
const FIELD_META = [
  {key:'visitor', label:'방문담당자명', type:'input',    max:LIMITS.visitor},
  {key:'addr',    label:'방문주소',     type:'input',    max:LIMITS.addr},
  {key:'name',    label:'방문상호',     type:'input',    max:LIMITS.name},
  {key:'changed', label:'변경 상호',    type:'input',    max:LIMITS.changed},
  {key:'note',    label:'특이사항',     type:'textarea', max:LIMITS.note},
];
const FIELD_LABEL = {
  addr:'방문주소', name:'방문상호', changed:'변경 상호',
  note:'특이사항', visitor:'방문담당자명', time:'방문시각',
};
const SETTINGS_KEY = 'visit-log:settings';
const BACKUP_KEY   = 'visit-log:backup';
const DATE_KEY_RE  = /^\d{4}-\d{2}-\d{2}$/;
const SAVE_DEBOUNCE_MS = 600;
const BACKUP_INTERVAL_MS = 5 * 60 * 1000;
const BACKUP_SAFETY_GAP_MS = 10000;

// --- v13: 동적 방문처 수 ---
const MAX_VISITS = 12;
const DEFAULT_VISITS = 4;

// --- v13: 링크 공유 암호화 키 ---
const SHARE_KEY = 'visitlog-share-key-2024';

let currentDate = todayStr();
let currentVisits = emptyVisits();
let saveTimer = null;
let backupIntervalId = null;
let lastBackupAt = 0;
let autoBackupEnabled = true;

function $(id){ return document.getElementById(id); }

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
}
function nowHHMMSS(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function emptyVisits(n = DEFAULT_VISITS){
  return Array.from({length: n}, ()=>({addr:'',name:'',changed:'',note:'',time:'',visitor:''}));
}
const _weekdayCache = {};
function weekdayKR(dateStr){
  if(_weekdayCache[dateStr]) return _weekdayCache[dateStr];
  const days=['일','월','화','수','목','금','토'];
  const d = new Date(dateStr+'T00:00:00');
  const r = days[d.getDay()]+'요일';
  _weekdayCache[dateStr] = r;
  return r;
}
function keyFor(dateStr){ return 'visit-log:'+dateStr; }

function hasAnyData(visits){
  return visits.some(v => v.addr || v.name || v.changed || v.note || v.time || v.visitor);
}

// 손상된 저장 데이터를 안전하게 보정
function normalizeVisits(parsed){
  let raw = null;
  if (Array.isArray(parsed)) raw = parsed;
  else if (parsed && Array.isArray(parsed.visits)) raw = parsed.visits;
  if (!raw) return emptyVisits();
  const targetLen = Math.min(MAX_VISITS, Math.max(DEFAULT_VISITS, raw.length));
  const fixed = emptyVisits(targetLen);
  for (let i = 0; i < targetLen; i++){
    if (i >= raw.length) continue;
    const src = raw[i];
    if (!src || typeof src !== 'object') continue;
    FIELD_META.forEach(m => {
      if (typeof src[m.key] === 'string') fixed[i][m.key] = src[m.key].slice(0, m.max);
    });
    if (typeof src.time === 'string') fixed[i].time = src.time;
  }
  return fixed;
}

function updateActiveDot(){

  const dots = document.querySelectorAll('.page-dot');
  if (!wrap || dots.length === 0) return;
  const scrollTop = wrap.scrollTop;
  const cardHeight = wrap.querySelector('.card')?.offsetHeight || 1;
  const gap = 16; // margin-bottom
  const approximateIndex = Math.round(scrollTop / (cardHeight + gap));
  const idx = Math.max(0, Math.min(dots.length - 1, approximateIndex));
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));

function scheduleSave(){

  saveTimer = setTimeout(()=>{
    saveTimer = null;
    saveCurrent();
  }, SAVE_DEBOUNCE_MS);
}

async function saveCurrent(){

  }catch(e){

    clearTimeout(saveTimer);
    saveTimer = null;
  }

}

// ---------------- 5분 자동 임시저장 ----------------
function startBackupInterval(){
  stopBackupInterval();
  if(!autoBackupEnabled) return;
  backupIntervalId = setInterval(()=>runAutoBackup(), BACKUP_INTERVAL_MS);
}
function stopBackupInterval(){
  if(backupIntervalId){ clearInterval(backupIntervalId); backupIntervalId = null; }
}

async function runAutoBackup(){
  if(!autoBackupEnabled) return;
  if(!hasAnyData(currentVisits)) return;
  const now = Date.now();
  if(now - lastBackupAt < BACKUP_SAFETY_GAP_MS) return;
  lastBackupAt = now;
  try{
    const payload = {
      savedAt: new Date().toISOString(),
      date: currentDate,
      visits: currentVisits,
    };
    await storage.set(BACKUP_KEY, JSON.stringify(payload));
    const lb = $('lastBackup');
    if(lb) lb.textContent = '임시저장 ' + nowHHMMSS().slice(0,5);
  }catch(e){}
}

$('autoBackupToggle').addEventListener('change', (e)=>{
  autoBackupEnabled = e.target.checked;
  saveSettings();
  if(autoBackupEnabled){ startBackupInterval(); showToast('5분 자동 임시저장 켜짐'); }
  else { stopBackupInterval(); showToast('5분 자동 임시저장 꺼짐'); }
});

  const lines = [];

  let count = 0;
  visits.forEach((v, i)=>{

    count++;
    lines.push('');
    lines.push('[방문 '+(i+1)+']');
    lines.push('방문시각: '+(v.time || '-'));
    lines.push('주소: '+(v.addr||'-'));

  if(count===0){ lines.push(''); lines.push('(입력된 방문 기록 없음)'); }
  return lines.join('\n');
}

function extractReportHtmlJson(text){
  const m = text.match(/<script type="application\/json" id="visit-log-data">([\s\S]*?)<\/script>/);
  if(!m) return null;
  try{
    const d = JSON.parse(m[1]);
    return (d && d.visits) ? d : null;
  }catch(e){ return null; }
}

function parseReportText(text){
  const dateMatch = text.match(/방문일지\s+(\d{4}-\d{2}-\d{2})/);
  const parsedDate = dateMatch ? dateMatch[1] : null;
  const blocks = text.split(/\[방문\s*(\d+)\]/).slice(1);
  const visits = emptyVisits();
  for(let i=0; i<blocks.length-1; i+=2){
    const num = parseInt(blocks[i], 10);
    const body = blocks[i+1] || '';
    if(!(num>=1 && num<=MAX_VISITS)) continue;
    const get = (label) => {
      const m = body.match(new RegExp(label + ':\\s*(.*)'));
      if(!m) return '';
      const v = m[1].trim();
      return v === '-' ? '' : v;
    };
    // 필요한 경우 visits 배열 확장
    while (visits.length < num) visits.push({addr:'',name:'',changed:'',note:'',time:'',visitor:''});
    visits[num-1] = {
      time: get('방문시각'),
      addr: get('주소').slice(0, LIMITS.addr),
      name: get('상호').slice(0, LIMITS.name),
      changed: get('변경상호').slice(0, LIMITS.changed),
      note: get('특이사항').slice(0, LIMITS.note),
      visitor: get('방문담당자명').slice(0, LIMITS.visitor),
    };
  }
  return { date: parsedDate, visits, hasData: hasAnyData(visits) };
}

function downloadFile(filename, text, mime){
  const blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// ---------------- v13: 링크 공유 (강화된 암호화) ----------------
function encryptData(data){
  const json = JSON.stringify(data);
  const encoder = new TextEncoder();
  const bytes = encoder.encode(json);
  const keyBytes = encoder.encode(SHARE_KEY);
  const len = bytes.length;

  // 1. 인덱스 기반 복잡 변형 (단순 XOR 패턴 제거)
  const scrambled = new Uint8Array(len);
  for (let i = 0; i < len; i++){
    const k = keyBytes[i % keyBytes.length];
    scrambled[i] = bytes[i] ^ k ^ ((i * 31 + 17) & 0xFF) ^ ((k << (i % 3)) & 0xFF);
  }

  // 2. 바이트 순서를 인덱스 기반으로 섞기 (deterministic shuffle)
  const shuffled = new Uint8Array(len);
  for (let i = 0; i < len; i++){
    const j = (i * 7 + 3) % len; // deterministic 위치
    shuffled[i] = scrambled[j];
  }

  // 3. Base64 인코딩 (URL-safe)
  let binary = '';
  shuffled.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decryptData(base64){
  try{
    // URL-safe Base64 복원
    const b64 = base64.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64.length % 4;
    const fixed = pad ? b64 + '='.repeat(4 - pad) : b64;
    const binary = atob(fixed);
    const len = binary.length;

    // 1. Unshuffle
    const shuffled = new Uint8Array(len);
    for (let i = 0; i < len; i++) shuffled[i] = binary.charCodeAt(i);

    const scrambled = new Uint8Array(len);
    for (let i = 0; i < len; i++){
      const j = (i * 7 + 3) % len;
      scrambled[j] = shuffled[i];
    }

    // 2. Unscramble
    const encoder = new TextEncoder();
    const keyBytes = encoder.encode(SHARE_KEY);
    const decrypted = new Uint8Array(len);
    for (let i = 0; i < len; i++){
      const k = keyBytes[i % keyBytes.length];
      decrypted[i] = scrambled[i] ^ k ^ ((i * 31 + 17) & 0xFF) ^ ((k << (i % 3)) & 0xFF);
    }

    const json = new TextDecoder().decode(decrypted);
    return JSON.parse(json);
  }catch(e){
    return null;
  }
}
function encryptData(data){
  const json = JSON.stringify(data);
  const encoder = new TextEncoder();
  const bytes = encoder.encode(json);
  const keyBytes = encoder.encode(SHARE_KEY);
  const xored = bytes.map((b, i) => b ^ keyBytes[i % keyBytes.length]);
  let binary = '';
  xored.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function decryptData(base64){
  try{
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const encoder = new TextEncoder();
    const keyBytes = encoder.encode(SHARE_KEY);
    const decrypted = bytes.map((b, i) => b ^ keyBytes[i % keyBytes.length]);
    const json = new TextDecoder().decode(decrypted);
    return JSON.parse(json);
  }catch(e){
    return null;
  }
}

function parseUrlHash(){
  const hash = location.hash;
  if (!hash || !hash.startsWith('#share=')) return null;
  const encoded = decodeURIComponent(hash.slice(7));
  return decryptData(encoded);
}

  if (navigator.share){
    try{
      await navigator.share({ title: '방문일지 공유', text: currentDate + ' 방문일지', url });
    }catch(e){
      // 사용자 취소
    }
  }
}

// ---------------- 불러오기 ----------------
async function doImport(file){
  let text;
  try{
    text = await file.text();
  }catch(e){
    showToast('파일을 읽지 못했습니다');
    return;
  }

  let date = null, visits = emptyVisits(), hasData = false;
  try{
    const trimmed = text.trim();
    const isJsonName = /\.json$/i.test(file.name || '');
    const isHtmlName = /\.html?$/i.test(file.name || '');
    if(isHtmlName || trimmed.indexOf('id="visit-log-data"') !== -1){
      const d = extractReportHtmlJson(trimmed);
      if(!d){ showToast('HTML 파일에서 기록을 찾지 못했습니다'); return; }
      visits = normalizeVisits(d.visits);
      hasData = hasAnyData(visits);
      date = (d.date && DATE_KEY_RE.test(d.date)) ? d.date : null;
    } else if(isJsonName || trimmed.charAt(0) === '{' || trimmed.charAt(0) === '['){
      const parsed = JSON.parse(trimmed);
      visits = normalizeVisits(parsed);
      hasData = hasAnyData(visits);
      const dm = (file.name || '').match(/(\d{4}-\d{2}-\d{2})/);
      date = dm ? dm[1] : null;
    } else {
      const r = parseReportText(text);
      date = r.date; visits = r.visits; hasData = r.hasData;
    }
  }catch(e){
    showToast('파일 내용을 해석하지 못했습니다');
    return;
  }

  if(!hasData){
    showToast('파일에서 기록을 찾지 못했습니다');
    return;
  }

  await flushSave();
  if(date && DATE_KEY_RE.test(date)) currentDate = date;
  currentVisits = visits;
  $('dateInput').value = currentDate;
  $('weekdayLabel').textContent = weekdayKR(currentDate);
  renderCards();
  await saveCurrent();
  switchTab('day');
  showToast(currentDate+' 기록을 불러왔습니다');
}

$('importBtn').addEventListener('click', ()=>{ $('importFile').click(); });
$('importFile').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(file) doImport(file);
  e.target.value = '';
});

// ---------------- 복사 ----------------
async function doCopy(){
  await flushSave();
  const text = buildReportText(currentDate, currentVisits);
  try{
    await navigator.clipboard.writeText(text);
    showToast('클립보드에 복사했습니다');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('클립보드에 복사했습니다');
    }catch(e2){
      showToast('복사 실패 — 직접 선택해 복사해주세요');
    }
  }
}

// ---------------- 날짜 이동 ----------------
async function shiftDate(deltaDays){
  await flushSave();
  const d = new Date(currentDate+'T00:00:00');
  d.setDate(d.getDate()+deltaDays);
  const next = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  loadDate(next);
}

// ---------------- 빠른 검색 ----------------
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(text, query){
  const safe = escapeHtml(text);
  if(!query) return safe;
  const re = new RegExp(escapeRegExp(escapeHtml(query)), 'gi');
  return safe.replace(re, (m)=>'<mark>'+m+'</mark>');
}

async function doSearch(){
  const q = $('searchInput').value.trim();
  if(!q){ showToast('검색어를 입력하세요'); return; }
  await flushSave();
  const query = q.toLowerCase();
  const scope = $('searchScope').value;
  const searchFields = scope === 'all'
    ? ['visitor','addr','name','changed','note','time']
    : [scope];
  const results = [];
  try{
    const res = await storage.list('visit-log:');
    const keys = (res && res.keys ? res.keys : [])
      .filter(k => DATE_KEY_RE.test(k.replace('visit-log:','')))
      .sort().reverse();
    for(const k of keys){
      const dateStr = k.replace('visit-log:','');
      let visits = emptyVisits();
      try{
        const r = await storage.get(k);
        const parsed = r && r.value ? JSON.parse(r.value) : null;
        visits = normalizeVisits(parsed);
      }catch(e){ continue; }
      visits.forEach((v, idx) => {
        if(!(v.addr||v.name||v.changed||v.note||v.time||v.visitor)) return;
        const matched = [];
        searchFields.forEach((k)=>{
          if(String(v[k]||'').toLowerCase().indexOf(query) !== -1){
            matched.push(FIELD_LABEL[k]);
          }
        });
        if(matched.length > 0){
          results.push({ date: dateStr, idx: idx, visit: v, matched: matched, total: visits.length });
        }
      });
    }
  }catch(e){
    showToast('검색 중 오류가 발생했습니다');
    return;
  }
  renderSearchResults(q, results, $('searchScope').selectedOptions[0].textContent);
}

function renderSearchResults(query, results, scopeLabel){
  $('searchMeta').textContent = '"' + query + '"' + (scopeLabel && scopeLabel !== '전체' ? ' [범위: ' + scopeLabel + ']' : '') + ' 검색 결과: ' + results.length + '건';
  const wrap = $('searchResults');
  wrap.innerHTML = '';
  if(results.length === 0){
    wrap.innerHTML = '<div class="empty">검색 결과가 없습니다</div>';
  }
  results.forEach((r) => {
    const v = r.visit;
    const rows = [
      ['방문담당자명', v.visitor || '-'],
      ['방문시각', v.time || '-'],
      ['주소', v.addr || '-'],
      ['상호', v.name || '-'],
    ];
    if(v.changed) rows.push(['변경상호', v.changed]);
    rows.push(['특이사항', v.note || '-']);

    const card = document.createElement('div');
    card.className = 'card result-card';
    card.innerHTML =
      '<div class="card-head">'
      + '<div class="stub-num">' + (r.idx+1) + '</div>'
      + '<div class="result-head-main">'
      +   '<div class="result-date">' + r.date + ' (' + weekdayKR(r.date) + ') · 방문 ' + (r.idx+1) + ' / ' + r.total + '</div>'
      +   '<div class="result-visitor">' + highlight(v.visitor || '(담당자 없음)', query) + '</div>'
      + '</div>'
      + '</div>'
      + '<div class="result-body">'
      + '<div class="result-row"><div class="rk">일치 항목</div><div class="rv">'
      +   r.matched.map((m)=>'<span class="result-match">' + m + '</span>').join(' ')
      + '</div></div>'
      + rows.map((row) =>
          '<div class="result-row"><div class="rk">' + row[0] + '</div>'
          + '<div class="rv">' + highlight(row[1], query) + '</div></div>'
        ).join('')
      + '</div>';
    card.addEventListener('click', async ()=>{
      await flushSave();
      loadDate(r.date);
      clearSearch();
      showToast(r.date + ' 기록으로 이동했습니다');
    });
    wrap.appendChild(card);
  });
  showSearchView(true);
}

function showSearchView(show){
  const searchView = $('searchView');
  if(show){
    $('dayView').classList.add('hide');
    $('historyView').classList.remove('show');
    searchView.classList.add('show');
    $('actionbar').style.display = 'none';
    $('searchClear').style.display = '';
    $('tabDay').classList.remove('active');
    $('tabHistory').classList.remove('active');
  } else {
    searchView.classList.remove('show');
    $('searchClear').style.display = 'none';
    $('actionbar').style.display = 'flex';
    $('historyView').classList.remove('show');
    $('dayView').classList.remove('hide');
    $('tabHistory').classList.remove('active');
    $('tabDay').classList.add('active');
  }
}

function clearSearch(){
  $('searchInput').value = '';
  showSearchView(false);
}

$('searchBtn').addEventListener('click', doSearch);
$('searchClear').addEventListener('click', clearSearch);
$('searchInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); doSearch(); }
});

// ---------------- 지난 기록 ----------------
async function renderHistory(){
  const listEl = $('historyList');
  listEl.innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    const res = await storage.list('visit-log:');
    const keys = (res && res.keys ? res.keys : [])
      .filter(k => {
        if(k === SETTINGS_KEY || k === BACKUP_KEY || k === 'visit-log:dates') return false;
        const dateStr = k.replace('visit-log:','');
        return DATE_KEY_RE.test(dateStr);
      })
      .sort().reverse();
    if(keys.length === 0){
      listEl.innerHTML = '<div class="empty">저장된 기록이 없습니다</div>';
      return;
    }
    listEl.innerHTML = '';
    let shown = 0;
    for(const k of keys){
      const dateStr = k.replace('visit-log:','');
      let visits = emptyVisits();
      try{
        const r = await storage.get(k);
        const parsed = r && r.value ? JSON.parse(r.value) : null;
        visits = normalizeVisits(parsed);
      }catch(e){ continue; }
      const filled = countFilled(visits);
      if(filled === 0) continue;
      shown++;
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.innerHTML = '<div><div class="hist-date">'+dateStr+'</div>'
        + '<div class="hist-meta">'+weekdayKR(dateStr)+'</div></div>'
        + '<div class="hist-count">'+filled+'건</div>';
      item.addEventListener('click', async ()=>{
        await flushSave();
        loadDate(dateStr);
        switchTab('day');
      });
      listEl.appendChild(item);
    }
    if(shown === 0){
      listEl.innerHTML = '<div class="empty">저장된 기록이 없습니다</div>';
    }
  }catch(e){
    listEl.innerHTML = '<div class="empty">기록을 불러오지 못했습니다</div>';
  }
}

function switchTab(tab){
  const dayView = $('dayView');
  const histView = $('historyView');
  const tabDay = $('tabDay');
  const tabHist = $('tabHistory');
  const actionbar = $('actionbar');
  $('searchView').classList.remove('show');
  $('searchClear').style.display = 'none';
  if(tab==='day'){
    dayView.classList.remove('hide'); histView.classList.remove('show');
    tabDay.classList.add('active'); tabHist.classList.remove('active');
    actionbar.style.display = 'flex';
  } else {
    dayView.classList.add('hide'); histView.classList.add('show');
    tabHist.classList.add('active'); tabDay.classList.remove('active');
    actionbar.style.display = 'none';
    renderHistory();
  }
}

$('prevDay').addEventListener('click', ()=>shiftDate(-1));
$('nextDay').addEventListener('click', ()=>shiftDate(1));
$('dateInput').addEventListener('change', async (e)=>{
  if(e.target.value && DATE_KEY_RE.test(e.target.value)){
    await flushSave();
    loadDate(e.target.value);
  }
});
$('tabDay').addEventListener('click', async ()=>{ await flushSave(); switchTab('day'); });
$('tabHistory').addEventListener('click', async ()=>{ await flushSave(); switchTab('history'); });
$('shareBtn').addEventListener('click', doShare);
$('copyBtn').addEventListener('click', doCopy);
$('linkShareBtn').addEventListener('click', doLinkShare);

// ---------------- 초기화 ----------------
async function init(){
  await loadSettings();

  // URL 해시에 공유 데이터가 있으면 복원
  const shared = parseUrlHash();
  if (shared && shared.date && Array.isArray(shared.visits)){
    currentDate = shared.date;
    currentVisits = normalizeVisits(shared.visits);
    $('dateInput').value = currentDate;
    $('weekdayLabel').textContent = weekdayKR(currentDate);
    renderCards();
    await saveCurrent();
    // 해시 제거 (새로고침 시 중복 로드 방지)
    history.replaceState(null, '', location.pathname + location.search);
    showToast('공유받은 기록을 불러왔습니다');
  } else {
    loadDate(currentDate);
  }

  startBackupInterval();
}

init();
