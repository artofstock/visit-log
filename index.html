<!--
  방문일지 (Visit Log) v21
  =========================
  v20 → v21 개선 사항:
  1. "메모" 탭 추가 (오전/오후 옆):
     - 오전/오후와 별개로, 날짜 하나당 최대 2000자짜리 메모장 하나가
       추가됨. 하루 전체에 대한 요약이나 참고사항을 자유롭게 적을 수
       있음 (오전/오후 카드 내용과는 별도로 저장됨).
     - 입력하면 자동 저장(0.6초 디바운스, 카드 입력과 동일한 방식).
     - '공유코드'로 보낼 때 현재 카드 기록과 함께 메모도 같이 암호화되어
       전달됨 — 받는 사람이 코드+잠금번호를 입력하면 메모까지 그대로
       복원됨. 메모만 있고 카드가 비어 있어도 공유 가능.
     - '저장'(HTML 파일)과 '복사'(텍스트)에도 메모 내용이 함께 포함됨.
  2. 전체적인 디자인 다듬기: 카드/버튼/입력창에 부드러운 모서리와
     은은한 그림자를 더해 화면에 입체감을 주고, 버튼 눌림 효과와
     화면 전환에 부드러운 트랜지션을 추가해 조작감을 개선.

  v19 → v20 개선 사항:
  1. 오전 / 오후 기록 분리:
     - 날짜 아래에 "오전 / 오후" 탭이 추가됨. 같은 날짜라도 오전 방문과
       오후 방문을 완전히 별도의 카드 묶음으로 나눠서 기록·저장.
     - 저장 키가 날짜+오전/오후 단위로 나뉘어(예: 2026-08-21 오전 /
       2026-08-21 오후) 서로 덮어쓰지 않음.
     - 앱을 열면 현재 시각 기준으로 정오 이전이면 오전, 이후면 오후 탭이
       자동으로 먼저 선택됨. 탭을 눌러 언제든 전환 가능.
     - '지난 기록' 목록과 '빠른 검색' 결과에도 오전/오후가 함께 표시되어
       구분됨.
     - v19 이전 데이터(오전/오후 구분이 없던 기존 기록)는 자동으로
       "오전" 기록으로 인식되어 그대로 이어서 볼 수 있음 (데이터 유실 없음).

  v18 → v19 개선 사항:
  1. 방문시각 자동 기록 방식 변경: "처음 입력한 시각"만 기록하던 것을,
     그 카드의 아무 항목이든 새로 수정할 때마다 최신 수정 시각으로
     계속 갱신되도록 변경. (예: 10시에 상호를 적었다가, 실제 방문지에서
     변경상호를 고쳐 입력하면 그 수정한 시각으로 다시 기록됨— 즉 "최초
     작성 시각"이 아니라 "최종 수정 시각"을 반영)
     내용을 다 지워서 빈 칸이 되면 시각은 갱신하지 않음.
     수동으로 다시 찍고 싶을 때 쓰는 "재기록" 버튼은 그대로 유지.

  v17 → v18 개선 사항:
  1. 카드 개수를 4개 고정 → 최대 20개까지 늘릴 수 있도록 변경:
     - 기본은 이전처럼 4개만 보임
     - 화면 하단 "+ 카드 추가" 버튼을 누르면 카드가 1개씩 늘어남
       (최대 20개, 다 채우면 버튼이 "카드는 최대 20개까지..." 로 바뀌며 비활성화)
     - 저장/불러오기/공유코드/링크 등 기존 기능은 카드 개수에 상관없이
       그대로 동작 (4개든 20개든 실제 만든 개수만큼 저장·전송됨)

  v16 → v17 개선 사항:
  1. (디버깅) 공유코드 서버 오류 메시지에 상세 원인 코드 표시:
     - "서버 연결에 실패했습니다 (permission-denied)" 처럼 Firebase가
       반환한 오류 코드를 같이 보여줘서 원인 파악이 쉬워짐.

  v15 → v16 개선 사항:
  1. 공유 방식을 "링크" → "6자리 공유코드"로 전환 (Firebase Firestore 사용):
     - '공유코드' 버튼 → "코드 만들어 보내기" / "코드 입력해서 받기" 중 선택
     - 보내기: 잠금번호로 데이터 암호화(AES-GCM, 기존과 동일한 방식) 후
       Firestore에 저장, 6자리 코드 발급 (24시간 후 자동 만료)
     - 받기: 6자리 코드 입력 → 서버에서 암호문 조회 → 잠금번호 입력해서
       복호화 → 확인 후 화면에 반영
     - 코드만 알아도 잠금번호 없인 내용을 볼 수 없어 이중 보호 유지
     - 이 기능은 인터넷 연결이 필요함 (Firestore 서버 통신)

  v14 → v15 개선 사항:
  1. (버그 수정) 잠금번호 입력창이 안 뜨던 문제 해결:
     - 홈 화면에 설치된 PWA(standalone 모드)에서는 브라우저 내장
       window.prompt()/confirm() 팝업이 아예 뜨지 않는 경우가 있음
       → 앱 안에 직접 만든 입력창(모달)으로 교체. 설치된 앱이든 일반
       브라우저든 항상 동일하게 동작함.

  v13 → v14 개선 사항:
  1. (보안) '링크공유'에 잠금번호(PIN) 암호화 적용:
     - 공유 시 4자리 이상 잠금번호를 직접 정하고, 그 번호로 AES-GCM
       암호화(브라우저 내장 Web Crypto API, 외부 라이브러리 없음)해서
       링크에 담음. 잠금번호는 카톡이 아닌 별도 경로(전화 등)로 전달.
     - 받는 사람이 링크를 열어도 잠금번호를 모르면 내용을 볼 수 없음
       → 실수로 엉뚱한 사람에게 전송해도 방문 기록이 노출되지 않음.
     - 잠금번호가 맞아도 "OO 기록 N건을 불러올까요?" 확인창을 한 번 더
       띄워서, 실수로 현재 화면 내용을 덮어쓰는 것도 방지.

  v12 → v13 개선 사항:
  1. '링크공유' 기능 추가: 서버/DB 없이, 오늘 기록을 URL(#data=...)에
     담아 카톡 등으로 전송 가능. 받는 사람이 그 링크를 열면 자동으로
     해당 기록이 채워짐. 카메라(QR 스캔) 불필요, 텍스트 링크만 오가면 됨.
     - 외부 라이브러리 없이 브라우저 내장 기능(UTF-8 safe Base64)만 사용
       → 오프라인(PWA)에서도 100% 동일하게 동작.
     - '링크공유' 버튼: 현재 보고 있는 날짜의 기록을 링크로 만들어
       공유 시트(카톡 등)를 띄우거나, 지원 안 되면 클립보드에 복사.
     - 앱 접속 시 주소 뒤에 #data=... 가 있으면 자동으로 해석해서
       화면에 채우고, 처리 후 주소는 깨끗하게 정리(재접속 시 중복 방지).
     - 기존 저장(.html)/복사/불러오기(.txt·.json·.html)는 그대로 유지.

  v11 → v12 개선 사항:
  1. '저장' 결과물을 텍스트(.txt)에서 웹 페이지(.html)로 변경:
     - 저장 버튼을 누르면 그 날짜의 기록이 예쁘게 표 형식으로 정리된
       HTML 파일로 저장/공유됨 → 브라우저로 열면 바로 보고 인쇄 가능.
     - 파일 안에 기록 데이터(JSON)도 함께 내장되어 있어서, 앱의
       '불러오기'로 이 HTML 파일을 선택하면 기록이 그대로 복원됨.
       (기존 .txt/.json 파일 불러오기도 계속 지원)

  v10 → v11 개선 사항:
  1. 검색 범위 선택 추가: 검색창 왼쪽의 범위 선택(전체/담당자명/주소/
     상호/변경상호/특이사항)으로 검색 대상 항목을 제한 가능.
     - '전체'는 기존처럼 카드 전체를 그룹으로 검색.
     - '담당자명'으로 검색하면 방문담당자명 항목에만 해당 단어가 있는
       카드만 나열되어, 특이사항에 이름이 적힌 다른 담당자의 카드가
       섞여 나오는 혼란을 막을 수 있음.
     - 범위를 좁혀 검색하면 결과 상단에 [범위: 항목명]이 표시됨.
  2. 특이사항 글자수 제한 50자 → 100자로 확대.

  v9 → v10 개선 사항:
  1. 입력 항목 순서 변경: 방문담당자명을 맨 위(방문주소 위)로,
     특이사항은 맨 아래로. (저장 키 이름은 그대로라 기존 데이터와
     100% 호환됩니다)
  2. 검색 결과에 '일치 항목' 태그 표시: 카드 그룹 단위 검색이라
     주소/상호/특이사항 등 어떤 항목이 일치해도 카드가 나오는데,
     어느 항목이 일치했는지 안 보여서 "이름이 바뀐 것처럼" 보일 수
     있던 문제 → 각 결과 카드에 일치한 항목을 명확히 표시.
     결과 카드 머리에도 담당자 이름을 바로 보이게 추가.
  3. 브라우저 자동완성(autofill) 오염 방지: 모바일 브라우저가 한 카드에
     입력한 담당자 이름을 다른 카드의 담당자란에도 자동으로 채워
     저장해버리는 사례 방지 (autocomplete/data-lpignore 속성 강화).

  v8 → v9 개선 사항:
  1. 빠른 검색 기능 추가: 상단 검색창 + 검색 버튼(또는 Enter)으로
     모든 날짜의 기록에서 단어가 포함된 카드를 찾아 아래에 전체 나열.
     - 카드 1장을 하나의 그룹으로 검색 (주소/상호/변경상호/특이사항/
       담당자/시각 중 하나라도 단어가 포함되면 해당 카드가 결과에 표시)
     - 결과에 검색 단어를 노랗게 하이라이트
     - 결과 카드를 누르면 해당 날짜 기록으로 바로 이동
     - '닫기' 버튼으로 검색 결과를 닫고 원래 화면으로 복귀

  v7 → v8 개선 사항:
  1. (치명적 버그) 저장소가 window.storage(특수 환경 전용)에만 의존해서
     일반 브라우저에서 열면 저장이 전혀 되지 않던 문제 수정
     → window.storage 가 없으면 localStorage 를 쓰는 어댑터 추가.
     이제 크롬/사파리/삼성 인터넷 등 어떤 브라우저에서도 데이터가 유지됨.
  2. 방문주소 글자수 제한 50자 → 80자로 확대.
  3. 상단에 작성 진행 칩 "작성 n/4" 추가.
  4. 5분 자동 백업 방식 변경: 브라우저에서 5분마다 파일 다운로드를
     강제로 띄우던(브라우저가 차단하거나 다운로드 폴더가 지저분해지던)
     방식 → 기기 내부 저장소에 조용히 백업하는 방식으로 교체.
  5. '저장' 파일명에 날짜+시각(시분) 포함 → 누를 때마다 새 파일,
     실수로 눌러도 이전 파일을 덮어쓰지 않음.
  6. 불러오기: .txt 리포트뿐 아니라 .json 저장 파일도 지원.
  7. 손상된 저장 데이터(배열 길이 부족, 타입 오류 등)를 만나도
     앱이 죽지 않고 안전하게 보정해서 표시.
  8. 화면 이탈(다른 앱 전환/탭 닫기) 시 즉시 저장 — 입력 직후
     나가도 마지막 글자까지 유실되지 않음.
  9. 지난 기록 목록에서 백업/설정 키와 깨진 날짜 키 제외.
  10. 공유/다운로드 폴백의 objectURL 해제 타이밍 수정
      (즉시 해제하면 일부 브라우저에서 다운로드가 취소될 수 있음).
  11. 모바일 키보드 편의: 입력란 enterkeyhint="next" 적용,
      폰트에 맑은고딕 폴백 추가.
-->

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ECF0EA;
    --paper-2: #DFE5DE;
    --ink: #202B36;
    --ink-soft: #56635F;
    --teal: #2F6F62;
    --teal-dark: #1B4A40;
    --teal-pale: #DCE8E2;
    --brick: #A63D40;
    --brick-pale: #F3E1E0;
    --line: #C7CFC5;
    --card: #F5F7F3;
    --shadow-c: rgba(27,74,64,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -120px, rgba(255,255,255,.55), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
    min-height:100vh;
    padding-bottom:96px;
  }
  button, input, textarea, select{ transition: background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease, opacity .16s ease, transform .1s ease; }
  .bg-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, var(--line) 28px);
  }
  header{
    position:relative; z-index:1;
    padding:22px 18px 16px;
    border-bottom:2px solid var(--ink);
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
    box-shadow: 0 6px 18px -12px rgba(20,30,25,.35);
  }
  .eyebrow-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:4px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; color:var(--teal-dark);
    text-transform:uppercase;
  }
  .ver-tag{
    display:inline-block; margin-left:4px; padding:1px 6px;
    border:1px solid var(--teal-dark); border-radius:8px;
    font-size:10px; letter-spacing:.05em;
  }
  .progress-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; font-weight:600; color:var(--teal-dark);
    border:1.3px solid var(--teal-dark); background:var(--teal-pale);
    padding:2px 8px; white-space:nowrap;
    border-radius:3px;
  }
  h1{
    font-family:'Noto Serif KR','Malgun Gothic',serif;
    font-weight:700; font-size:26px; margin:0 0 12px;
    letter-spacing:-.01em;
  }
  .date-nav{
    display:flex; align-items:center; gap:10px;
  }
  .date-nav button{

// 저장소 어댑터 (v8 핵심 수정)
// window.storage(특수 환경 전용 API)가 있으면 그것을 쓰고,
// 없으면(일반 브라우저) localStorage 를 쓴다.
// 이전 버전은 일반 브라우저에서 저장이 전혀 되지 않았다.
// ===================================================================
const storage = (() => {
  if (window.storage && typeof window.storage.get === 'function') {
    return window.storage;
  }
  return {
    async get(key){
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key){
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix){
      const keys = [];
      prefix = prefix || '';
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) keys.push(k);
      }
      return { keys };
    }
  };
})();

function $(id){ return document.getElementById(id); }

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
}
function nowHHMMSS(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function emptyVisits(n){
  const count = n || DEFAULT_VISIT_COUNT;
  return Array.from({length: count}, () => ({addr:'',name:'',changed:'',note:'',time:'',visitor:'',order:''}));
}
const _weekdayCache = {};
function weekdayKR(dateStr){
  if(_weekdayCache[dateStr]) return _weekdayCache[dateStr];
  const days=['일','월','화','수','목','금','토'];
  const d = new Date(dateStr+'T00:00:00');
  const r = days[d.getDay()]+'요일';
  _weekdayCache[dateStr] = r;
  return r;
}
function keyFor(dateStr, period){ return 'visit-log:'+dateStr+':'+(period||currentPeriod); }
function legacyKeyFor(dateStr){ return 'visit-log:'+dateStr; } // v19 이전 형식(오전/오후 구분 없음)

function hasAnyData(visits){
  return visits.some(v => v.addr || v.name || v.changed || v.note || v.time || v.visitor);
}

// 손상된 저장 데이터를 안전하게 보정 (앱이 죽지 않도록)
function normalizeVisits(parsed){
  let raw = null;
  if (Array.isArray(parsed)) raw = parsed;
  else if (parsed && Array.isArray(parsed.visits)) raw = parsed.visits;
  if (!raw || raw.length === 0) return emptyVisits();
  const len = Math.min(MAX_VISIT_COUNT, Math.max(DEFAULT_VISIT_COUNT, raw.length));
  const fixed = emptyVisits(len);
  for (let i = 0; i < Math.min(len, raw.length); i++){
    const src = raw[i];
    if (!src || typeof src !== 'object') continue;
    FIELD_META.forEach(m => {
      if (typeof src[m.key] === 'string') fixed[i][m.key] = src[m.key].slice(0, m.max);
    });
    if (typeof src.time === 'string') fixed[i].time = src.time;
    if (typeof src.order === 'string' || typeof src.order === 'number') {
      fixed[i].order = String(src.order).slice(0, 3);
    }
  }
  return fixed;
}

async function loadSettings(){
  try{
    const res = await storage.get(SETTINGS_KEY);
    const s = res && res.value ? JSON.parse(res.value) : {};
    autoBackupEnabled = s.autoBackup !== false;
  }catch(e){
    autoBackupEnabled = true;
  }
  $('autoBackupToggle').checked = autoBackupEnabled;
}
async function saveSettings(){
  try{
    await storage.set(SETTINGS_KEY, JSON.stringify({ autoBackup: autoBackupEnabled }));
  }catch(e){}
}

let toastTimer = null;
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadDate(dateStr, period){
  currentDate = dateStr;
  if(period){ currentPeriod = period; currentView = period; }
  $('dateInput').value = dateStr;
  $('weekdayLabel').textContent = weekdayKR(dateStr);
  updatePeriodUI();
  try{
    let res = await storage.get(keyFor(dateStr, currentPeriod));
    // 새 형식(오전/오후 구분) 기록이 없고, "오전" 탭이면 v19 이전 레거시
    // 기록(구분 없던 시절)이 있는지 확인해서 그대로 보여준다.
    if((!res || !res.value) && currentPeriod === 'AM'){
      try{ res = await storage.get(legacyKeyFor(dateStr)); }catch(e){}
    }
    const parsed = res && res.value ? JSON.parse(res.value) : null;
    currentVisits = normalizeVisits(parsed);
  }catch(e){
    currentVisits = emptyVisits();
  }
  renderCards();
  const filled = countFilled(currentVisits);
  $('lastSaved').textContent = filled > 0 ? '기록 '+filled+'곳 있음' : '—';
  await loadMemo(dateStr);
  refreshPeriodCounts();
}

function updatePeriodUI(){
  document.querySelectorAll('.period-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === currentView);
  });
  const visitsPanel = $('visitsPanel');
  const memoPanel = $('memoPanel');
  if(visitsPanel && memoPanel){
    if(currentView === 'MEMO'){
      visitsPanel.classList.add('hide');
      memoPanel.classList.remove('hide');
    } else {
      visitsPanel.classList.remove('hide');
      memoPanel.classList.add('hide');
    }
  }
  const title = $('mainTitle');
  if(title){
    title.textContent = currentView === 'MEMO'
      ? '오늘의 메모'
      : (currentView === 'AM' ? '오전' : '오후') + ' 방문 기록';
  }
}

// 오전/오후 탭 버튼에 각 기록 건수를 작게 표시 (참고용, 매번 저장소 조회)
async function refreshPeriodCounts(){
  for(const p of PERIODS){
    const el = $('periodCount'+p);
    if(!el) continue;
    try{
      let res = await storage.get(keyFor(currentDate, p));
      if((!res || !res.value) && p === 'AM'){
        try{ res = await storage.get(legacyKeyFor(currentDate)); }catch(e){}
      }
      const parsed = res && res.value ? JSON.parse(res.value) : null;
      const filled = countFilled(normalizeVisits(parsed));
      el.textContent = filled > 0 ? ' '+filled : '';
    }catch(e){ el.textContent = ''; }
  }
  const memoEl = $('memoCount');
  if(memoEl) memoEl.textContent = currentMemo.trim() ? ' ✓' : '';
}

// ---------------- 메모 (v21, 오전/오후와 별개로 하루 단위 저장) ----------------
async function loadMemo(dateStr){
  try{
    const res = await storage.get(memoKeyFor(dateStr));
    currentMemo = res && res.value ? res.value : '';
  }catch(e){
    currentMemo = '';
  }
  const ta = $('memoText');
  if(ta) ta.value = currentMemo;
  updateMemoCount();
}

function updateMemoCount(){
  const el = $('memoCharCount');
  if(el){
    el.textContent = currentMemo.length + ' / ' + MEMO_MAX;
    el.classList.toggle('warn', currentMemo.length >= MEMO_MAX - 100);
  }
  const memoEl = $('memoCount');
  if(memoEl) memoEl.textContent = currentMemo.trim() ? ' ✓' : '';
}

function scheduleMemoSave(){
  clearTimeout(memoSaveTimer);
  memoSaveTimer = setTimeout(()=>{
    memoSaveTimer = null;
    saveMemoCurrent();
  }, SAVE_DEBOUNCE_MS);
}

async function saveMemoCurrent(){
  try{
    await storage.set(memoKeyFor(currentDate), currentMemo);
    $('lastSaved').textContent = '저장됨 ' + nowHHMMSS().slice(0,5);
  }catch(e){ /* 조용히 무시, 다음 저장 때 재시도 */ }
}

async function flushMemoSave(){
  if(memoSaveTimer){
    clearTimeout(memoSaveTimer);
    memoSaveTimer = null;
  }
  await saveMemoCurrent();
}

$('memoText') && $('memoText').addEventListener('input', (e)=>{
  currentMemo = e.target.value.slice(0, MEMO_MAX);
  updateMemoCount();
  scheduleMemoSave();
});

function countFilled(visits){
  return visits.filter(v => v.addr || v.name || v.changed || v.note || v.time || v.visitor).length;
}

function updateProgress(){
  $('progressChip').textContent = '작성 ' + countFilled(currentVisits) + '/' + currentVisits.length;
}

function addVisitCard(){
  if(currentVisits.length >= MAX_VISIT_COUNT){
    showToast('카드는 최대 ' + MAX_VISIT_COUNT + '개까지 만들 수 있습니다');

}

// ---------------- 방문 순서대로 정렬 ----------------
// 순서 칸을 채운 카드는 작은 숫자부터 앞으로, 비워둔 카드는 뒤로(원래 순서 유지) 보냄
function sortByOrder(){
  const hasAnyOrder = currentVisits.some(v => (v.order || '').trim() !== '');
  if(!hasAnyOrder){
    showToast('먼저 카드마다 순서 번호를 입력해주세요');
    return;
  }
  const withIndex = currentVisits.map((v, i) => ({ v, i }));
  withIndex.sort((a, b) => {
    const oa = a.v.order === '' ? null : parseInt(a.v.order, 10);
    const ob = b.v.order === '' ? null : parseInt(b.v.order, 10);
    if (oa === null && ob === null) return a.i - b.i;
    if (oa === null) return 1;
    if (ob === null) return -1;
    if (oa !== ob) return oa - ob;
    return a.i - b.i;
  });
  currentVisits = withIndex.map(x => x.v);
  renderCards();
  scheduleSave();
  showToast('순서대로 정렬했어요');
}
$('sortByOrderBtn').addEventListener('click', sortByOrder);

function renderCards(){
  const wrap = $('cardsWrap');
  wrap.innerHTML = '';
  currentVisits.forEach((visit, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div class="stub-num">${idx+1}</div>
        <div class="stub-label">방문 ${idx+1} / ${currentVisits.length}</div>
        <div class="order-area">
          <label for="order-${idx}">순서</label>
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="order-input" id="order-${idx}" data-order-input maxlength="3" placeholder="-">
        </div>
        <div class="time-area">
          <span class="time-value ${visit.time ? '' : 'empty'}" data-time-display>${visit.time || '미기록'}</span>
          <button type="button" class="time-btn" data-time-btn>재기록</button>
        </div>
      </div>
      <div class="card-body"></div>
    `;
    const orderInput = card.querySelector('[data-order-input]');
    orderInput.value = visit.order || '';
    orderInput.classList.toggle('filled', !!visit.order);
    orderInput.addEventListener('input', (e)=>{
      const v = e.target.value.replace(/[^0-9]/g,'').slice(0,3);
      e.target.value = v;
      currentVisits[idx].order = v;
      orderInput.classList.toggle('filled', !!v);
      scheduleSave();
    });
    const timeBtn = card.querySelector('[data-time-btn]');
    const timeDisplay = card.querySelector('[data-time-display]');
    const stampTime = ()=>{
      const stamped = nowHHMMSS();
      currentVisits[idx].time = stamped;
      timeDisplay.textContent = stamped;
      timeDisplay.classList.remove('empty');
      return stamped;
    };
    timeBtn.addEventListener('click', ()=>{
      const stamped = stampTime();
      updateProgress();
      scheduleSave();
      showToast('방문 '+(idx+1)+' 시각 기록: '+stamped);
    });
    const body = card.querySelector('.card-body');
    FIELD_META.forEach(meta => {
      const field = document.createElement('div');
      field.className = 'field' + (meta.key==='note' ? ' flag' : '');
      const val = visit[meta.key] || '';
      const fieldId = 'f-'+idx+'-'+meta.key;
      // autocomplete="new-password" + lpignore: 모바일 브라우저가 한 카드의
      // 담당자명을 다른 카드에도 자동으로 채워 저장하는 것(autofill 오염) 방지
      const common = 'data-field="'+meta.key+'" id="'+fieldId+'" name="'+fieldId
        +'" maxlength="'+meta.max+'" autocomplete="new-password"'
        +' data-lpignore="true" data-1p-ignore="true" data-form-type="other"'
        +' autocorrect="off" spellcheck="false"'
        +' placeholder="'+meta.label+' 입력"';
      if(meta.type === 'textarea'){
        field.innerHTML = '<label>'+meta.label+' <span class="cnt" data-cnt>'+val.length+'/'+meta.max+'</span></label>'
          + '<textarea '+common+'></textarea>';
      } else if(meta.key === 'addr'){
        field.innerHTML = '<label>'+meta.label+' <span class="cnt" data-cnt>'+val.length+'/'+meta.max+'</span></label>'
          + '<div class="addr-row">'
          +   '<input '+common+' type="text" enterkeyhint="next">'
          +   '<button type="button" class="tmap-btn" data-nav-btn title="선택한 내비 앱으로 길찾기">'+navAppLabel()+' 길찾기</button>'
          + '</div>';
      } else {
        field.innerHTML = '<label>'+meta.label+' <span class="cnt" data-cnt>'+val.length+'/'+meta.max+'</span></label>'
          + '<input '+common+' type="text" enterkeyhint="next">';
      }
      if(meta.key === 'addr'){
        const navBtn = field.querySelector('[data-nav-btn]');
        navBtn.addEventListener('click', ()=>{
          openInNavApp(currentVisits[idx].addr, navBtn);
        });
      }
      const inputEl = field.querySelector('[data-field]');
      inputEl.value = val;
      inputEl.addEventListener('input', (e)=>{
        currentVisits[idx][meta.key] = e.target.value;
        const cnt = field.querySelector('[data-cnt]');
        cnt.textContent = e.target.value.length+'/'+meta.max;
        cnt.classList.toggle('warn', e.target.value.length >= meta.max);
        // 이 방문칸에 뭔가 입력할 때마다 최신 수정 시각으로 갱신
        // (예: 10시에 상호를 적었다가, 나중에 방문지에서 변경상호를
        //  고쳐 입력하면 그 수정한 시각으로 다시 기록됨)
        if(e.target.value.trim()){
          stampTime();
        }
        updateProgress();
        scheduleSave();
      });
      body.appendChild(field);
    });
    wrap.appendChild(card);

    // 이 카드 → 다음 카드 구간 경로 버튼 (마지막 카드 다음에는 넣지 않음)
    if (idx < currentVisits.length - 1) {
      const connector = document.createElement('div');
      connector.className = 'segment-connector';
      connector.innerHTML = `<button type="button" class="segment-btn" data-seg-btn>
        <span class="arrow">↓</span> ${idx+1}번 → ${idx+2}번 구간 경로 검색
      </button>`;
      const segBtn = connector.querySelector('[data-seg-btn]');
      segBtn.addEventListener('click', () => openSegmentRoute(idx, idx+1, segBtn));
      wrap.appendChild(connector);
    }
  });
  updateProgress();
  updateAddCardBtn();
}

async function geocodeAddressKR(addr){
  const q = encodeURIComponent(addr + ', 대한민국');
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=' + q;
  const res = await fetch(url);
  if(!res.ok) return null;
  const list = await res.json();
  if(!Array.isArray(list) || !list.length) return null;
  const { lat, lon } = list[0];
  if(!lat || !lon) return null;
  return { lat, lon };
}

// URL로 이동시키되, 앱이 실제로 열려 화면이 전환됐는지(visibilitychange)를 감지해서
// 안 열렸을 때만(=미설치 등) 스토어로 안내.
function launchAppUrl(appUrl, storeUrl){
  let switched = false;
  const onHide = () => { switched = true; };
  document.addEventListener('visibilitychange', onHide, { once:true });
  window.location.href = appUrl;
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide);
    if(!switched && storeUrl){
      window.location.href = storeUrl;
    }
  }, 1500);
}

async function openInNavApp(address, btnEl){
  const raw = (address || '').trim();
  if(!raw){
    showToast('방문주소를 먼저 입력해주세요');
    return;
  }
  // '(' 앞부분만 내비 앱으로 전달 (예: "의림대로 41(영천동)" → "의림대로 41")
  const addr = raw.split('(')[0].trim() || raw;
  const app = getNavApp();
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const storeUrl = app === 'naver' ? (isIOS ? NAVER_STORE_IOS : NAVER_STORE_AOS) : (isIOS ? TMAP_STORE_IOS : TMAP_STORE_AOS);
  const enc = encodeURIComponent(addr);
  if(btnEl) btnEl.classList.add('loading');
  try{
    const geo = await geocodeAddressKR(addr);
    if(geo){
      let navUrl;
      if(app === 'naver'){
        navUrl = 'nmap://navigation?dlat='+geo.lat+'&dlng='+geo.lon+'&dname='+enc+'&appname='+NAVER_APPNAME;
      }else{
        navUrl = 'tmap://route?rGoName='+enc+'&rGoX='+geo.lon+'&rGoY='+geo.lat
          + '&goalname='+enc+'&goalx='+geo.lon+'&goaly='+geo.lat;
      }
      launchAppUrl(navUrl, storeUrl);
    } else {
      showToast('정확한 좌표를 못 찾아 '+navAppLabel()+' 검색으로 엽니다');
      const searchUrl = app === 'naver'
        ? 'nmap://search?query='+enc+'&appname='+NAVER_APPNAME
        : 'tmap://search?name='+enc;
      launchAppUrl(searchUrl, storeUrl);
    }
  }catch(err){
    showToast('주소 조회 실패 — '+navAppLabel()+' 검색으로 엽니다');
    const searchUrl = app === 'naver'
      ? 'nmap://search?query='+enc+'&appname='+NAVER_APPNAME
      : 'tmap://search?name='+enc;
    launchAppUrl(searchUrl, storeUrl);
  }finally{
    if(btnEl) btnEl.classList.remove('loading');
  }
}

// ---------------- 구간 경로 (N번 방문지 → N+1번 방문지) ----------------
// 네이버맵: 출발지·도착지 좌표를 모두 지정한 정식 경로(nmap://route/car)를 엽니다.
// 티맵: 앱의 URL scheme이 출발지 좌표 지정을 공식 지원하지 않아, 도착지만 지정됩니다
//       (앱을 열면 현재 위치가 출발지로 자동 사용돼요 — 실제로 그 자리에서 다음 방문지로
//        출발할 때 누르면 결과적으로 똑같이 동작합니다).
async function openSegmentRoute(fromIdx, toIdx, btnEl){
  const fromRaw = (currentVisits[fromIdx].addr || '').trim();
  const toRaw = (currentVisits[toIdx].addr || '').trim();
  if(!fromRaw || !toRaw){
    showToast((fromIdx+1)+'번과 '+(toIdx+1)+'번 방문지 주소를 모두 입력해주세요');
    return;
  }
  const fromAddr = fromRaw.split('(')[0].trim() || fromRaw;
  const toAddr = toRaw.split('(')[0].trim() || toRaw;
  const app = getNavApp();
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const storeUrl = app === 'naver' ? (isIOS ? NAVER_STORE_IOS : NAVER_STORE_AOS) : (isIOS ? TMAP_STORE_IOS : TMAP_STORE_AOS);

  if(btnEl) btnEl.classList.add('loading');
  try{
    const [fromGeo, toGeo] = await Promise.all([geocodeAddressKR(fromAddr), geocodeAddressKR(toAddr)]);

    if(!toGeo){
      showToast((toIdx+1)+'번 방문지 좌표를 못 찾아 '+navAppLabel()+' 검색으로 엽니다');
      const enc = encodeURIComponent(toAddr);
      const searchUrl = app === 'naver' ? 'nmap://search?query='+enc+'&appname='+NAVER_APPNAME : 'tmap://search?name='+enc;
      launchAppUrl(searchUrl, storeUrl);
      return;
    }

    if(app === 'naver'){
      const dEnc = encodeURIComponent(toAddr);
      let navUrl;
      if(fromGeo){
        const sEnc = encodeURIComponent(fromAddr);
        navUrl = 'nmap://route/car?slat='+fromGeo.lat+'&slng='+fromGeo.lon+'&sname='+sEnc
          + '&dlat='+toGeo.lat+'&dlng='+toGeo.lon+'&dname='+dEnc+'&appname='+NAVER_APPNAME;
      }else{
        navUrl = 'nmap://route/car?dlat='+toGeo.lat+'&dlng='+toGeo.lon+'&dname='+dEnc+'&appname='+NAVER_APPNAME;
        showToast((fromIdx+1)+'번 출발지 좌표를 못 찾아 도착지만 안내합니다');
      }
      launchAppUrl(navUrl, storeUrl);
    }else{
      const dEnc = encodeURIComponent(toAddr);
      const navUrl = 'tmap://route?rGoName='+dEnc+'&rGoX='+toGeo.lon+'&rGoY='+toGeo.lat
        + '&goalname='+dEnc+'&goalx='+toGeo.lon+'&goaly='+toGeo.lat;
      showToast('티맵은 도착지('+(toIdx+1)+'번)까지만 안내돼요 · 현재 위치가 출발지로 쓰여요');
      launchAppUrl(navUrl, storeUrl);
    }
  }catch(err){
    showToast('주소 조회 중 오류가 발생했어요');
  }finally{
    if(btnEl) btnEl.classList.remove('loading');
  }
}

// ---------------- 자동 저장 (0.6초 디바운스) ----------------
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    saveCurrent();
  }, SAVE_DEBOUNCE_MS);
}

async function saveCurrent(){
  try{
    await storage.set(keyFor(currentDate, currentPeriod), JSON.stringify(currentVisits));
    $('lastSaved').textContent = '저장됨 ' + nowHHMMSS().slice(0,5);
    refreshPeriodCounts();
  }catch(e){
    $('lastSaved').textContent = '저장 실패';
  }
}

async function flushSave(){
  if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
  }
  await saveCurrent();
  await flushMemoSave();
}

// ---------------- 5분 자동 임시저장 (기기 내부, 조용히) ----------------
function startBackupInterval(){
  stopBackupInterval();
  if(!autoBackupEnabled) return;
  backupIntervalId = setInterval(()=>runAutoBackup(), BACKUP_INTERVAL_MS);
}
function stopBackupInterval(){
  if(backupIntervalId){ clearInterval(backupIntervalId); backupIntervalId = null; }
}

async function runAutoBackup(){
  if(!autoBackupEnabled) return;
  if(!hasAnyData(currentVisits)) return;
  const now = Date.now();
  if(now - lastBackupAt < BACKUP_SAFETY_GAP_MS) return;
  lastBackupAt = now;
  try{
    const payload = {
      savedAt: new Date().toISOString(),
      date: currentDate,
      period: currentPeriod,
      visits: currentVisits,
    };
    await storage.set(BACKUP_KEY, JSON.stringify(payload));
    const lb = $('lastBackup');
    if(lb) lb.textContent = '임시저장 ' + nowHHMMSS().slice(0,5);
  }catch(e){ /* 자동저장(storage)은 계속 유지되므로 조용히 무시 */ }
}

$('autoBackupToggle').addEventListener('change', (e)=>{
  autoBackupEnabled = e.target.checked;
  saveSettings();
  if(autoBackupEnabled){ startBackupInterval(); showToast('5분 자동 임시저장 켜짐'); }
  else { stopBackupInterval(); showToast('5분 자동 임시저장 꺼짐'); }
});

// ---------------- 리포트 텍스트 ----------------
function buildReportText(dateStr, visits, period, memo){
  const lines = [];
  const periodTag = period ? ' ['+PERIOD_LABEL[period]+']' : '';
  lines.push('방문일지 '+dateStr+' ('+weekdayKR(dateStr)+')'+periodTag);
  lines.push('='.repeat(28));
  let count = 0;
  visits.forEach((v, i)=>{
    if(!(v.addr||v.name||v.changed||v.note||v.time||v.visitor)) return;
    count++;
    lines.push('');
    lines.push('[방문 '+(i+1)+']');
    lines.push('방문시각: '+(v.time || '-'));
    lines.push('주소: '+(v.addr||'-'));
    lines.push('상호: '+(v.name||'-'));
    if(v.changed) lines.push('변경상호: '+v.changed);
    lines.push('특이사항: '+(v.note||'-'));
    lines.push('방문담당자명: '+(v.visitor||'-'));
  });
  if(count===0){ lines.push(''); lines.push('(입력된 방문 기록 없음)'); }
  if(memo && memo.trim()){
    lines.push('');
    lines.push('-'.repeat(28));
    lines.push('[메모]');
    lines.push(memo.trim());
  }
  return lines.join('\n');
}

// ---------------- HTML 리포트 (보기용 웹 페이지 + 데이터 내장) ----------------

  const row = (k, val)=>'<div class="r"><div class="k">'+k+'</div><div class="v">'+esc(val||'-')+'</div></div>';
  let count = 0;
  const cards = [];
  visits.forEach((v, i)=>{
    if(!(v.addr||v.name||v.changed||v.note||v.time||v.visitor)) return;
    count++;
    cards.push(
      '<section class="card"><div class="ch">방문 '+(i+1)+'</div><div class="cb">'
      + row('방문담당자명', v.visitor)
      + row('방문시각', v.time)
      + row('주소', v.addr)
      + row('상호', v.name)
      + (v.changed ? row('변경상호', v.changed) : '')
      + row('특이사항', v.note)

    ? '<p class="empty">입력된 방문 기록이 없습니다</p>'

  const dataJson = JSON.stringify({ date: dateStr, period: period||null, visits: visits, memo: memo||'' }).replace(/</g, '\\u003c');
  const periodTag = period ? ' [' + PERIOD_LABEL[period] + ']' : '';
  return '<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="UTF-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
    + '<title>방문일지 ' + esc(dateStr) + esc(periodTag) + '</title>\n'
    + '<style>\n'
    + 'body{margin:0;background:#f5f1e8;color:#22291f;font-family:\'Noto Sans KR\',\'Malgun Gothic\',sans-serif;}\n'
    + 'main{max-width:520px;margin:0 auto;padding:20px 16px 40px;}\n'
    + 'header{margin-bottom:16px;}\n'
    + 'h1{font-family:\'Noto Serif KR\',serif;font-size:24px;margin:0 0 4px;color:#123f38;}\n'
    + '.meta{font-size:13px;color:#0f6a5f;font-weight:600;}\n'
    + '.card{background:#fff;border:1.5px solid #22291f;margin-bottom:12px;}\n'
    + '.ch{background:#0f6a5f;color:#fff;font-weight:700;font-size:14px;padding:8px 12px;}\n'
    + '.cb{padding:6px 12px 10px;}\n'
    + '.r{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed #d8d2c2;font-size:14px;}\n'
    + '.r:last-child{border-bottom:none;}\n'
    + '.k{flex:0 0 92px;color:#5b6353;font-weight:600;}\n'
    + '.v{flex:1;word-break:break-all;white-space:pre-wrap;}\n'
    + '.empty{color:#5b6353;text-align:center;padding:30px 0;}\n'
    + '.memo-card{background:#fffdf4;border:1.5px solid #a63d40;margin-bottom:12px;}\n'
    + '.memo-card .ch{background:#a63d40;}\n'
    + '.memo-body{white-space:pre-wrap;word-break:break-all;font-size:14px;line-height:1.6;padding:12px;}\n'
    + 'footer{margin-top:18px;font-size:11.5px;color:#8a8f80;text-align:center;line-height:1.6;}\n'
    + '@media print{body{background:#fff;}.card{border:1px solid #999;break-inside:avoid;}}\n'
    + '</style>\n</head>\n<body>\n<main>\n'
    + '<header><h1>방문일지</h1><div class="meta">' + esc(dateStr) + ' (' + weekdayKR(dateStr) + ')' + esc(periodTag) + ' · 총 ' + count + '건</div></header>\n'
    + body + '\n'
    + memoSection
    + '<footer>방문일지 앱에서 저장한 파일입니다.<br>앱의 [불러오기]에서 이 파일을 선택하면 기록이 그대로 복원됩니다.</footer>\n'
    + '</main>\n'

    + '</body>\n</html>';

// HTML 리포트 파일에서 내장 데이터(JSON) 추출
function extractReportHtmlJson(text){
  const m = text.match(/<script type="application\/json" id="visit-log-data">([\s\S]*?)<\/script>/);
  if(!m) return null;
  try{
    const d = JSON.parse(m[1]);
    return (d && d.visits) ? d : null;
  }catch(e){ return null; }
}

function parseReportText(text){
  const dateMatch = text.match(/방문일지\s+(\d{4}-\d{2}-\d{2})/);
  const parsedDate = dateMatch ? dateMatch[1] : null;
  const periodMatch = text.match(/\[(오전|오후)\]/);
  const parsedPeriod = periodMatch ? (periodMatch[1] === '오전' ? 'AM' : 'PM') : null;
  const blocks = text.split(/\[방문\s*(\d+)\]/).slice(1); // [num, body, num, body, ...]
  let maxNum = DEFAULT_VISIT_COUNT;
  for(let i=0; i<blocks.length-1; i+=2){
    const n = parseInt(blocks[i], 10);
    if(n > maxNum) maxNum = n;
  }
  maxNum = Math.min(MAX_VISIT_COUNT, maxNum);
  const visits = emptyVisits(maxNum);
  for(let i=0; i<blocks.length-1; i+=2){
    const num = parseInt(blocks[i], 10);
    const body = blocks[i+1] || '';
    if(!(num>=1 && num<=maxNum)) continue;
    const get = (label) => {
      const m = body.match(new RegExp(label + ':\\s*(.*)'));
      if(!m) return '';
      const v = m[1].trim();
      return v === '-' ? '' : v;
    };
    visits[num-1] = {
      time: get('방문시각'),
      addr: get('주소').slice(0, LIMITS.addr),
      name: get('상호').slice(0, LIMITS.name),
      changed: get('변경상호').slice(0, LIMITS.changed),
      note: get('특이사항').slice(0, LIMITS.note),
      visitor: get('방문담당자명').slice(0, LIMITS.visitor),
    };
  }
  const memoBlockMatch = text.match(/\[메모\]\n([\s\S]*)$/);
  const parsedMemo = memoBlockMatch ? memoBlockMatch[1].trim().slice(0, MEMO_MAX) : '';
  return { date: parsedDate, period: parsedPeriod, visits, memo: parsedMemo, hasData: hasAnyData(visits) };
}

// ---------------- 저장 (다운로드 폴더에 바로 저장) ----------------
async function doShare(){
  await flushSave();
  const html = buildReportHtml(currentDate, currentVisits, currentPeriod, currentMemo);
  // 파일명에 저장 시각(시분) 포함 → 누를 때마다 새 파일, 덮어쓰기 없음
  const filename = '방문일지_'+currentDate+'_'+PERIOD_LABEL[currentPeriod]+'_'+nowHHMM()+'.html';
  // 공유 시트(1개 항목 선택 → 파일관리자에서 수동 저장)를 거치지 않고
  // 바로 다운로드 폴더에 저장되도록 다운로드 방식만 사용.
  downloadFile(filename, html, 'text/html');
  showToast(filename+' 다운로드 폴더에 저장됨');
}

function downloadFile(filename, text, mime){
  const blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  // 즉시 해제하면 일부 브라우저에서 다운로드가 취소될 수 있어 지연 해제
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// ---------------- 불러오기 (.txt / .json 모두 지원) ----------------
async function doImport(file){
  let text;
  try{
    text = await file.text();
  }catch(e){
    showToast('파일을 읽지 못했습니다');
    return;
  }

  let date = null, period = null, memo = null, visits = emptyVisits(), hasData = false;
  try{
    const trimmed = text.trim();
    const isJsonName = /\.json$/i.test(file.name || '');
    const isHtmlName = /\.html?$/i.test(file.name || '');
    if(isHtmlName || trimmed.indexOf('id="visit-log-data"') !== -1){
      // v12 HTML 리포트 파일: 내장된 JSON 데이터로 복원
      const d = extractReportHtmlJson(trimmed);
      if(!d){ showToast('HTML 파일에서 기록을 찾지 못했습니다'); return; }
      visits = normalizeVisits(d.visits);
      hasData = hasAnyData(visits);
      date = (d.date && DATE_KEY_RE.test(d.date)) ? d.date : null;
      period = (d.period === 'AM' || d.period === 'PM') ? d.period : null;
      memo = (typeof d.memo === 'string') ? d.memo.slice(0, MEMO_MAX) : null;
    } else if(isJsonName || trimmed.charAt(0) === '{' || trimmed.charAt(0) === '['){
      // JSON 저장 파일 (앱/웹의 내부 저장 형식)
      const parsed = JSON.parse(trimmed);
      visits = normalizeVisits(parsed);
      hasData = hasAnyData(visits);
      const dm = (file.name || '').match(/(\d{4}-\d{2}-\d{2})/);
      date = dm ? dm[1] : null;
    } else {
      // 텍스트 리포트 파일
      const r = parseReportText(text);
      date = r.date; period = r.period; visits = r.visits; memo = r.memo; hasData = r.hasData;
    }
  }catch(e){
    showToast('파일 내용을 해석하지 못했습니다');
    return;
  }

  if(!hasData){
    showToast('파일에서 기록을 찾지 못했습니다');
    return;
  }

  await flushSave();
  if(date && DATE_KEY_RE.test(date)) currentDate = date;
  if(period) currentPeriod = period;
  currentView = currentPeriod;
  currentVisits = visits;
  $('dateInput').value = currentDate;
  $('weekdayLabel').textContent = weekdayKR(currentDate);
  updatePeriodUI();
  renderCards();
  await saveCurrent();
  if(memo){
    currentMemo = memo;
    const ta = $('memoText');
    if(ta) ta.value = currentMemo;
    updateMemoCount();
    await saveMemoCurrent();
  }
  switchTab('day');
  showToast(currentDate+' ('+PERIOD_LABEL[currentPeriod]+') 기록을 불러왔습니다');
}

    showToast('클립보드에 복사했습니다');
  }catch(e){
    // 구형 브라우저 폴백
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('클립보드에 복사했습니다');
    }catch(e2){
      showToast('복사 실패 — 직접 선택해 복사해주세요');
    }
  }
}

// ---------------- 공유코드 (Firebase Firestore + PIN 암호화) ----------------
// 원리: 오늘 기록(JSON)을 잠금번호(PIN)로 AES-GCM 암호화(브라우저 내장 Web Crypto
// API, 외부 라이브러리 없음)한 뒤, 그 암호문을 Firestore에 저장하고 6자리 코드를
// 발급함. 코드만 알아도 잠금번호를 모르면 내용을 볼 수 없어 이중으로 보호됨.
// 코드는 24시간 후 만료(클라이언트에서 확인).
function toBase64Url(bytes){
  let binary = '';
  bytes.forEach((b) => { binary += String.fromCharCode(b); });
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromBase64Url(str){
  let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  while(b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function deriveShareKey(pin, saltBytes){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: saltBytes, iterations: 100000, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}
async function encodeShareData(dateStr, visits, pin, period, memo){
  const payload = JSON.stringify({ d: dateStr, p: period||null, v: visits, m: memo||'' });
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveShareKey(pin, salt);
  const cipherBuf = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(payload));
  const combined = new Uint8Array(salt.length + iv.length + cipherBuf.byteLength);
  combined.set(salt, 0);
  combined.set(iv, salt.length);
  combined.set(new Uint8Array(cipherBuf), salt.length + iv.length);
  return toBase64Url(combined);
}
async function decodeShareData(encoded, pin){
  try{
    const combined = fromBase64Url(encoded);
    const salt = combined.slice(0, 16);
    const iv = combined.slice(16, 28);
    const ciphertext = combined.slice(28);
    const key = await deriveShareKey(pin, salt);
    const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ciphertext);
    const json = new TextDecoder().decode(plainBuf);
    const obj = JSON.parse(json);
    return { date: obj.d, period: (obj.p==='AM'||obj.p==='PM') ? obj.p : null, visits: normalizeVisits(obj.v), memo: (typeof obj.m === 'string') ? obj.m : '' };
  }catch(e){ return null; } // 잠금번호가 틀렸거나 손상된 데이터
}

function generateSixDigitCode(){
  return String(Math.floor(100000 + Math.random() * 900000));
}

async function doShareCode(){
  await flushSave();
  if(!hasAnyData(currentVisits) && !currentMemo.trim()){
    showToast('공유할 기록이 없습니다');
    return;
  }
  if(!(window.crypto && window.crypto.subtle)){
    showToast('이 브라우저에서는 암호화 공유를 지원하지 않습니다 (HTTPS 필요)');
    return;
  }
  if(!fbDb){
    showToast('공유 서버에 연결할 수 없습니다 (인터넷 연결을 확인해주세요)');
    return;
  }
  const pin = await showPromptModal(
    '공유 코드 잠금번호를 정해주세요 (4자리 이상 숫자/문자).\n'
    + '받는 분께는 이 번호를 별도(전화, 문자 등)로 알려주셔야\n'
    + '엉뚱한 사람이 코드를 알아도 내용이 보이지 않습니다.',
    '잠금번호 입력'
  );
  if(pin === null) return; // 취소
  const pinTrim = pin.trim();
  if(pinTrim.length < 4){
    showToast('잠금번호는 4자리 이상 입력해야 합니다');
    return;
  }

  let encoded;
  try{
    encoded = await encodeShareData(currentDate, currentVisits, pinTrim, currentPeriod, currentMemo);
  }catch(e){
    showToast('암호화 중 오류가 발생했습니다');
    return;
  }

  showToast('공유 코드를 생성하는 중...');
  try{
    let code = null;
    for(let attempt=0; attempt<5 && !code; attempt++){
      const candidate = generateSixDigitCode();
      const ref = fbDb.collection('shared_routes').doc(candidate);
      const snap = await ref.get();
      if(snap.exists) continue; // 드물게 코드 중복이면 다시 시도
      await ref.set({
        payload: encoded,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        expiresAt: Date.now() + 24 * 3600 * 1000
      });
      code = candidate;
    }
    if(!code){
      showToast('코드 생성에 실패했습니다. 다시 시도해주세요');
      return;
    }
    await showCodeResultModal(code);
  }catch(e){
    console.error(e);
    const detail = (e && (e.code || e.message)) ? (' ('+(e.code || e.message)+')') : '';
    showToast('서버 연결에 실패했습니다' + detail);
  }
}

async function doImportCode(){
  if(!fbDb){
    showToast('공유 서버에 연결할 수 없습니다 (인터넷 연결을 확인해주세요)');
    return;
  }
  const code = await showPromptModal('전달받은 6자리 공유 코드를 입력하세요.', '예: 123456');
  if(code === null) return;
  const codeTrim = code.trim();
  if(!/^\d{6}$/.test(codeTrim)){
    showToast('공유 코드는 숫자 6자리입니다');
    return;
  }

  showToast('코드를 확인하는 중...');
  let snap;
  try{
    snap = await fbDb.collection('shared_routes').doc(codeTrim).get();
  }catch(e){
    console.error(e);
    const detail = (e && (e.code || e.message)) ? (' ('+(e.code || e.message)+')') : '';
    showToast('서버 연결에 실패했습니다' + detail);
    return;
  }
  if(!snap.exists){
    showToast('존재하지 않는 코드입니다');
    return;
  }
  const data = snap.data();
  if(data.expiresAt && Date.now() > data.expiresAt){
    showToast('만료된 코드입니다');
    return;
  }

  const pin = await showPromptModal('보낸 분에게 전달받은 잠금번호를 입력하세요.', '잠금번호 입력');
  if(pin === null){
    showToast('잠금번호를 입력하지 않아 불러오기를 취소했습니다');
    return;
  }

  const decoded = await decodeShareData(data.payload, pin.trim());
  if(!decoded || (!hasAnyData(decoded.visits) && !(decoded.memo && decoded.memo.trim()))){
    showToast('잠금번호가 틀렸거나 손상된 데이터입니다');
    return;
  }

  // 잠금번호가 맞아도, 실수로 현재 화면 내용을 덮어쓰지 않도록 한 번 더 확인
  const cnt = countFilled(decoded.visits);
  const periodLabel = decoded.period ? ' ('+PERIOD_LABEL[decoded.period]+')' : '';
  const memoNote = decoded.memo && decoded.memo.trim() ? ' + 메모' : '';
  const ok = await showConfirmModal(
    (decoded.date || '(날짜 미상)') + periodLabel + ' 기록 ' + cnt + '건' + memoNote + '을 불러올까요?\n'
    + '현재 화면에 보이는 내용은 이 기록으로 대체됩니다.'
  );
  if(!ok){
    showToast('불러오기를 취소했습니다');
    return;
  }

  await flushSave();
  if(decoded.date && DATE_KEY_RE.test(decoded.date)) currentDate = decoded.date;
  if(decoded.period) currentPeriod = decoded.period;
  currentView = currentPeriod;
  currentVisits = decoded.visits;
  currentMemo = decoded.memo || '';
  $('dateInput').value = currentDate;
  $('weekdayLabel').textContent = weekdayKR(currentDate);
  updatePeriodUI();
  renderCards();
  const ta = $('memoText');
  if(ta) ta.value = currentMemo;
  updateMemoCount();
  await saveCurrent();
  await saveMemoCurrent();
  switchTab('day');
  showToast(currentDate+' 공유 코드에서 기록을 불러왔습니다');
}

// ---------------- 빠른 검색 (v9) ----------------
// 카드 1장을 하나의 그룹으로 보고, 주소/상호/변경상호/특이사항/담당자/시각 중
// 하나라도 검색 단어를 포함하면 해당 카드 전체를 결과에 나열한다.
// 모든 날짜의 저장 기록을 대상으로 한다.
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(text, query){
  const safe = escapeHtml(text);
  if(!query) return safe;
  const re = new RegExp(escapeRegExp(escapeHtml(query)), 'gi');
  return safe.replace(re, (m)=>'<mark>'+m+'</mark>');
}

async function doSearch(){
  const q = $('searchInput').value.trim();
  if(!q){ showToast('검색어를 입력하세요'); return; }
  await flushSave(); // 입력 직후 저장 대기 중인 내용도 검색에 포함
  const query = q.toLowerCase();
  const scope = $('searchScope').value; // all 또는 특정 필드 키
  const searchFields = scope === 'all'
    ? ['visitor','addr','name','changed','note','time']
    : [scope];
  const results = [];
  try{
    const res = await storage.list('visit-log:');
    const keys = (res && res.keys ? res.keys : [])
      .filter(k => DATE_KEY_FULL_RE.test(k))
      .sort().reverse(); // 최신 날짜부터 (같은 날짜면 오후→오전 순으로 뒤집힘, 아래서 date+period로 다시 정렬)
    for(const k of keys){
      const m = k.match(DATE_KEY_FULL_RE);
      const dateStr = m[1];
      const period = m[2] || 'AM'; // 접미사 없으면 v19 이전 레거시 = 오전 취급
      let visits = emptyVisits();
      try{
        const r = await storage.get(k);
        const parsed = r && r.value ? JSON.parse(r.value) : null;
        visits = normalizeVisits(parsed);
      }catch(e){ continue; } // 깨진 기록은 건너뜀
      visits.forEach((v, idx) => {
        if(!(v.addr||v.name||v.changed||v.note||v.time||v.visitor)) return;
        // 어느 항목이 일치했는지 함께 기록 (결과에 '일치 항목'으로 표시)
        const matched = [];
        searchFields.forEach((k)=>{
          if(String(v[k]||'').toLowerCase().indexOf(query) !== -1){
            matched.push(FIELD_LABEL[k]);
          }
        });
        if(matched.length > 0){
          results.push({ date: dateStr, period: period, idx: idx, visit: v, matched: matched });
        }
      });
    }
    results.sort((a,b) => (a.date+a.period < b.date+b.period ? 1 : -1));
  }catch(e){
    showToast('검색 중 오류가 발생했습니다');
    return;
  }
  renderSearchResults(q, results, $('searchScope').selectedOptions[0].textContent);
}

function renderSearchResults(query, results, scopeLabel){
  $('searchMeta').textContent = '"' + query + '"' + (scopeLabel && scopeLabel !== '전체' ? ' [범위: ' + scopeLabel + ']' : '') + ' 검색 결과: ' + results.length + '건';
  const wrap = $('searchResults');
  wrap.innerHTML = '';
  if(results.length === 0){
    wrap.innerHTML = '<div class="empty">검색 결과가 없습니다</div>';
  }
  results.forEach((r) => {
    const v = r.visit;
    // 결과 카드도 입력 폼과 같은 순서: 담당자명이 맨 위
    const rows = [
      ['방문담당자명', v.visitor || '-'],
      ['방문시각', v.time || '-'],
      ['주소', v.addr || '-'],
      ['상호', v.name || '-'],
    ];
    if(v.changed) rows.push(['변경상호', v.changed]);
    rows.push(['특이사항', v.note || '-']);

    const card = document.createElement('div');
    card.className = 'card result-card';
    card.innerHTML =
      '<div class="card-head">'
      + '<div class="stub-num">' + (r.idx+1) + '</div>'
      + '<div class="result-head-main">'
      +   '<div class="result-date">' + r.date + ' (' + weekdayKR(r.date) + ') · ' + PERIOD_LABEL[r.period] + ' · 방문 ' + (r.idx+1) + ' / 4</div>'
      +   '<div class="result-visitor">' + highlight(v.visitor || '(담당자 없음)', query) + '</div>'
      + '</div>'
      + '</div>'
      + '<div class="result-body">'
      + '<div class="result-row"><div class="rk">일치 항목</div><div class="rv">'
      +   r.matched.map((m)=>'<span class="result-match">' + m + '</span>').join(' ')
      + '</div></div>'
      + rows.map((row) =>
          '<div class="result-row"><div class="rk">' + row[0] + '</div>'
          + '<div class="rv">' + highlight(row[1], query) + '</div></div>'
        ).join('')
      + '</div>';
    // 결과 카드를 누르면 해당 날짜의 기록으로 이동
    card.addEventListener('click', async ()=>{
      await flushSave();
      loadDate(r.date, r.period);
      clearSearch();
      showToast(r.date + ' (' + PERIOD_LABEL[r.period] + ') 기록으로 이동했습니다');
    });
    wrap.appendChild(card);
  });
  showSearchView(true);
}

async function renderHistory(){
  const listEl = $('historyList');
  listEl.innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    const res = await storage.list('visit-log:');
    const keys = (res && res.keys ? res.keys : [])
      .filter(k => DATE_KEY_FULL_RE.test(k)) // 깨진 키(설정/백업 등) 제외
      .sort().reverse();
    if(keys.length === 0){
      listEl.innerHTML = '<div class="empty">저장된 기록이 없습니다</div>';
      return;
    }
    listEl.innerHTML = '';
    let shown = 0;
    const rows = [];
    for(const k of keys){
      const m = k.match(DATE_KEY_FULL_RE);
      const dateStr = m[1];
      const period = m[2] || 'AM'; // 접미사 없으면 v19 이전 레거시 = 오전 취급
      let visits = emptyVisits();
      try{
        const r = await storage.get(k);
        const parsed = r && r.value ? JSON.parse(r.value) : null;
        visits = normalizeVisits(parsed);
      }catch(e){ continue; }
      const filled = countFilled(visits);
      if(filled === 0) continue;
      rows.push({ dateStr, period, filled });
    }
    rows.sort((a,b) => (a.dateStr+a.period < b.dateStr+b.period ? 1 : -1));
    rows.forEach(({dateStr, period, filled}) => {
      shown++;
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.innerHTML = '<div><div class="hist-date">'+dateStr+' · '+PERIOD_LABEL[period]+'</div>'
        + '<div class="hist-meta">'+weekdayKR(dateStr)+'</div></div>'
        + '<div class="hist-count">'+filled+'건</div>';
      item.addEventListener('click', async ()=>{
        await flushSave();
        loadDate(dateStr, period);
        switchTab('day');
      });
      listEl.appendChild(item);
    });
    if(shown === 0){
      listEl.innerHTML = '<div class="empty">저장된 기록이 없습니다</div>';
    }
  }catch(e){
    listEl.innerHTML = '<div class="empty">기록을 불러오지 못했습니다</div>';
  }
}

function switchTab(tab){
  const dayView = $('dayView');
  const histView = $('historyView');
  const tabDay = $('tabDay');
  const tabHist = $('tabHistory');
  const actionbar = $('actionbar');
  // 탭 전환 시 검색 결과는 닫는다
  $('searchView').classList.remove('show');
  $('searchClear').style.display = 'none';
  if(tab==='day'){
    dayView.classList.remove('hide'); histView.classList.remove('show');
    tabDay.classList.add('active'); tabHist.classList.remove('active');
    actionbar.style.display = 'flex';
  } else {
    dayView.classList.add('hide'); histView.classList.add('show');
    tabHist.classList.add('active'); tabDay.classList.remove('active');
    actionbar.style.display = 'none';
    renderHistory();
  }
}

$('prevDay').addEventListener('click', ()=>shiftDate(-1));
$('nextDay').addEventListener('click', ()=>shiftDate(1));
$('dateInput').addEventListener('change', async (e)=>{
  if(e.target.value && DATE_KEY_RE.test(e.target.value)){
    await flushSave();
    loadDate(e.target.value, currentPeriod);
  }
});
document.querySelectorAll('.period-btn').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    const v = btn.dataset.view;
    if(v === currentView) return;
    await flushSave();
    if(v === 'AM' || v === 'PM'){
      loadDate(currentDate, v);
    } else {
      currentView = 'MEMO';
      updatePeriodUI();
    }
  });
});
$('tabDay').addEventListener('click', async ()=>{ await flushSave(); switchTab('day'); });
$('tabHistory').addEventListener('click', async ()=>{ await flushSave(); switchTab('history'); });
$('shareBtn').addEventListener('click', doShare);
$('copyBtn').addEventListener('click', doCopy);

loadSettings().then(()=>{
  loadDate(currentDate);
  startBackupInterval();
});
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
