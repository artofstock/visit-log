// HTML 리포트 파일에서 내장 데이터(JSON) 추출
function extractReportHtmlJson(text){
  const m = text.match(/<script type="application\/json" id="visit-log-data">([\s\S]*?)<\/script>/);
  if(!m) return null;
  try{
    const d = JSON.parse(m[1]);
    return (d && d.visits) ? d : null;
  }catch(e){ return null; }
}

function parseReportText(text){
  const dateMatch = text.match(/방문일지\s+(\d{4}-\d{2}-\d{2})/);
  const parsedDate = dateMatch ? dateMatch[1] : null;
  const periodMatch = text.match(/\[(오전|오후)\]/);
  const parsedPeriod = periodMatch ? (periodMatch[1] === '오전' ? 'AM' : 'PM') : null;
  const blocks = text.split(/\[방문\s*(\d+)\]/).slice(1); // [num, body, num, body, ...]
  // v24: 텍스트 리포트에는 카드 개수가 안 적히므로 등장한 방문 번호의 최대값을 쓴다.
  // v23까지는 최소 4장으로 보정해서, 카드를 2장으로 줄여둔 기록을 .txt로 복원하면
  // 빈 카드 2장이 도로 붙었음. 방문 블록이 하나도 없을 때만 기본값(4장)을 쓴다.
  let maxNum = 0;
  for(let i=0; i<blocks.length-1; i+=2){
    const n = parseInt(blocks[i], 10);
    if(n > maxNum) maxNum = n;
  }
  if(maxNum === 0) maxNum = DEFAULT_VISIT_COUNT;
  maxNum = Math.min(MAX_VISIT_COUNT, maxNum);
  const visits = emptyVisits(maxNum);
  for(let i=0; i<blocks.length-1; i+=2){
    const num = parseInt(blocks[i], 10);
    const body = blocks[i+1] || '';
    if(!(num>=1 && num<=maxNum)) continue;
    const get = (label) => {
      const m = body.match(new RegExp(label + ':\\s*(.*)'));
      if(!m) return '';
      const v = m[1].trim();
      return v === '-' ? '' : v;
    };
    visits[num-1] = {
      time: get('방문시각').slice(0, 40),
      addr: get('주소').slice(0, LIMITS.addr),
      target: get('방문예정자명').slice(0, LIMITS.target),
      phone: get('휴대폰번호').slice(0, LIMITS.phone),
      birth: get('생년월일').slice(0, LIMITS.birth),
      note: get('특이사항').slice(0, LIMITS.note),
      visitor: get('방문담당자명').slice(0, LIMITS.visitor),
    };
  }
  const memoBlockMatch = text.match(/\[메모\]\n([\s\S]*)$/);
  const parsedMemo = memoBlockMatch ? memoBlockMatch[1].trim().slice(0, MEMO_MAX) : '';
  return { date: parsedDate, period: parsedPeriod, visits, memo: parsedMemo, hasData: hasAnyData(visits) };
}

// ---------------- 저장 (다운로드 폴더에 바로 저장) ----------------
async function doShare(){
  await flushSave();
  const html = buildReportHtml(currentDate, currentVisits, currentPeriod, currentMemo);
  // 파일명에 저장 시각(시분) 포함 → 누를 때마다 새 파일, 덮어쓰기 없음
  const filename = '방문일지_'+currentDate+'_'+PERIOD_LABEL[currentPeriod]+'_'+nowHHMM()+'.html';
  // 공유 시트(1개 항목 선택 → 파일관리자에서 수동 저장)를 거치지 않고
  // 바로 다운로드 폴더에 저장되도록 다운로드 방식만 사용.
  downloadFile(filename, html, 'text/html');
  showToast(filename+' 다운로드 폴더에 저장됨');
}

function downloadFile(filename, text, mime){
  const blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  // 즉시 해제하면 일부 브라우저에서 다운로드가 취소될 수 있어 지연 해제
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function downloadBinaryFile(filename, bytes, mime){
  const blob = new Blob([bytes], {type: mime || 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// ---------------- 방문주소 → 엑셀(.xlsx) 내보내기 ----------------
// 외부 라이브러리 없이(네트워크 요청 없이) 순수 JS로 최소 규격의 XLSX
// 파일(zip, 무압축 store 방식)을 직접 만들어낸다. 열: 주소 / 메모.
(function(){
  function crc32(bytes){
    let crcTable = crc32.table;
    if(!crcTable){
      crcTable = crc32.table = [];
      for(let n=0;n<256;n++){
        let c = n;
        for(let k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
        crcTable[n] = c >>> 0;
      }
    }
    let crc = 0 ^ (-1);
    for(let i=0;i<bytes.length;i++){
      crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ (-1)) >>> 0;
  }
  function strToBytes(str){ return new TextEncoder().encode(str); }
  function buildZip(files){
    const localParts = [], centralParts = [];
    let offset = 0;
    const time = 0, date = 0x21; // 고정 타임스탬프(1980-01-01)
    files.forEach(f => {
      const nameBytes = strToBytes(f.name);
      const data = f.data;
      const crc = crc32(data);
      const size = data.length;
      const localHeader = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, time, true);
      lv.setUint16(12, date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);
      localParts.push(localHeader, data);

      const central = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(central.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, time, true);
      cv.setUint16(14, date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      central.set(nameBytes, 46);
      centralParts.push(central);
      offset += localHeader.length + data.length;
    });
    const centralStart = offset;
    let centralSize = 0;
    centralParts.forEach(c => centralSize += c.length);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, centralStart, true);
    ev.setUint16(20, 0, true);
    const total = offset + centralSize + end.length;
    const out = new Uint8Array(total);
    let p = 0;
    localParts.forEach(part => { out.set(part, p); p += part.length; });
    centralParts.forEach(part => { out.set(part, p); p += part.length; });
    out.set(end, p);
    return out;
  }
  function xmlEscape(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }
  function colName(n){
    let s = '';
    while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }
  function buildSheetXml(rows){
    const rowXml = rows.map((row, ri) => {
      const cells = row.map((val, ci) => {
        const ref = colName(ci+1) + (ri+1);
        return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(val)+'</t></is></c>';
      }).join('');
      return '<row r="'+(ri+1)+'">'+cells+'</row>';
    }).join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetData>'+rowXml+'</sheetData></worksheet>';
  }
  function buildXlsxBytes(rows, sheetName){
    sheetName = sheetName || 'Sheet1';
    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + '</Types>';
    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '</Relationships>';
    const workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      + '<sheets><sheet name="'+xmlEscape(sheetName)+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
    const workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
      + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>';
    const stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>'
      + '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>'
      + '<borders count="1"><border/></borders>'
      + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      + '<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>'
      + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
      + '</styleSheet>';
    const sheetXml = buildSheetXml(rows);
    const files = [
      { name: '[Content_Types].xml', data: strToBytes(contentTypes) },
      { name: '_rels/.rels', data: strToBytes(rootRels) },
      { name: 'xl/workbook.xml', data: strToBytes(workbookXml) },
      { name: 'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRels) },
      { name: 'xl/styles.xml', data: strToBytes(stylesXml) },
      { name: 'xl/worksheets/sheet1.xml', data: strToBytes(sheetXml) },
    ];
    return buildZip(files);
  }
  window.__buildXlsxBytes = buildXlsxBytes;
})();

function exportTimestamp(){
  const d = new Date();
  const p = (n)=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}

// 현재 화면(오전/오후)에 입력된 카드 중 주소가 채워진 것만 골라
// [주소, 메모] 형식의 엑셀 파일로 내보낸다. 파일명: yyyyMMdd_HHmmss.xlsx
function exportAddressXlsx(){
  const filled = currentVisits.filter(v => addrFilled(v.addr));
  if(filled.length === 0){
    showToast('내보낼 방문주소가 없습니다');
    return;
  }
  const rows = [['주소','메모']];
  filled.forEach(v => rows.push([v.addr.trim(), v.note || '']));
  const bytes = window.__buildXlsxBytes(rows, 'Sheet1');
  const filename = exportTimestamp()+'.xlsx';
  downloadBinaryFile(filename, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  showToast(filename+' 다운로드 폴더에 저장됨 ('+filled.length+'건)');
}


// ---------------- 방문주소 엑셀(.xlsx) 가져오기 ----------------
// 위 내보내기와 마찬가지로 외부 네트워크 요청 없이, 이 파일 안에 압축 해제(inflate)
// 로직까지 전부 포함시켜 xlsx(zip) 파일을 직접 읽어낸다.
// inflate 구현은 tiny-inflate(devongovett/tiny-inflate, MIT License, 아래 IIFE 안에 포함)를
// 기반으로 한다.
(function(){
  // ---- tiny-inflate (MIT License, Copyright (c) 2015-present Devon Govett) ----
  // https://github.com/foliojs/tiny-inflate  (Joergen Ibsen's tiny inflate의 JS 포팅)
var TINF_OK = 0;
var TINF_DATA_ERROR = -3;

function Tree() {
  this.table = new Uint16Array(16);   /* table of code length counts */
  this.trans = new Uint16Array(288);  /* code -> symbol translation table */
}

function Data(source, dest) {
  this.source = source;
  this.sourceIndex = 0;
  this.tag = 0;
  this.bitcount = 0;
  
  this.dest = dest;
  this.destLen = 0;
  
  this.ltree = new Tree();  /* dynamic length/symbol tree */
  this.dtree = new Tree();  /* dynamic distance tree */
}

/* --------------------------------------------------- *
 * -- uninitialized global data (static structures) -- *
 * --------------------------------------------------- */

var sltree = new Tree();
var sdtree = new Tree();

/* extra bits and base tables for length codes */
var length_bits = new Uint8Array(30);
var length_base = new Uint16Array(30);

/* extra bits and base tables for distance codes */
var dist_bits = new Uint8Array(30);
var dist_base = new Uint16Array(30);

/* special ordering of code length codes */
var clcidx = new Uint8Array([
  16, 17, 18, 0, 8, 7, 9, 6,
  10, 5, 11, 4, 12, 3, 13, 2,
  14, 1, 15
]);

/* used by tinf_decode_trees, avoids allocations every call */
var code_tree = new Tree();
var lengths = new Uint8Array(288 + 32);

/* ----------------------- *
 * -- utility functions -- *
 * ----------------------- */

/* build extra bits and base tables */
function tinf_build_bits_base(bits, base, delta, first) {
  var i, sum;

  /* build bits table */
  for (i = 0; i < delta; ++i) bits[i] = 0;
  for (i = 0; i < 30 - delta; ++i) bits[i + delta] = i / delta | 0;

  /* build base table */
  for (sum = first, i = 0; i < 30; ++i) {
    base[i] = sum;
    sum += 1 << bits[i];
  }
}

/* build the fixed huffman trees */
function tinf_build_fixed_trees(lt, dt) {
  var i;

  /* build fixed length tree */
  for (i = 0; i < 7; ++i) lt.table[i] = 0;

  lt.table[7] = 24;
  lt.table[8] = 152;
  lt.table[9] = 112;

  for (i = 0; i < 24; ++i) lt.trans[i] = 256 + i;
  for (i = 0; i < 144; ++i) lt.trans[24 + i] = i;
  for (i = 0; i < 8; ++i) lt.trans[24 + 144 + i] = 280 + i;
  for (i = 0; i < 112; ++i) lt.trans[24 + 144 + 8 + i] = 144 + i;

  /* build fixed distance tree */
  for (i = 0; i < 5; ++i) dt.table[i] = 0;

  dt.table[5] = 32;

  for (i = 0; i < 32; ++i) dt.trans[i] = i;
}

/* given an array of code lengths, build a tree */
var offs = new Uint16Array(16);

function tinf_build_tree(t, lengths, off, num) {
  var i, sum;

  /* clear code length count table */
  for (i = 0; i < 16; ++i) t.table[i] = 0;

  /* scan symbol lengths, and sum code length counts */
  for (i = 0; i < num; ++i) t.table[lengths[off + i]]++;

  t.table[0] = 0;

  /* compute offset table for distribution sort */
  for (sum = 0, i = 0; i < 16; ++i) {
    offs[i] = sum;
    sum += t.table[i];
  }

  /* create code->symbol translation table (symbols sorted by code) */
  for (i = 0; i < num; ++i) {
    if (lengths[off + i]) t.trans[offs[lengths[off + i]]++] = i;
  }
}

/* ---------------------- *
 * -- decode functions -- *
 * ---------------------- */

/* get one bit from source stream */
function tinf_getbit(d) {
  /* check if tag is empty */
  if (!d.bitcount--) {
    /* load next tag */
    d.tag = d.source[d.sourceIndex++];
    d.bitcount = 7;
  }

  /* shift bit out of tag */
  var bit = d.tag & 1;
  d.tag >>>= 1;

  return bit;
}

/* read a num bit value from a stream and add base */
function tinf_read_bits(d, num, base) {
  if (!num)
    return base;

  while (d.bitcount < 24) {
    d.tag |= d.source[d.sourceIndex++] << d.bitcount;
    d.bitcount += 8;
  }

  var val = d.tag & (0xffff >>> (16 - num));
  d.tag >>>= num;
  d.bitcount -= num;
  return val + base;
}

/* given a data stream and a tree, decode a symbol */
function tinf_decode_symbol(d, t) {
  while (d.bitcount < 24) {
    d.tag |= d.source[d.sourceIndex++] << d.bitcount;
    d.bitcount += 8;
  }
  
  var sum = 0, cur = 0, len = 0;
  var tag = d.tag;

  /* get more bits while code value is above sum */
  do {
    cur = 2 * cur + (tag & 1);
    tag >>>= 1;
    ++len;

    sum += t.table[len];
    cur -= t.table[len];
  } while (cur >= 0);
  
  d.tag = tag;
  d.bitcount -= len;

  return t.trans[sum + cur];
}

/* given a data stream, decode dynamic trees from it */
function tinf_decode_trees(d, lt, dt) {
  var hlit, hdist, hclen;
  var i, num, length;

  /* get 5 bits HLIT (257-286) */
  hlit = tinf_read_bits(d, 5, 257);

  /* get 5 bits HDIST (1-32) */
  hdist = tinf_read_bits(d, 5, 1);

  /* get 4 bits HCLEN (4-19) */
  hclen = tinf_read_bits(d, 4, 4);

  for (i = 0; i < 19; ++i) lengths[i] = 0;

  /* read code lengths for code length alphabet */
  for (i = 0; i < hclen; ++i) {
    /* get 3 bits code length (0-7) */
    var clen = tinf_read_bits(d, 3, 0);
    lengths[clcidx[i]] = clen;
  }

  /* build code length tree */
  tinf_build_tree(code_tree, lengths, 0, 19);

  /* decode code lengths for the dynamic trees */
  for (num = 0; num < hlit + hdist;) {
    var sym = tinf_decode_symbol(d, code_tree);

    switch (sym) {
      case 16:
        /* copy previous code length 3-6 times (read 2 bits) */
        var prev = lengths[num - 1];
        for (length = tinf_read_bits(d, 2, 3); length; --length) {
          lengths[num++] = prev;
        }
        break;
      case 17:
        /* repeat code length 0 for 3-10 times (read 3 bits) */
        for (length = tinf_read_bits(d, 3, 3); length; --length) {
          lengths[num++] = 0;
        }
        break;
      case 18:
        /* repeat code length 0 for 11-138 times (read 7 bits) */
        for (length = tinf_read_bits(d, 7, 11); length; --length) {
          lengths[num++] = 0;
        }
        break;
      default:
        /* values 0-15 represent the actual code lengths */
        lengths[num++] = sym;
        break;
    }
  }

  /* build dynamic trees */
  tinf_build_tree(lt, lengths, 0, hlit);
  tinf_build_tree(dt, lengths, hlit, hdist);
}

/* ----------------------------- *
 * -- block inflate functions -- *
 * ----------------------------- */

/* given a stream and two trees, inflate a block of data */
function tinf_inflate_block_data(d, lt, dt) {
  while (1) {
    var sym = tinf_decode_symbol(d, lt);

    /* check for end of block */
    if (sym === 256) {
      return TINF_OK;
    }

    if (sym < 256) {
      d.dest[d.destLen++] = sym;
    } else {
      var length, dist, offs;
      var i;

      sym -= 257;

      /* possibly get more bits from length code */
      length = tinf_read_bits(d, length_bits[sym], length_base[sym]);

      dist = tinf_decode_symbol(d, dt);

      /* possibly get more bits from distance code */
      offs = d.destLen - tinf_read_bits(d, dist_bits[dist], dist_base[dist]);

      /* copy match */
      for (i = offs; i < offs + length; ++i) {
        d.dest[d.destLen++] = d.dest[i];
      }
    }
  }
}

/* inflate an uncompressed block of data */
function tinf_inflate_uncompressed_block(d) {
  var length, invlength;
  var i;
  
  /* unread from bitbuffer */
  while (d.bitcount > 8) {
    d.sourceIndex--;
    d.bitcount -= 8;
  }

  /* get length */
  length = d.source[d.sourceIndex + 1];
  length = 256 * length + d.source[d.sourceIndex];

  /* get one's complement of length */
  invlength = d.source[d.sourceIndex + 3];
  invlength = 256 * invlength + d.source[d.sourceIndex + 2];

  /* check length */
  if (length !== (~invlength & 0x0000ffff))
    return TINF_DATA_ERROR;

  d.sourceIndex += 4;

  /* copy block */
  for (i = length; i; --i)
    d.dest[d.destLen++] = d.source[d.sourceIndex++];

  /* make sure we start next block on a byte boundary */
  d.bitcount = 0;

  return TINF_OK;
}

/* inflate stream from source to dest */
function tinf_uncompress(source, dest) {
  var d = new Data(source, dest);
  var bfinal, btype, res;

  do {
    /* read final block flag */
    bfinal = tinf_getbit(d);

    /* read block type (2 bits) */
    btype = tinf_read_bits(d, 2, 0);

    /* decompress block */
    switch (btype) {
      case 0:
        /* decompress uncompressed block */
        res = tinf_inflate_uncompressed_block(d);
        break;
      case 1:
        /* decompress block with fixed huffman trees */
        res = tinf_inflate_block_data(d, sltree, sdtree);
        break;
      case 2:
        /* decompress block with dynamic huffman trees */
        tinf_decode_trees(d, d.ltree, d.dtree);
        res = tinf_inflate_block_data(d, d.ltree, d.dtree);
        break;
      default:
        res = TINF_DATA_ERROR;
    }

    if (res !== TINF_OK)
      throw new Error('Data error');

  } while (!bfinal);

  if (d.destLen < d.dest.length) {
    if (typeof d.dest.slice === 'function')
      return d.dest.slice(0, d.destLen);
    else
      return d.dest.subarray(0, d.destLen);
  }
  
  return d.dest;
}

/* -------------------- *
 * -- initialization -- *
 * -------------------- */

/* build fixed huffman trees */
tinf_build_fixed_trees(sltree, sdtree);

/* build extra bits and base tables */
tinf_build_bits_base(length_bits, length_base, 4, 3);
tinf_build_bits_base(dist_bits, dist_base, 2, 1);

/* fix a special case */
length_bits[28] = 0;
length_base[28] = 258;



  // ---- 여기까지 tiny-inflate ----

  function readZipEntries(bytes){
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocdOffset = -1;
    const searchStart = Math.max(0, bytes.length - 22 - 65557);
    for(let i = bytes.length - 22; i >= searchStart; i--){
      if(dv.getUint32(i, true) === 0x06054b50){ eocdOffset = i; break; }
    }
    if(eocdOffset < 0) throw new Error('ZIP EOCD not found');
    const entryCount = dv.getUint16(eocdOffset + 10, true);
    const centralDirOffset = dv.getUint32(eocdOffset + 16, true);

    const entries = {};
    let p = centralDirOffset;
    for(let i=0; i<entryCount; i++){
      if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('bad central dir entry');
      const method = dv.getUint16(p+10, true);
      const compSize = dv.getUint32(p+20, true);
      const uncompSize = dv.getUint32(p+24, true);
      const nameLen = dv.getUint16(p+28, true);
      const extraLen = dv.getUint16(p+30, true);
      const commentLen = dv.getUint16(p+32, true);
      const localHeaderOffset = dv.getUint32(p+42, true);
      const name = new TextDecoder('utf-8').decode(bytes.slice(p+46, p+46+nameLen));
      entries[name] = { method, compSize, uncompSize, localHeaderOffset };
      p += 46 + nameLen + extraLen + commentLen;
    }

    function getFile(name){
      const e = entries[name];
      if(!e) return null;
      const lp = e.localHeaderOffset;
      if(dv.getUint32(lp, true) !== 0x04034b50) throw new Error('bad local header');
      const nameLen = dv.getUint16(lp+26, true);
      const extraLen = dv.getUint16(lp+28, true);
      const dataStart = lp + 30 + nameLen + extraLen;
      const compData = bytes.slice(dataStart, dataStart + e.compSize);
      if(e.method === 0){
        return compData;
      } else if(e.method === 8){
        const out = new Uint8Array(e.uncompSize);
        tinf_uncompress(compData, out);
        return out;
      } else {
        throw new Error('지원하지 않는 압축 방식(' + e.method + ')입니다');
      }
    }
    return { entries, getFile };
  }

  function bytesToStr(bytes){ return new TextDecoder('utf-8').decode(bytes); }

  function decodeXmlEntities(s){
    return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
      .replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  }

  function parseSharedStrings(xml){
    if(!xml) return [];
    const result = [];
    const siRe = /<(?:\w+:)?si\b[^>]*>([\s\S]*?)<\/(?:\w+:)?si>/g;
    let m;
    while((m = siRe.exec(xml))){
      const siContent = m[1];
      const tRe = /<(?:\w+:)?t\b[^>]*>([\s\S]*?)<\/(?:\w+:)?t>/g;
      let tm, text = '';
      while((tm = tRe.exec(siContent))){ text += tm[1]; }
      result.push(decodeXmlEntities(text));
    }
    return result;
  }

  function colToIndex(colLetters){
    let n = 0;
    for(let i=0;i<colLetters.length;i++){ n = n*26 + (colLetters.charCodeAt(i) - 64); }
    return n; // 1-indexed
  }

  function parseSheetRows(xml, sharedStrings){
    const rows = [];
    const rowRe = /<(?:\w+:)?row\b[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/(?:\w+:)?row>/g;
    let rm;
    while((rm = rowRe.exec(xml))){
      const rowNum = parseInt(rm[1], 10);
      const rowContent = rm[2];
      const cellRe = /<(?:\w+:)?c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?c>)/g;
      let cm;
      const rowArr = [];
      while((cm = cellRe.exec(rowContent))){
        const attrs = cm[1];
        const inner = cm[2] || '';
        const refMatch = attrs.match(/r="([A-Z]+)(\d+)"/);
        if(!refMatch) continue;
        const colIdx = colToIndex(refMatch[1]) - 1;
        const typeMatch = attrs.match(/t="([^"]+)"/);
        const type = typeMatch ? typeMatch[1] : 'n';
        let value = '';
        if(type === 'inlineStr'){
          const tMatch = inner.match(/<(?:\w+:)?t\b[^>]*>([\s\S]*?)<\/(?:\w+:)?t>/);
          value = tMatch ? decodeXmlEntities(tMatch[1]) : '';
        } else if(type === 's'){
          const vMatch = inner.match(/<(?:\w+:)?v>([\s\S]*?)<\/(?:\w+:)?v>/);
          const idx = vMatch ? parseInt(vMatch[1], 10) : -1;
          value = (sharedStrings && sharedStrings[idx] !== undefined) ? sharedStrings[idx] : '';
        } else {
          const vMatch = inner.match(/<(?:\w+:)?v>([\s\S]*?)<\/(?:\w+:)?v>/);
          value = vMatch ? decodeXmlEntities(vMatch[1]) : '';
        }
        rowArr[colIdx] = value;
      }
      rows[rowNum - 1] = rowArr;
    }
    for(let i=0;i<rows.length;i++){ if(!rows[i]) rows[i] = []; }
    return rows;
  }

  // xlsx 파일(Uint8Array)의 첫 번째 시트를 [[셀,셀,...], ...] 형태로 반환
  function parseXlsxFirstSheet(bytes){
    const zip = readZipEntries(bytes);
    let sheetPath = 'xl/worksheets/sheet1.xml';
    try{
      const wbXml = bytesToStr(zip.getFile('xl/workbook.xml'));
      const relsXml = bytesToStr(zip.getFile('xl/_rels/workbook.xml.rels'));
      const sheetMatch = wbXml.match(/<(?:\w+:)?sheet\b[^>]*r:id="([^"]+)"[^>]*\/>/) || wbXml.match(/<(?:\w+:)?sheet\b[^>]*\/>/);
      let rId = null;
      if(sheetMatch){
        const ridMatch = sheetMatch[0].match(/r:id="([^"]+)"/);
        if(ridMatch) rId = ridMatch[1];
      }
      if(rId && relsXml){
        const relRe = new RegExp('<Relationship\\s+Id="'+rId+'"[^>]*Target="([^"]+)"');
        const relMatch = relsXml.match(relRe);
        if(relMatch){
          let target = relMatch[1];
          target = target.startsWith('/') ? target.slice(1) : ('xl/' + target.replace(/^\.?\//, ''));
          sheetPath = target;
        }
      }
    }catch(e){ /* 실패 시 기본 경로(xl/worksheets/sheet1.xml) 사용 */ }

    const sheetXmlBytes = zip.getFile(sheetPath) || zip.getFile('xl/worksheets/sheet1.xml');
    if(!sheetXmlBytes) throw new Error('시트를 찾을 수 없습니다');
    const sheetXml = bytesToStr(sheetXmlBytes);
    let sharedStrings = [];
    const ssBytes = zip.getFile('xl/sharedStrings.xml');
    if(ssBytes) sharedStrings = parseSharedStrings(bytesToStr(ssBytes));
    return parseSheetRows(sheetXml, sharedStrings);
  }

  window.__parseXlsxFirstSheet = parseXlsxFirstSheet;
})();

// 엑셀 파일(주소/메모 열)을 읽어 카드의 방문주소(및 특이사항)에 그대로 채워 넣는다.
// - 헤더 행에서 '주소'/'메모' 열을 찾고, 없으면 A열=주소, B열=메모로 간주한다.
// - 카드가 부족하면(불러온 주소 수 > 현재 카드 수) 최대 개수(MAX_VISIT_COUNT)까지 자동으로 늘린다.
// - 이미 내용이 입력된 카드를 덮어쓰게 되는 경우에는 진행 전에 한 번 확인한다.
async function importAddressXlsx(file){
  let bytes;
  try{
    bytes = new Uint8Array(await file.arrayBuffer());
  }catch(e){
    showToast('파일을 읽지 못했습니다');
    return;
  }

  let rows;
  try{
    rows = window.__parseXlsxFirstSheet(bytes);
  }catch(e){
    showToast('엑셀 파일을 해석하지 못했습니다');
    return;
  }
  if(!rows || rows.length === 0){
    showToast('엑셀 파일에 내용이 없습니다');
    return;
  }

  let addrCol = 0, memoCol = 1, dataStart = 0;
  const header = rows[0] || [];
  const hAddr = header.findIndex(c => (c||'').toString().trim() === '주소');
  const hMemo = header.findIndex(c => (c||'').toString().trim() === '메모');
  if(hAddr !== -1){ addrCol = hAddr; dataStart = 1; }
  if(hMemo !== -1){ memoCol = hMemo; }

  const items = [];
  for(let i=dataStart; i<rows.length; i++){
    const row = rows[i] || [];
    const addr = (row[addrCol] || '').toString().trim();
    if(!addr) continue;
    const memo = (row[memoCol] || '').toString().trim();
    items.push({ addr, memo });
  }
  if(items.length === 0){
    showToast('가져올 방문주소가 없습니다');
    return;
  }

  let truncated = false;
  if(items.length > MAX_VISIT_COUNT){
    items.length = MAX_VISIT_COUNT;
    truncated = true;
  }

  const willOverwrite = items.some((_, i) => {
    const v = currentVisits[i];
    return v && (addrFilled(v.addr) || v.target || v.phone || v.birth || v.note || v.time || v.visitor);
  });
  if(willOverwrite){
    const ok = await appConfirm({
      title: '이미 입력된 내용을 덮어쓸까요?',
      msg: '엑셀의 주소 ' + items.length + '건으로 앞에서부터 덮어씁니다.\n'
         + '덮어쓴 자리의 기존 내용은 되돌릴 수 없습니다.',
      okText: '덮어쓰기', cancelText: '취소', danger: true,
    });
    if(!ok) return;
  }

  while(currentVisits.length < items.length){
    currentVisits.push({addr:ADDR_PREFIX,name:'',changed:'',note:'',time:'',visitor:'',order:''});
  }
  items.forEach((item, i) => {
    currentVisits[i].addr = item.addr;
    if(item.memo) currentVisits[i].note = item.memo;
  });

  renderCards();
  scheduleSave();
  showToast('방문주소 ' + items.length + '건을 가져왔습니다' + (truncated ? ' (최대 ' + MAX_VISIT_COUNT + '개까지만 반영됨)' : ''));
}

});

// ---------------- 불러오기 (.txt / .json 모두 지원) ----------------
async function doImport(file){
  let text;
  try{
    text = await file.text();
  }catch(e){
    showToast('파일을 읽지 못했습니다');
    return;
  }

  let date = null, period = null, memo = null, visits = emptyVisits(), hasData = false;
  try{
    const trimmed = text.trim();
    const isJsonName = /\.json$/i.test(file.name || '');
    const isHtmlName = /\.html?$/i.test(file.name || '');
    if(isHtmlName || trimmed.indexOf('id="visit-log-data"') !== -1){
      // v12 HTML 리포트 파일: 내장된 JSON 데이터로 복원
      const d = extractReportHtmlJson(trimmed);
      if(!d){ showToast('HTML 파일에서 기록을 찾지 못했습니다'); return; }
      visits = normalizeVisits(d.visits);
      hasData = hasAnyData(visits);
      date = (d.date && DATE_KEY_RE.test(d.date)) ? d.date : null;
      period = (d.period === 'AM' || d.period === 'PM') ? d.period : null;
      memo = (typeof d.memo === 'string') ? d.memo.slice(0, MEMO_MAX) : null;
    } else if(isJsonName || trimmed.charAt(0) === '{' || trimmed.charAt(0) === '['){
      // JSON 저장 파일 (앱/웹의 내부 저장 형식)
      const parsed = JSON.parse(trimmed);
      visits = normalizeVisits(parsed);
      hasData = hasAnyData(visits);
      const dm = (file.name || '').match(/(\d{4}-\d{2}-\d{2})/);
      date = dm ? dm[1] : null;
    } else {
      // 텍스트 리포트 파일
      const r = parseReportText(text);
      date = r.date; period = r.period; visits = r.visits; memo = r.memo; hasData = r.hasData;
    }
  }catch(e){
    showToast('파일 내용을 해석하지 못했습니다');
    return;
  }

  if(!hasData){
    showToast('파일에서 기록을 찾지 못했습니다');
    return;
  }

  await flushSave();
  if(date && DATE_KEY_RE.test(date)) currentDate = date;
  if(period) currentPeriod = period;
  currentView = currentPeriod;
  currentVisits = visits;
  $('dateInput').value = currentDate;
  $('weekdayLabel').textContent = weekdayShortKR(currentDate);
  updatePeriodUI();
  renderCards();
  await saveCurrent();
  if(memo){
    currentMemo = memo;
    const ta = $('memoText');
    if(ta) ta.value = currentMemo;
    updateMemoCount();
    await saveMemoCurrent();
  }
  switchTab('day');
  showToast(currentDate+' ('+PERIOD_LABEL[currentPeriod]+') 기록을 불러왔습니다');
}

$('importFile').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(file) doImport(file);

});

async function doCopy(){

    showToast('클립보드에 복사했습니다');
  }catch(e){
    // 구형 브라우저 폴백
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('클립보드에 복사했습니다');
    }catch(e2){
      showToast('복사 실패 — 직접 선택해 복사해주세요');
    }
  }
}

// ---------------- 날짜 이동 ----------------
async function shiftDate(deltaDays){
  await flushSave();
  const d = new Date(currentDate+'T00:00:00');
  d.setDate(d.getDate()+deltaDays);
  const next = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  loadDate(next);
}

// ---------------- 빠른 검색 (v9) ----------------
// 카드 1장을 하나의 그룹으로 보고, 주소/방문예정자명/휴대폰번호/생년월일/특이사항/담당자/시각 중
// 하나라도 검색 단어를 포함하면 해당 카드 전체를 결과에 나열한다.
// 모든 날짜의 저장 기록을 대상으로 한다.
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(text, query){
  const safe = escapeHtml(text);
  if(!query) return safe;
  const re = new RegExp(escapeRegExp(escapeHtml(query)), 'gi');
  return safe.replace(re, (m)=>'<mark>'+m+'</mark>');
}

async function doSearch(){
  const q = $('searchInput').value.trim();
  if(!q){ showToast('검색어를 입력하세요'); return; }
  await flushSave(); // 입력 직후 저장 대기 중인 내용도 검색에 포함
  const query = q.toLowerCase();
  const scope = $('searchScope').value; // all 또는 특정 필드 키
  const searchFields = scope === 'all'
    ? ['visitor','addr','target','phone','birth','note','time']
    : [scope];
  const results = [];
  try{
    const res = await storage.list('visit-log:');
    const keys = (res && res.keys ? res.keys : [])
      .filter(k => DATE_KEY_FULL_RE.test(k))
      .sort().reverse(); // 최신 날짜부터 (같은 날짜면 오후→오전 순으로 뒤집힘, 아래서 date+period로 다시 정렬)
    for(const k of keys){
      const m = k.match(DATE_KEY_FULL_RE);
      const dateStr = m[1];
      const period = m[2] || 'AM'; // 접미사 없으면 v19 이전 레거시 = 오전 취급
      let visits = emptyVisits();
      try{
        const r = await storage.get(k);
        const parsed = r && r.value ? JSON.parse(r.value) : null;
        visits = normalizeVisits(parsed);
      }catch(e){ continue; } // 깨진 기록은 건너뜀
      visits.forEach((v, idx) => {
        if(!(addrFilled(v.addr)||v.target||v.phone||v.birth||v.note||v.time||v.visitor)) return;
        // 어느 항목이 일치했는지 함께 기록 (결과에 '일치 항목'으로 표시)
        const matched = [];
        searchFields.forEach((k)=>{
          if(String(v[k]||'').toLowerCase().indexOf(query) !== -1){
            matched.push(FIELD_LABEL[k]);
          }
        });
        if(matched.length > 0){
          // total: 그 기록의 실제 카드 수 (v23까지는 화면에 항상 '/ 4'로 찍혔음)
          results.push({ date: dateStr, period: period, idx: idx, total: visits.length, visit: v, matched: matched });
        }
      });
    }
    results.sort((a,b) => (a.date+a.period < b.date+b.period ? 1 : -1));
  }catch(e){
    showToast('검색 중 오류가 발생했습니다');
    return;
  }
  renderSearchResults(q, results, $('searchScope').selectedOptions[0].textContent);
}

function renderSearchResults(query, results, scopeLabel){
  $('searchMeta').textContent = '"' + query + '"' + (scopeLabel && scopeLabel !== '전체' ? ' [범위: ' + scopeLabel + ']' : '') + ' 검색 결과: ' + results.length + '건';
  const wrap = $('searchResults');
  wrap.innerHTML = '';
  if(results.length === 0){
    wrap.innerHTML = '<div class="empty">검색 결과가 없습니다</div>';
  }
  results.forEach((r) => {
    const v = r.visit;
    // 결과 카드도 입력 폼과 같은 순서: 담당자명이 맨 위
    const rows = [
      ['방문담당자명', v.visitor || '-'],
      ['방문시각', v.time || '-'],
      ['주소', v.addr || '-'],
      ['방문예정자명', v.target || '-'],
      ['휴대폰번호', v.phone || '-'],
      ['생년월일', v.birth || '-'],
    ];
    if(v.birth) rows.push(['나이', ageLabel(v.birth)]);
    rows.push(['특이사항', v.note || '-']);

    const card = document.createElement('div');
    card.className = 'card result-card';
    card.innerHTML =
      '<div class="card-head">'
      + '<div class="stub-num">' + (r.idx+1) + '</div>'
      + '<div class="result-head-main">'
      +   '<div class="result-date">' + r.date + ' (' + weekdayKR(r.date) + ') · ' + PERIOD_LABEL[r.period] + ' · 방문 ' + (r.idx+1) + ' / ' + (r.total || currentVisits.length) + '</div>'
      +   '<div class="result-visitor">' + highlight(v.visitor || '(담당자 없음)', query) + '</div>'
      + '</div>'
      + '</div>'
      + '<div class="result-body">'
      + '<div class="result-row"><div class="rk">일치 항목</div><div class="rv">'
      +   r.matched.map((m)=>'<span class="result-match">' + m + '</span>').join(' ')
      + '</div></div>'
      + rows.map((row) =>
          '<div class="result-row"><div class="rk">' + row[0] + '</div>'
          + '<div class="rv">' + highlight(row[1], query) + '</div></div>'
        ).join('')
      + '</div>';
    // 결과 카드를 누르면 해당 날짜의 기록으로 이동
    card.addEventListener('click', async ()=>{
      await flushSave();
      loadDate(r.date, r.period);
      clearSearch();
      showToast(r.date + ' (' + PERIOD_LABEL[r.period] + ') 기록으로 이동했습니다');
    });
    wrap.appendChild(card);
  });
  showSearchView(true);
}

function showSearchView(show){
  const searchView = $('searchView');
  if(show){
    $('dayView').classList.add('hide');
    $('historyView').classList.remove('show');
    searchView.classList.add('show');
    $('actionbar').classList.add('hide');
    $('tabDay').classList.remove('active');
    $('tabHistory').classList.remove('active');
  } else {
    searchView.classList.remove('show');
    $('actionbar').classList.remove('hide');
    $('historyView').classList.remove('show');
    $('dayView').classList.remove('hide');
    $('tabHistory').classList.remove('active');
    $('tabDay').classList.add('active');
  }
}

// v24: 검색줄은 평소엔 접혀 있고 돋보기 버튼으로 펼친다.
function openSearchBar(){
  $('searchBar').classList.add('show');
  $('searchToggle').classList.add('active');
  $('searchInput').focus();
}
function clearSearch(){
  $('searchInput').value = '';
  $('searchBar').classList.remove('show');
  $('searchToggle').classList.remove('active');
  showSearchView(false);
}

$('searchToggle').addEventListener('click', ()=>{
  if($('searchBar').classList.contains('show')) clearSearch();
  else openSearchBar();
});
$('searchBtn').addEventListener('click', doSearch);
$('searchInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); doSearch(); }
});

// ---------------- 지난 기록 ----------------
async function renderHistory(){
  const listEl = $('historyList');
  listEl.innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    const res = await storage.list('visit-log:');
    const keys = (res && res.keys ? res.keys : [])
      .filter(k => DATE_KEY_FULL_RE.test(k)) // 깨진 키(설정/백업 등) 제외
      .sort().reverse();
    if(keys.length === 0){
      listEl.innerHTML = '<div class="empty">저장된 기록이 없습니다</div>';
      return;
    }
    listEl.innerHTML = '';
    let shown = 0;
    const rows = [];
    for(const k of keys){
      const m = k.match(DATE_KEY_FULL_RE);
      const dateStr = m[1];
      const period = m[2] || 'AM'; // 접미사 없으면 v19 이전 레거시 = 오전 취급
      let visits = emptyVisits();
      try{
        const r = await storage.get(k);
        const parsed = r && r.value ? JSON.parse(r.value) : null;
        visits = normalizeVisits(parsed);
      }catch(e){ continue; }
      const filled = countFilled(visits);
      if(filled === 0) continue;
      rows.push({ dateStr, period, filled });
    }
    rows.sort((a,b) => (a.dateStr+a.period < b.dateStr+b.period ? 1 : -1));
    rows.forEach(({dateStr, period, filled}) => {
      shown++;
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.innerHTML = '<div><div class="hist-date">'+dateStr+' · '+PERIOD_LABEL[period]+'</div>'
        + '<div class="hist-meta">'+weekdayKR(dateStr)+'</div></div>'
        + '<div class="hist-count">'+filled+'건</div>';
      item.addEventListener('click', async ()=>{
        await flushSave();
        loadDate(dateStr, period);
        switchTab('day');
      });
      listEl.appendChild(item);
    });
    if(shown === 0){
      listEl.innerHTML = '<div class="empty">저장된 기록이 없습니다</div>';
    }
  }catch(e){
    listEl.innerHTML = '<div class="empty">기록을 불러오지 못했습니다</div>';
  }
}

function switchTab(tab){
  const dayView = $('dayView');
  const histView = $('historyView');
  const tabDay = $('tabDay');
  const tabHist = $('tabHistory');
  const actionbar = $('actionbar');
  // 탭 전환 시 검색 결과와 검색줄은 닫는다
  $('searchView').classList.remove('show');
  $('searchBar').classList.remove('show');
  $('searchToggle').classList.remove('active');
  if(tab==='day'){
    dayView.classList.remove('hide'); histView.classList.remove('show');
    tabDay.classList.add('active'); tabHist.classList.remove('active');
    actionbar.classList.remove('hide');
  } else {
    dayView.classList.add('hide'); histView.classList.add('show');
    tabHist.classList.add('active'); tabDay.classList.remove('active');
    actionbar.classList.add('hide');
    renderHistory();
  }
}
